<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Chargement | Éditions TBL</title>
<style>
/* Page d'attente : adresse réglée dans l'éditeur Wix pour une composante que le code de la page remplace dès
   onReady (ex. Espace Lecteur, page Dashboard Lecteurs). La vraie composante n'est ainsi chargée qu'une fois.
   Même loader que espace-lecteur.html (jetons de Templates\tokens.css, copiés : fichier autonome). */
:root{--tbl-bg:#000;--tbl-paper:#16181c;--tbl-line:#34373e;--tbl-muted:#b7bac2;--tbl-accent:#e52530;--tbl-font-body:Arial,Helvetica,sans-serif;--tbl-radius:14px}
*{box-sizing:border-box}
html,body{background:var(--tbl-bg)}
body{margin:0;color:var(--tbl-muted);font-family:var(--tbl-font-body);line-height:1.55}
.wrap{width:min(1160px,calc(100% - 28px));margin:auto}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--tbl-paper);border:1px solid var(--tbl-line);border-radius:var(--tbl-radius);padding:26px;text-align:center;max-width:640px;margin:10px auto 0}
.spin{width:38px;height:38px;border:3px solid var(--tbl-line);border-top-color:var(--tbl-accent);border-radius:50%;margin:0 auto 14px;animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
p{margin:0}
</style>
</head>
<body>
<main class="wrap">
  <section class="card" role="status" aria-live="polite">
    <div class="spin" aria-hidden="true"></div>
    <p>Chargement de votre espace…</p>
  </section>
</main>
</body>
</html>
