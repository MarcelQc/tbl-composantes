<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Accueil | Éditions TBL</title>
<!--
  Accueil générique, affiché le temps de savoir qui est connecté (visiteur, lecteur ou auteur) : la marque et un indicateur d'attente seulement.
  Composante de la page d'accueil du site : le code de la page (ACCUEIL, dépôt editionstbl) n'affiche que la section
  qui correspond à la personne (sectionVisiteur, sectionLecteur ou sectionAuteur).
  Prototype d'origine : Marketing\Prototypes\accueil-auteurs.html et accueil-lecteurs.html (livré le 21 novembre 2026).
  Variables à adapter : textes, boutons (adresses du site), images dans accueil-images\ (fond-frontenac.webp, marque-tbl.webp).
  Les liens s'ouvrent dans la page du site (target="_top"), pas dans le cadre de la composante.
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
/* Marque : titre et ornement du site, à conserver */
.marque{position:relative;z-index:2;text-align:center;padding:26px 16px 0;font-family:"Cinzel Decorative","Cinzel",Georgia,"Times New Roman",serif;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.marque .nom{font-size:clamp(34px,6vw,64px);font-weight:700;letter-spacing:.07em;text-transform:uppercase;line-height:1.1}
.marque .nom img{display:block;width:min(560px,92vw);height:auto;margin:-28px auto -34px}
.marque .desc{font-family:"Cinzel",Georgia,serif;font-size:clamp(15px,2.4vw,26px);font-weight:700;letter-spacing:.3em;text-transform:uppercase;margin-top:12px}
.marque .desc2{font-family:"Cinzel",Georgia,serif;font-size:clamp(10px,1.4vw,15px);font-weight:700;font-style:italic;letter-spacing:.14em;text-transform:uppercase;margin-top:10px;color:#f0d9a8}
.marque .orn{display:flex;align-items:center;justify-content:center;max-width:520px;margin:16px auto 0}
.marque .orn::before,.marque .orn::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#a3141c)}
.marque .orn::after{background:linear-gradient(270deg,transparent,#a3141c)}
.marque .orn i{width:18px;height:18px;background:#b3171f;transform:rotate(45deg);margin:0 14px;border:2px solid #e52530;box-shadow:0 0 10px rgba(229,37,48,.6)}
/* Couleurs et espacements : Templates\tokens.css */
:root{
  --tbl-bg:#000; --tbl-paper:#16181c; --tbl-line:#34373e;
  --tbl-ink:#f5f5f5; --tbl-muted:#b7bac2; --tbl-accent:#e52530; --tbl-orange:#e8a33d;
  --tbl-font-body:Arial,Helvetica,sans-serif;
  --tbl-space-xs:8px; --tbl-space-sm:16px; --tbl-space-md:24px; --tbl-space-lg:40px;
  --tbl-radius:14px; --tbl-radius-btn:9px;
  --fond:url("accueil-images/fond-frontenac.webp");
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--tbl-bg);color:var(--tbl-ink);font-family:var(--tbl-font-body);line-height:1.55}
a{color:inherit}
.heros{position:relative;display:flex;flex-direction:column;justify-content:flex-start}
.heros::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,var(--tbl-bg))}
.heros .contenu{position:relative;z-index:1;margin:0 auto;width:100%;text-align:center}
.etiquette{display:inline-block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--tbl-orange);margin-bottom:var(--tbl-space-sm)}
h1{font-size:clamp(32px,5.4vw,60px);line-height:1.08;margin:0 auto var(--tbl-space-sm)}
.heros p.sous{font-size:clamp(17px,2vw,21px);max-width:34em;color:#ececec;margin:0 auto var(--tbl-space-md)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;background:var(--tbl-accent);color:#fff;font-weight:700;font-size:16px;padding:14px 22px;border:0;border-radius:var(--tbl-radius-btn);cursor:pointer;text-decoration:none;font-family:inherit}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn.sec{background:rgba(0,0,0,.4);border:1px solid #fff;padding:13px 21px}
.btn.sec:hover{background:#fff;color:#000;filter:none}
.btn .ico{width:1.5em;height:1.5em;border-radius:50%;vertical-align:middle;margin:-3px 8px 0 -4px}
.btn.petit{padding:9px 14px;font-size:14px}
/* Héros (visiteur et lecteur) : texte en bas de l'image */
.heros{background:linear-gradient(rgba(0,0,0,.35) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,.85) 100%),var(--fond) 58% center/cover no-repeat #000}
.heros .contenu{max-width:900px;padding:var(--tbl-space-md) var(--tbl-space-md) 40px}
h1{text-shadow:0 2px 14px rgba(0,0,0,.6)}
.heros p.sous{text-shadow:0 1px 8px rgba(0,0,0,.7)}
/* Auteurs : renvoi discret */
.renvoi{max-width:1100px;margin:0 auto;padding:0 var(--tbl-space-md) var(--tbl-space-lg)}
.renvoi div{display:flex;flex-wrap:wrap;gap:var(--tbl-space-sm);align-items:center;justify-content:space-between;background:var(--tbl-paper);border:1px solid var(--tbl-line);border-radius:var(--tbl-radius);padding:var(--tbl-space-md)}
.renvoi p{margin:0;color:var(--tbl-muted);max-width:38em}.renvoi b{color:var(--tbl-ink)}
.heros{min-height:100vh}
.attente{display:flex;align-items:center;justify-content:center;min-height:200px}
.roue{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:tourne 1s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.roue{animation:none}}
</style>
</head>
<body>
<header class="heros">
  <div class="marque">
    <div class="nom"><img src="accueil-images/marque-tbl.webp" alt="Éditions TBL" width="1120" height="373"></div>
    <div class="desc">Maison d’édition québécoise</div>
    <div class="desc2">Auteurs francophones - Tous les genres littéraires</div>
    <div class="orn"><i></i></div>
  </div>
  <div class="contenu">
    <div class="attente" role="status" aria-label="Chargement de l’accueil"><span class="roue" aria-hidden="true"></span></div>
  </div>
</header>
<script>
(function () {
  var a = document.getElementById('liseuse-extraits');
  if (a) { a.href = a.href + '&v=' + Date.now(); }
})();
</script>
</body>
</html>
