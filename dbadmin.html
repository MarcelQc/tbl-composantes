  /* ----- Petite boîte calendrier : changer la date d'une rencontre active ----- */

  // N'importe quelle date est permise, passée ou à venir. Le serveur refuse seulement une date
  // déjà prise par une autre rencontre ; le message s'affiche alors dans la boîte.
  var ICONE_CALENDRIER =
    '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor"' +
    ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>';
  var JOURS_COURTS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  var calendrierEl = null;

  function fermerCalendrier() {
    if (calendrierEl) calendrierEl.remove();
    calendrierEl = null;
  }

  function isoDuJour(annee, mois, jour) {
    return annee + '-' + String(mois + 1).padStart(2, '0') + '-' + String(jour).padStart(2, '0');
  }

  // ancre : bouton sous lequel la boîte s'ouvre ; cle : identifie la boîte (un 2e clic la referme) ;
  // choisir(date) : enregistre la date choisie (null = « Date à déterminer ») et renvoie une promesse ;
  // options.indeterminee : affiche le lien « Date à déterminer ».
  function ouvrirCalendrier(ancre, cle, dateActuelle, choisir, options) {
    options = options || {};
    var memeBoite = calendrierEl && calendrierEl.dataset.id === cle;
    fermerCalendrier();
    if (memeBoite) return; // un deuxième clic sur le même bouton referme la boîte

    var depart = (dateActuelle || todayIso()).split('-').map(Number);
    var annee = depart[0];
    var mois = depart[1] - 1;
    var el = document.createElement('div');
    el.className = 'calendrier-pop';
    el.dataset.id = cle;
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', 'Choisir la date de la rencontre');
    document.getElementById('content').appendChild(el);
    calendrierEl = el;

    function dessiner(message) {
      var decalage = (new Date(Date.UTC(annee, mois, 1)).getUTCDay() + 6) % 7; // semaine du lundi au dimanche
      var nbJours = new Date(Date.UTC(annee, mois + 1, 0)).getUTCDate();
      var aujourdhui = todayIso();
      var cases = JOURS_COURTS.map(function (j) { return '<span class="calendrier-jsem">' + j + '</span>'; }).join('');
      for (var i = 0; i < decalage; i++) cases += '<span></span>';
      for (var jour = 1; jour <= nbJours; jour++) {
        var iso = isoDuJour(annee, mois, jour);
        cases += '<button type="button" class="calendrier-jour' +
          (iso === dateActuelle ? ' choisi' : '') + (iso === aujourdhui ? ' aujourdhui' : '') +
          '" data-date="' + iso + '">' + jour + '</button>';
      }
      el.innerHTML =
        '<div class="calendrier-entete">' +
          '<button type="button" class="calendrier-nav" data-pas="-1" aria-label="Mois précédent">&lsaquo;</button>' +
          '<span>' + MOIS_FR[mois] + ' ' + annee + '</span>' +
          '<button type="button" class="calendrier-nav" data-pas="1" aria-label="Mois suivant">&rsaquo;</button>' +
        '</div>' +
        '<div class="calendrier-grille">' + cases + '</div>' +
        (message ? '<p class="calendrier-erreur">' + esc(message) + '</p>' : '') +
        (options.indeterminee
          ? '<div class="calendrier-pied">' +
              '<button type="button" class="calendrier-lien" data-action="indeterminee">Date à déterminer</button>' +
            '</div>'
          : '');
    }

    function placer() {
      var r = ancre.getBoundingClientRect();
      var largeur = el.offsetWidth;
      var hauteur = el.offsetHeight;
      var gauche = Math.min(Math.max(8, r.left), window.innerWidth - largeur - 8);
      var haut = r.bottom + 6;
      if (haut + hauteur > window.innerHeight - 8 && r.top - hauteur - 6 > 8) haut = r.top - hauteur - 6;
      el.style.left = Math.max(8, gauche) + 'px';
      el.style.top = haut + 'px';
    }

    function enregistrer(date) {
      if (date === (dateActuelle || null)) { fermerCalendrier(); return; }
      el.classList.add('occupe');
      Promise.resolve(choisir(date)).then(function () {
        fermerCalendrier();
      }).catch(function (err) {
        el.classList.remove('occupe');
        dessiner(err.message);
        placer();
      });
    }

    el.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn || el.classList.contains('occupe')) return;
      if (btn.classList.contains('calendrier-nav')) {
        mois += Number(btn.dataset.pas);
        if (mois < 0) { mois = 11; annee--; }
        if (mois > 11) { mois = 0; annee++; }
        dessiner();
        placer();
      } else if (btn.classList.contains('calendrier-jour')) {
        enregistrer(btn.dataset.date);
      } else if (btn.dataset.action === 'indeterminee') {
        enregistrer(null);
      }
    });

    el.placer = placer;
    dessiner();
    placer();
  }

  // Fermeture : clic ailleurs ou touche Échap. Au défilement ou au changement de taille, la boîte suit sa date.
  document.addEventListener('mousedown', function (e) {
    if (calendrierEl && !calendrierEl.contains(e.target) &&
        !e.target.closest('.rencontre-date-btn, .modifier-date-btn, .calendrier-declencheur')) fermerCalendrier();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fermerCalendrier(); });
  function replacerCalendrier() { if (calendrierEl) calendrierEl.placer(); }

  window.addEventListener('resize', replacerCalendrier);

  async function refreshRencontresListe(idAOuvrir) {
    var liste = document.getElementById('rencontres-liste');
    var archives = document.getElementById('rencontres-archives');
    if (!liste) return;

    // On garde ouvertes les rencontres déjà ouvertes avant le rafraîchissement.
    var ouvertes = {};
    liste.querySelectorAll('.rencontre-body.open').forEach(function (b) {
      ouvertes[b.closest('.rencontre-card').dataset.id] = true;
    });
    if (idAOuvrir) ouvertes[idAOuvrir] = true;

    var toutes = (await appeler('getRencontres')).map(rencontreNormalisee);
    var actives = toutes.filter(function (r) { return !r.archivee; });
    var archivees = toutes.filter(function (r) { return r.archivee; });

    liste.innerHTML = actives.length
      ? actives.map(rencontreCardHtml).join('')
      : '<p class="empty">Aucune rencontre active pour le moment.</p>';
    archives.innerHTML = archivees.length
      ? '<div class="archives"><h3>Réunions archivées</h3>' + archivees.map(ligneArchiveeHtml).join('') + '</div>'
      : '';

    liste.querySelectorAll('.rencontre-card').forEach(function (carte) {
      if (ouvertes[carte.dataset.id]) carte.querySelector('.rencontre-body').classList.add('open');
    });
  }

      '<p class="lede">Ordres du jour de la plus récente à la plus ancienne. Les cases cochées et les commentaires sont propres au tableau de bord.</p>' +
      '<div class="doc-actions">' +
        '<button class="btn btn-primary" id="planifier-rencontre-btn">+ Planifier une rencontre</button>' +
      '</div>' +
      '<div id="rencontres-liste" class="rencontres-liste"></div>' +
      '<div id="rencontres-archives"></div>';

    document.getElementById('planifier-rencontre-btn').addEventListener('click', openPlanifierRencontreModal);

    var liste = document.getElementById('rencontres-liste');
    var archives = document.getElementById('rencontres-archives');

    // Délégation : toutes les actions de la liste passent par ces trois écouteurs.
    liste.addEventListener('click', function (e) {
      var btnDate = e.target.closest('.rencontre-date-btn, .modifier-date-btn');
      if (btnDate) {
        var idRencontre = btnDate.dataset.id;
        ouvrirCalendrier(btnDate, idRencontre, btnDate.dataset.date || null, function (date) {
          return appeler('setDateRencontre', idRencontre, date).then(function () {
            refreshRencontresListe(idRencontre);
          });
        }, { indeterminee: true });
        return;
      }
      var header = e.target.closest('.rencontre-header');
      if (header) {
        header.nextElementSibling.classList.toggle('open');
        return;
      }
      var btn = e.target.closest('button');
      if (!btn) return;
      if (btn.classList.contains('ajouter-section-btn')) {
        openAjouterSectionModal(btn.dataset.id);
      } else if (btn.classList.contains('ajouter-point-btn')) {
        openAjouterPointModal(btn.dataset.groupeId, btn.dataset.groupeTitre, btn.closest('.rencontre-card').dataset.id);
      } else if (btn.classList.contains('supprimer-point-btn')) {
        var rencontreId = btn.closest('.rencontre-card').dataset.id;
        confirmer('Retirer ce point ?', 'Le point sera retiré de l\'ordre du jour de la rencontre.', 'Retirer', function () {
          signaler(appeler('supprimerPoint', btn.dataset.id), function () {
            refreshRencontresListe(rencontreId);
          });
        });
      } else if (btn.classList.contains('rencontre-toggle-termine')) {
        var nouvelEtat = btn.dataset.terminee !== '1';
        signaler(appeler('setRencontreEtat', btn.dataset.id, { terminee: nouvelEtat }), function () {
          refreshRencontresListe(btn.dataset.id);
        });
      } else if (btn.classList.contains('archiver-btn')) {
        signaler(appeler('setRencontreArchivee', btn.dataset.id, true), function () {
          refreshRencontresListe();
        });
      }
    });

    liste.addEventListener('change', function (e) {
      var cb = e.target;
      if (cb.classList.contains('coche-point')) {
        cb.closest('.rencontre-item').classList.toggle('checked', cb.checked);
        signaler(appeler('setPointCoche', cb.dataset.id, cb.checked), null);
      } else if (cb.classList.contains('coche-action')) {
        cb.closest('.rencontre-item').classList.toggle('checked', cb.checked);
        signaler(appeler('setActionCoche', cb.dataset.id, cb.checked), null);
      }
    });

    // Commentaire général : enregistré après une courte pause dans la saisie.
    var minuteries = {};
    liste.addEventListener('input', function (e) {
      var ta = e.target;
      if (!ta.classList.contains('rencontre-commentaire')) return;
      var id = ta.dataset.id;
      clearTimeout(minuteries[id]);
      minuteries[id] = setTimeout(function () {
        appeler('setRencontreEtat', id, { commentaire_general: ta.value }).catch(function () {});
      }, 600);
    });

    archives.addEventListener('click', function (e) {
      var btn = e.target.closest('.desarchiver-btn');
      if (!btn) return;
      signaler(appeler('setRencontreArchivee', btn.dataset.id, false), function () {
        refreshRencontresListe();
      });
    });

    await refreshRencontresListe();
  }

  function openTacheDetailModal(id, donnees) {
    var t = donnees.taches.find(function (x) { return x.id === id; });
    if (!t) return;
    var optionsPbi = ['<option value="">(To-Do)</option>'].concat(donnees.pbis.map(function (p) {

    })).join('');
    var optionsAssigne = ['<option value="">(Non assigné)</option>'].concat(MEMBRES_EQUIPE.map(function (n) {
      return '<option value="' + esc(n) + '"' + (n === t.assigne ? ' selected' : '') + '>' + esc(n) + '</option>';
    })).join('');

    var optionsColonne = [['nouveau', 'Nouveaux'], ['en_cours', 'En cours'], ['termine', 'Terminés']].map(function (c) {

    }).join('');

        '<button class="btn btn-supprimer" id="tache-supprimer-btn">Supprimer la tâche</button>' +
        '<button class="btn btn-primary" id="tache-enregistrer-btn">Enregistrer</button>' +

      erreurEl.hidden = true;
      if (!titre) return;
      var assigne = document.getElementById('tache-assigne').value;
      var colonne = document.getElementById('tache-colonne').value;

        description: document.getElementById('tache-description').value.trim(),
        pbi_id: document.getElementById('tache-pbi').value || null,
      }).then(function () {
        // Le déplacement d'abord (il assigne ou désassigne selon la colonne), puis le choix manuel s'il a changé.
        if (colonne !== t.colonne) return appeler('deplacerTache', t.id, colonne);
      }).then(function () {
        if (assigne !== (t.assigne || '')) return appeler('assignerTache', t.id, assigne);
      }).then(function () {

        refreshTachesListe();

  async function refreshTachesListe() {
    var swimlanes = document.getElementById('taches-swimlanes');
    var archives = document.getElementById('taches-archives');
    if (!swimlanes) return;
    var brut = await appeler('getTaches');
    var tousPbis = brut.pbis || [];
    var toutesTaches = brut.taches || [];

    // Un PBI archivé quitte le Kanban avec ses tâches : il ne reste que dans la section du bas.
    var pbisArchives = tousPbis.filter(function (p) { return p.archivee; });
    var idsArchives = {};
    pbisArchives.forEach(function (p) { idsArchives[p.id] = true; });
    var donnees = {
      pbis: tousPbis.filter(function (p) { return !p.archivee; }),
      taches: toutesTaches.filter(function (t) { return !t.archivee && !idsArchives[t.pbi_id]; }),
    };

    if (archives) {
      archives.innerHTML = pbisArchives.length
        ? '<div class="archives"><h3>PBI archivés</h3>' + pbisArchives.map(function (p) {
            return pbiArchiveHtml(p, toutesTaches.filter(function (t) { return t.pbi_id === p.id; }).length);
          }).join('') + '</div>'
        : '';
    }

    var parPbi = {};
    donnees.taches.forEach(function (t) {
      var cle = t.pbi_id || '';
      (parPbi[cle] = parPbi[cle] || []).push(t);
    });

    var blocs = donnees.pbis.map(function (pbi) {
      return tachesSwimlaneHtml(pbi, parPbi[pbi.id] || []);
    });
    blocs.push(tachesSwimlaneHtml(null, parPbi[''] || []));
    swimlanes.innerHTML =
      '<div class="arbre-taches">' +
        '<div class="arbre-ligne arbre-entete"><span>Titre</span><span>État</span><span class="arbre-qui">Assigné à</span><span class="arbre-actions-titre"></span></div>' +
        blocs.join('') +
      '</div>';

    swimlanes.querySelectorAll('.toggle-swimlane').forEach(function (header) {
      header.addEventListener('click', function (e) {
        // Les boutons et le menu ⋯ de la ligne ne replient pas le PBI.
        if (e.target.closest('.arbre-actions')) return;
        var groupe = header.closest('.arbre-groupe');
        var pbiId = groupe.dataset.pbiId;
        var collapsee = tachesCollapsees.has(pbiId);
        if (collapsee) tachesCollapsees.delete(pbiId);
        else tachesCollapsees.add(pbiId);
        sauvegarderCollapsees();
        groupe.classList.toggle('collapsee', !collapsee);
        header.querySelector('.arbre-chevron').textContent = collapsee ? '▾' : '▸';
      });
    });

    // Un seul menu ⋯ ouvert à la fois ; il se ferme après un choix.
    swimlanes.querySelectorAll('.menu-pbi').forEach(function (menu) {
      menu.addEventListener('toggle', function () {
        if (!menu.open) return;
        swimlanes.querySelectorAll('.menu-pbi[open]').forEach(function (autre) { if (autre !== menu) autre.open = false; });
      });
      menu.querySelectorAll('.btn').forEach(function (b) { b.addEventListener('click', function () { menu.open = false; }); });
    });

    swimlanes.querySelectorAll('.nouvelle-tache-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openNouvelleTacheModal(btn.dataset.pbiId);
      });
    });

    swimlanes.querySelectorAll('.modifier-pbi-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openModifierPbiModal(btn.dataset.id, btn.dataset.titre, btn.dataset.responsable, btn.dataset.statut, btn.dataset.numero);
      });
    });

    swimlanes.querySelectorAll('.supprimer-pbi-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var nb = Number(btn.dataset.nb) || 0;
        var detail = nb ? ' et ses ' + nb + ' tâche' + (nb > 1 ? 's' : '') : '';
        confirmer('Supprimer ce PBI ?', 'Le PBI' + detail + ' sera supprimé définitivement. Cette action ne peut pas être annulée.', 'Supprimer', function () {
          signaler(appeler('supprimerPbiComplet', btn.dataset.id), refreshTachesListe);
        });
      });
    });

    swimlanes.querySelectorAll('.archiver-pbi-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        signaler(appeler('setPbiArchive', btn.dataset.id, true), refreshTachesListe);
      });
    });

    // Clic sur une tâche : sa fenêtre de détail (sauf sur la liste de l'état).
    swimlanes.querySelectorAll('.arbre-tache').forEach(function (ligne) {
      ligne.addEventListener('click', function (e) {
        if (e.target.closest('.etat-select')) return;
        openTacheDetailModal(ligne.dataset.id, donnees);
      });
    });

    // Changer l'état d'une tâche = la changer de colonne. Le backend assigne l'administrateur connecté en
    // passant à En cours ou Terminé, et retire l'assignation en revenant à Nouveau.
    swimlanes.querySelectorAll('.etat-select').forEach(function (select) {
      select.addEventListener('click', function (e) { e.stopPropagation(); });
      select.addEventListener('change', function () {
        if (select.value === select.dataset.colonne) return;
        select.disabled = true;
        appeler('deplacerTache', select.dataset.id, select.value).catch(function (err) {
          alert(err.message);
        }).finally(refreshTachesListe);
      });
    });
  }

  async function initTaches() {
    var content = document.getElementById('content');
    content.innerHTML =
      '<h1>Tâches</h1>' +
      '<p class="lede">Une ligne par PBI, une sous-ligne par tâche. Touchez un PBI pour replier ou déplier ses tâches ; changez l\'état d\'une tâche dans sa colonne État. Passer en « En cours » vous assigne la tâche ; revenir à « Nouveau » retire l\'assignation.</p>' +
      '<div class="taches-toolbar"><button class="btn btn-primary" id="nouveau-pbi-btn">+ Nouveau PBI</button></div>' +
      '<div id="taches-swimlanes" class="taches-swimlanes"></div>' +
      '<div id="taches-archives"></div>';
    document.getElementById('nouveau-pbi-btn').addEventListener('click', openNouveauPbiModal);
    document.getElementById('taches-archives').addEventListener('click', function (e) {
      var btn = e.target.closest('.desarchiver-pbi-btn');
      if (!btn) return;
      signaler(appeler('setPbiArchive', btn.dataset.id, false), refreshTachesListe);
    });

  /* ===================== Manuscrits ===================== */

  // Un livre par dossier du dossier Livres (skill dashboard-export-manuscrits). Le titre, l'auteur
  // et les coordonnées se modifient ici ; le skill ne les écrase jamais.
  var manuscrits = [];

  function celluleAnalyse(m, type) {
    var fichier = m['analyse_' + type];
    if (!fichier) return '<span class="empty">Aucune</span>';
    var version = (fichier.match(/_V(\d+)/i) || [])[1];
    return '<button type="button" class="btn btn-sm ouvrir-analyse-btn" data-id="' + esc(m.id) + '" data-type="' + type + '"' +
      ' title="' + esc(fichier) + '">Ouvrir' + (version ? ' (V' + esc(version) + ')' : '') + '</button>';
  }

  function coordonneesHtml(m) {
    var lignes = [m.courriel, m.telephone, m.adresse].filter(function (v) { return v; });
    return lignes.length
      ? '<div class="manuscrit-coordonnees">' + lignes.map(function (v) { return '<span>' + esc(v) + '</span>'; }).join('') + '</div>'
      : '<div class="manuscrit-coordonnees"><span class="empty">Aucune coordonnée</span></div>';
  }

  function tableManuscritsHtml(liste) {
    return '<div class="table-defilante"><table class="manuscrits-table"><thead><tr>' +
        '<th>Livre</th><th>Auteur</th><th>Analyse éditoriale</th><th>Analyse de conformité</th><th></th>' +
      '</tr></thead><tbody>' +
      liste.map(function (m) {
        return '<tr>' +
          '<td class="manuscrit-titre">' + esc(m.titre) + '</td>' +
          '<td><div class="manuscrit-auteur">' + esc(m.auteur) + '</div>' + coordonneesHtml(m) + '</td>' +
          '<td>' + celluleAnalyse(m, 'editoriale') + '</td>' +
          '<td>' + celluleAnalyse(m, 'conformite') + '</td>' +
          '<td class="manuscrit-actions"><button type="button" class="btn btn-sm modifier-manuscrit-btn" data-id="' + esc(m.id) + '">Modifier</button></td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  async function refreshManuscrits() {
    var zone = document.getElementById('manuscrits-zone');
    if (!zone) return;
    manuscrits = await appeler('getManuscrits');
    var actifs = manuscrits.filter(function (m) { return !m.archive; });
    var archives = manuscrits.filter(function (m) { return m.archive; });
    zone.innerHTML =
      '<div class="panel">' +
        (actifs.length ? tableManuscritsHtml(actifs) : '<p class="empty">Aucun manuscrit. Lancez le skill dashboard-export-manuscrits.</p>') +
      '</div>' +
      (archives.length
        ? '<div class="panel"><h2>Livres archivés</h2>' + tableManuscritsHtml(archives) + '</div>'
        : '');
  }

  function openModifierManuscritModal(id) {
    var m = manuscrits.find(function (x) { return x.id === id; });
    if (!m) return;
    function champ(idChamp, libelle, valeur, attributs) {
      return '<div class="field-row"><label>' + libelle +
        '<input type="text" id="' + idChamp + '" value="' + esc(valeur || '') + '" ' + (attributs || '') + '></label></div>';
    }
    openModal('Modifier le manuscrit',
      '<p class="empty" style="margin-top:0;">Dossier : ' + esc(m.dossier) + '</p>' +
      champ('manuscrit-titre', 'Titre du livre', m.titre, 'maxlength="200"') +
      champ('manuscrit-auteur', 'Nom de l\'auteur', m.auteur, 'maxlength="200"') +
      champ('manuscrit-courriel', 'Courriel', m.courriel, 'maxlength="200" inputmode="email" autocomplete="off"') +
      champ('manuscrit-telephone', 'Téléphone', m.telephone, 'maxlength="50" inputmode="tel" autocomplete="off"') +
      '<div class="field-row"><label>Adresse' +
        '<textarea id="manuscrit-adresse" rows="3" maxlength="500">' + esc(m.adresse || '') + '</textarea></label></div>' +
      '<p class="empty" id="manuscrit-erreur" hidden></p>' +
      '<div class="doc-actions" style="margin-top:16px;"><button class="btn btn-primary" id="manuscrit-confirmer-btn">Enregistrer</button></div>');
    var erreurEl = document.getElementById('manuscrit-erreur');
    document.getElementById('manuscrit-confirmer-btn').addEventListener('click', function (e) {
      var btn = e.currentTarget;
      erreurEl.hidden = true;
      btn.disabled = true;
      appeler('modifierManuscrit', id, {
        titre: document.getElementById('manuscrit-titre').value,
        auteur: document.getElementById('manuscrit-auteur').value,
        courriel: document.getElementById('manuscrit-courriel').value,
        telephone: document.getElementById('manuscrit-telephone').value,
        adresse: document.getElementById('manuscrit-adresse').value,
      }).then(function () {
        closeModal();
        refreshManuscrits();
      }).catch(function (err) {
        erreurEl.textContent = err.message;
        erreurEl.hidden = false;
      }).finally(function () { btn.disabled = false; });
    });
  }

  // Visionneuse d'analyse : grande fenêtre avec le rapport HTML dans un cadre isolé (sans script).
  var analyseEl = null;
  function fermerAnalyse() {
    if (analyseEl) analyseEl.remove();
    analyseEl = null;
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fermerAnalyse(); });

  async function ouvrirAnalyse(id, type) {
    var m = manuscrits.find(function (x) { return x.id === id; }) || {};
    fermerAnalyse();
    analyseEl = document.createElement('div');
    analyseEl.className = 'analyse-overlay';
    analyseEl.innerHTML =
      '<div class="analyse-boite" role="dialog" aria-modal="true">' +
        '<div class="analyse-entete">' +
          '<div><strong>' + (type === 'editoriale' ? 'Analyse éditoriale' : 'Analyse de conformité') + '</strong>' +
            '<span class="analyse-livre">' + esc(m.titre || '') + (m.auteur ? ', ' + esc(m.auteur) : '') + '</span></div>' +
          '<div class="analyse-boutons">' +
            '<button type="button" class="btn btn-sm" id="analyse-imprimer" disabled>Imprimer</button>' +
            '<button type="button" class="btn btn-sm" id="analyse-fermer">Fermer</button>' +
          '</div>' +
        '</div>' +
        '<div class="analyse-corps"><p class="empty">Chargement de l\'analyse…</p></div>' +
      '</div>';
    document.body.appendChild(analyseEl);
    var boite = analyseEl;
    boite.addEventListener('click', function (e) { if (e.target === boite) fermerAnalyse(); });
    boite.querySelector('#analyse-fermer').addEventListener('click', fermerAnalyse);
    try {
      var r = await appeler('getAnalyseManuscrit', id, type);
      if (analyseEl !== boite) return; // fenêtre fermée pendant le chargement
      var cadre = document.createElement('iframe');
      cadre.className = 'analyse-cadre';
      cadre.title = r.fichier;
      cadre.setAttribute('sandbox', 'allow-same-origin allow-modals');
      cadre.srcdoc = r.html;
      var corps = boite.querySelector('.analyse-corps');
      corps.innerHTML = '';
      corps.appendChild(cadre);
      var imprimer = boite.querySelector('#analyse-imprimer');
      imprimer.disabled = false;
      imprimer.addEventListener('click', function () { cadre.contentWindow.print(); });
    } catch (err) {
      if (analyseEl === boite) {
        boite.querySelector('.analyse-corps').innerHTML = '<p class="empty">Impossible d\'ouvrir l\'analyse : ' + esc(err.message) + '</p>';
      }
    }
  }

  async function initManuscrits() {
    var content = document.getElementById('content');
    content.innerHTML =
      '<h1>Manuscrits</h1>' +
      '<p class="lede">Livres du dossier Livres, mis à jour par le skill dashboard-export-manuscrits. ' +
        'Le titre, l\'auteur et les coordonnées se modifient ici.</p>' +
      '<div id="manuscrits-zone"></div>';
    content.querySelector('#manuscrits-zone').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      if (btn.classList.contains('ouvrir-analyse-btn')) ouvrirAnalyse(btn.dataset.id, btn.dataset.type);
      else if (btn.classList.contains('modifier-manuscrit-btn')) openModifierManuscritModal(btn.dataset.id);
    });
    await refreshManuscrits();
  }

  /* ===================== Ventes <année> ===================== */

  // Copie du classeur <année>_Suivi_des_ventes_TBL.xlsx (skill dashboard-export-vente), en exemplaires :
  // le tableau « Statistiques globales » de son Dashboard, la somme de tous les livres par mois et
  // par format, puis le tableau de chaque livre tel qu'il est dans son onglet.
  var ventesLivres = [];
  var ventesLivreChoisi = null;

  function nbVentes(v) {
    return v === null || v === undefined ? '' : esc(Number(v).toLocaleString('fr-CA'));
  }

  // Tableau d'un onglet de livre (ou de la somme) : Mois, formats, Total, puis TOTAL ANNUEL.
  function tableauVentesHtml(d) {
    var entete = '<tr><th>Mois</th>' + d.formats.map(function (f) { return '<th>' + esc(f) + '</th>'; }).join('') +
      '<th>Total</th></tr>';
    var corps = d.mois.map(function (m) {
      return '<tr><td class="ventes-mois">' + esc(m.mois) + '</td>' +
        m.valeurs.map(function (v) { return '<td>' + nbVentes(v) + '</td>'; }).join('') +
        '<td class="ventes-total-col">' + nbVentes(m.total) + '</td></tr>';
    }).join('');
    var pied = '<tr class="ventes-total"><td>TOTAL ANNUEL</td>' +
      d.totaux.map(function (v) { return '<td>' + nbVentes(v) + '</td>'; }).join('') +
      '<td>' + nbVentes(d.total) + '</td></tr>';
    return '<div class="table-defilante"><table class="ventes-table"><thead>' + entete + '</thead><tbody>' +
      corps + pied + '</tbody></table></div>';
  }

  // Somme de tous les livres, mois par mois et format par format (même ordre de colonnes partout).
  function ventesGlobales(livres) {
    var formats = livres[0].d.formats.slice();
    livres.forEach(function (l) {
      l.d.formats.forEach(function (f, j) { if (f.length < (formats[j] || '').length) formats[j] = f; });
    });
    var mois = livres[0].d.mois.map(function (m, i) {
      var valeurs = formats.map(function (f, j) {
        var saisies = livres.map(function (l) { return l.d.mois[i].valeurs[j]; })
          .filter(function (v) { return v !== null && v !== undefined; });
        return saisies.length ? saisies.reduce(function (a, b) { return a + b; }, 0) : null;
      });
      var saisi = valeurs.some(function (v) { return v !== null; });
      return { mois: m.mois, valeurs: valeurs,
        total: saisi ? valeurs.reduce(function (a, b) { return a + (b || 0); }, 0) : null };
    });
    var totaux = formats.map(function (f, j) {
      return livres.reduce(function (a, l) { return a + (l.d.totaux[j] || 0); }, 0);
    });
    return { formats: formats, mois: mois, totaux: totaux,
      total: totaux.reduce(function (a, b) { return a + b; }, 0) };
  }

  function dessinerLivreVentes(annee) {
    var zone = document.getElementById('ventes-livre');
    var l = ventesLivres.find(function (x) { return x.id === ventesLivreChoisi; }) || ventesLivres[0];
    if (!zone || !l) return;
    document.querySelectorAll('.ventes-choix-livre').forEach(function (b) {
      b.classList.toggle('btn-primary', b.dataset.id === l.id);
    });
    zone.innerHTML = '<h3 class="ventes-titre-livre">' + esc(l.livre.toUpperCase()) + ' — SUIVI DES VENTES ' + esc(annee) + '</h3>' +
      tableauVentesHtml(l.d);
  }

  async function initVentes() {
    var content = document.getElementById('content');
    var lignes = await appeler('getSuiviVentes');
    var info = lignes.find(function (l) { return l.type === 'info'; });
    ventesLivres = lignes.filter(function (l) { return l.type === 'livre'; })
      .sort(function (a, b) { return a.ordre - b.ordre; })
      .map(function (l) { return { id: l.id, livre: l.livre, d: JSON.parse(l.donnees) }; });
    if (!ventesLivres.length) {
      content.innerHTML = '<h1>Ventes</h1><p class="empty">Aucune donnée. Lancez le skill dashboard-export-vente.</p>';
      return;
    }
    var annee = info ? info.annee : '';
    var i = info ? JSON.parse(info.donnees) : {};
    var total = ventesLivres.reduce(function (a, l) { return a + l.d.total; }, 0);
    if (!ventesLivreChoisi || !ventesLivres.some(function (l) { return l.id === ventesLivreChoisi; })) {
      ventesLivreChoisi = ventesLivres[0].id;
    }

    content.innerHTML =
      '<h1>Ventes ' + esc(annee) + '</h1>' +
      '<p class="lede">Exemplaires vendus, tirés du classeur ' + esc(i.fichier || '') +
        (i.fichier_modifie ? ' (modifié le ' + esc(i.fichier_modifie) + ')' : '') +
        ' et mis à jour par le skill dashboard-export-vente.</p>' +
      '<div class="panel">' +
        '<h2>Statistiques globales ' + esc(annee) + '</h2>' +
        '<div class="table-defilante"><table class="ventes-table ventes-globales"><thead><tr><th>Livre</th><th>Exemplaires vendus</th></tr></thead><tbody>' +
          ventesLivres.map(function (l) {
            return '<tr><td>' + esc(l.livre) + '</td><td>' + nbVentes(l.d.total) + '</td></tr>';
          }).join('') +
          '<tr class="ventes-total"><td>TOTAL</td><td>' + nbVentes(total) + '</td></tr>' +
        '</tbody></table></div>' +
        (i.note ? '<p class="ventes-note">' + esc(i.note) + '</p>' : '') +
      '</div>' +
      '<div class="panel">' +
        '<h2>Ventes globales par mois</h2>' +
        tableauVentesHtml(ventesGlobales(ventesLivres)) +
      '</div>' +
      '<div class="panel">' +
        '<h2>Ventes par livre</h2>' +
        '<div class="ventes-choix">' + ventesLivres.map(function (l) {
          return '<button type="button" class="btn btn-sm ventes-choix-livre" data-id="' + esc(l.id) + '">' + esc(l.livre) + '</button>';
        }).join('') + '</div>' +
        '<div id="ventes-livre"></div>' +
      '</div>';

    content.querySelector('.ventes-choix').addEventListener('click', function (e) {
      var btn = e.target.closest('.ventes-choix-livre');
      if (!btn) return;
      ventesLivreChoisi = btn.dataset.id;
      dessinerLivreVentes(annee);
    });
    dessinerLivreVentes(annee);
  }

  /* ===================== Ventes numériques ===================== */

  // Les produits visibles de la boutique et les unités vendues pendant la période choisie
  // (commandes approuvées et payées, dates en heure de Montréal). Les produits masqués et les ventes
  // à 0 $ sont ignorés.
  var periodeNum = null;

  function isoDecale(iso, jours) {
    var p = iso.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + jours));
    return d.toISOString().slice(0, 10);
  }

  function periodesRapides() {
    var auj = todayIso();
    var p = auj.split('-').map(Number);
    var debutMois = auj.slice(0, 8) + '01';
    var moisPrecedentFin = isoDecale(debutMois, -1);
    return [
      { cle: 'aujourdhui', libelle: 'Aujourd\'hui', debut: auj, fin: auj },
      { cle: 'hier', libelle: 'Hier', debut: isoDecale(auj, -1), fin: isoDecale(auj, -1) },
      { cle: '7j', libelle: '7 derniers jours', debut: isoDecale(auj, -6), fin: auj },
      { cle: 'mois', libelle: 'Ce mois-ci', debut: debutMois, fin: auj },
      { cle: 'mois-precedent', libelle: 'Mois dernier', debut: moisPrecedentFin.slice(0, 8) + '01', fin: moisPrecedentFin },
      { cle: 'annee', libelle: 'Cette année', debut: p[0] + '-01-01', fin: auj },
    ];
  }

  function libelleDate(iso) {
    return iso ? formatDateLongue(iso) : '…';
  }

  async function chargerVentesNumeriques() {
    var zone = document.getElementById('num-resultats');
    if (!zone) return;
    document.querySelectorAll('.num-rapide').forEach(function (b) {
      b.classList.toggle('btn-primary', b.dataset.debut === periodeNum.debut && b.dataset.fin === periodeNum.fin);
    });
    document.getElementById('num-debut').textContent = libelleDate(periodeNum.debut);
    document.getElementById('num-fin').textContent = libelleDate(periodeNum.fin);
    zone.innerHTML = '<p class="empty">Chargement des ventes…</p>';
    var r;
    try {
      r = await appeler('getVentesNumeriques', periodeNum.debut, periodeNum.fin);
    } catch (err) {
      zone.innerHTML = '<p class="empty">Impossible de lire les ventes : ' + esc(err.message) + '</p>';
      return;
    }
    if (document.getElementById('num-resultats') !== zone) return; // onglet quitté entre-temps
    var produits = r.produits;
    var total = produits.reduce(function (a, p) { return a + p.quantite; }, 0);
    var avecVentes = produits.filter(function (p) { return p.quantite > 0; }).length;
    zone.innerHTML =
      '<div class="ventes-indicateurs num-indicateurs">' +
        '<div class="indicateur-carte"><div class="indicateur-valeur">' + esc(total.toLocaleString('fr-CA')) + '</div>' +
          '<div class="indicateur-label">Unités vendues</div></div>' +
        '<div class="indicateur-carte"><div class="indicateur-valeur">' + esc(avecVentes) + ' / ' + esc(produits.length) + '</div>' +
          '<div class="indicateur-label">Produits vendus pendant la période</div></div>' +
      '</div>' +
      '<div class="table-defilante"><table class="num-table"><thead><tr><th>Produit</th><th>Unités vendues</th></tr></thead><tbody>' +
        produits.map(function (p) {
          return '<tr' + (p.quantite ? '' : ' class="num-zero"') + '><td>' + esc(p.nom) + '</td>' +
            '<td>' + esc(p.quantite.toLocaleString('fr-CA')) + '</td></tr>';
        }).join('') +
        '<tr class="num-total"><td>TOTAL</td><td>' + esc(total.toLocaleString('fr-CA')) + '</td></tr>' +
      '</tbody></table></div>' +
      (r.sansProduit
        ? '<p class="ventes-note">' + esc(r.sansProduit) + ' unité(s) vendue(s) pendant la période ne sont rattachées à aucun produit ' +
            '(article personnalisé) et ne sont pas comptées ci-dessus.</p>'
        : '');
  }

  async function initVentesNumeriques() {
    var content = document.getElementById('content');
    if (!periodeNum) {
      var mois = periodesRapides().find(function (p) { return p.cle === 'mois'; });
      periodeNum = { debut: mois.debut, fin: mois.fin };
    }
    content.innerHTML =
      '<h1>Ventes numériques</h1>' +
      '<p class="lede">Les produits visibles de la boutique et les unités vendues pendant la période choisie ' +
        '(commandes approuvées et payées, heure de Montréal ; les ventes à 0 $ ne sont pas comptées).</p>' +
      '<div class="panel">' +
        '<div class="num-periode">' +
          '<div class="num-rapides">' + periodesRapides().map(function (p) {
            return '<button type="button" class="btn btn-sm num-rapide" data-debut="' + p.debut + '" data-fin="' + p.fin + '">' + esc(p.libelle) + '</button>';
          }).join('') + '</div>' +
          '<div class="num-dates">' +
            '<span>Du</span><button type="button" class="btn btn-sm calendrier-declencheur" id="num-btn-debut">' + ICONE_CALENDRIER + ' <span id="num-debut"></span></button>' +
            '<span>au</span><button type="button" class="btn btn-sm calendrier-declencheur" id="num-btn-fin">' + ICONE_CALENDRIER + ' <span id="num-fin"></span></button>' +
          '</div>' +
        '</div>' +
        '<div id="num-resultats"></div>' +
      '</div>';

    content.querySelector('.num-rapides').addEventListener('click', function (e) {
      var b = e.target.closest('.num-rapide');
      if (!b) return;
      periodeNum = { debut: b.dataset.debut, fin: b.dataset.fin };
      chargerVentesNumeriques();
    });
    function choisirBorne(btn, borne) {
      ouvrirCalendrier(btn, 'num-' + borne, periodeNum[borne], function (date) {
        periodeNum[borne] = date;
        // Une période inversée est remise dans l'ordre.
        if (periodeNum.debut > periodeNum.fin) {
          var t = periodeNum.debut; periodeNum.debut = periodeNum.fin; periodeNum.fin = t;
        }
        chargerVentesNumeriques();
      });
    }
    document.getElementById('num-btn-debut').addEventListener('click', function (e) { choisirBorne(e.currentTarget, 'debut'); });
    document.getElementById('num-btn-fin').addEventListener('click', function (e) { choisirBorne(e.currentTarget, 'fin'); });
    await chargerVentesNumeriques();
  }

  /* ===================== Publicité ===================== */

  // Résumé de l'onglet Dashboard du classeur Suivi_Publicités_Facebook.xlsx (lecture seule).
  // Mis à jour manuellement par le skill dashboard-export-publicite.
  async function initPublicite() {
    var content = document.getElementById('content');
    var lignes = await appeler('getResumePublicite');

    var intro = '<h1>Publicité</h1>';
    if (!lignes.length) {
      content.innerHTML = intro +
        '<p class="lede">Résumé des 30 derniers jours du suivi des publicités Facebook.</p>' +
        '<div class="panel"><p class="empty">Aucun résumé enregistré pour le moment.</p></div>';
      return;
    }

    function argent(v) {
      return v == null ? '—' : Number(v).toLocaleString('fr-CA', { style: 'currency', currency: 'CAD' });
    }
    function decimal(v) {
      return v == null ? '—' : Number(v).toLocaleString('fr-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Toutes les lignes ont la même période : on la prend sur la première.
    var periode = lignes[0];

    var corps = lignes.map(function (l) {
      var total = l.ad_set === 'TOTAL';
      var gras = total ? ' style="font-weight:700;"' : '';
      return '<tr' + gras + '>' +
        '<td>' + esc(l.ad_set) + '</td>' +
        '<td>' + argent(l.depense) + '</td>' +
        '<td>' + argent(l.ventes) + '</td>' +
        '<td>' + decimal(l.roas) + '</td>' +
        '<td>' + (total ? '' : esc(l.recommandation || '')) + '</td>' +
      '</tr>';
    }).join('');

    content.innerHTML = intro +
      '<p class="lede">Les 30 derniers jours : du ' + esc(formatDateLongue(periode.periode_debut)) +
        ' au ' + esc(formatDateLongue(periode.periode_fin)) +
        '. Mis à jour le ' + esc(formatDateFr(periode.synchronise_le)) + '.</p>' +
      '<p class="lede">ROAS = Nombre de $ gagnés par $ dépensé. ROAS sous 1 = on perd de l\'argent</p>' +
      '<div class="panel" style="overflow-x:auto;">' +
        '<table class="partner-id-table tableau-stats"><thead><tr>' +
          '<th>Ad Set</th><th>Dépense</th><th>Ventes</th><th>ROAS</th><th>Recommandation</th>' +
        '</tr></thead><tbody>' + corps + '</tbody></table>' +
      '</div>';
  }

  /* ===================== Accueil : démarrage ===================== */

  // Signale à la page Velo que l'iframe est prête ; la page répond avec la session.
  envoyerAuParent({ action: 'ready' });
})();

</script>
</body>
</html>
