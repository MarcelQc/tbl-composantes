<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditions TBL — Tableau de bord</title>
<style>
/* Jetons des gabarits (Templates\tokens.css, allure de calendrier-vedettes.html). Copiés ici : la page est un fichier autonome. */
:root {
  --tbl-bg: #000;
  --tbl-paper: #16181c;
  --tbl-paper-2: #111317;
  --tbl-line: #34373e;
  --tbl-ink: #f5f5f5;
  --tbl-muted: #b7bac2;
  --tbl-accent: #e52530;
  --tbl-accent-soft: #5b2126;
  --tbl-ok: #4cc38a;
  --tbl-orange: #e8a33d;
  --tbl-orange-soft: #3d2c12;
  --tbl-blue: #5b9bf0;
  --tbl-blue-soft: #14233d;
  --tbl-font-heading: Arial, Helvetica, sans-serif;
  --tbl-font-body: Arial, Helvetica, sans-serif;
  --tbl-radius: 14px;
  --tbl-radius-btn: 9px;
  --tbl-shadow: 0 6px 18px rgba(0,0,0,.5);
}

/* Couleurs du tableau de bord, rattachées aux jetons. --accent est le rouge TBL des actions et de la sélection. */
:root {
  --bg: var(--tbl-bg);
  --bg-elevated: var(--tbl-paper-2);
  --bg-panel: var(--tbl-paper);
  --bg-hover: #20232a;
  --border: var(--tbl-line);
  --border-soft: var(--tbl-line);
  --text: var(--tbl-ink);
  --text-dim: var(--tbl-muted);
  --text-faint: #8a8e97;
  --accent: var(--tbl-accent);
  --accent-soft: var(--tbl-accent-soft);
  --accent-contrast: #fff;
  --rouge-texte: #ffb3b8;
  --green: var(--tbl-ok);
  --green-soft: rgba(76,195,138,.15);
  --red: var(--tbl-accent);
  --blue: var(--tbl-blue);
  --blue-soft: var(--tbl-blue-soft);
  --orange: var(--tbl-orange);
  --orange-soft: var(--tbl-orange-soft);
  --radius: var(--tbl-radius);
  --radius-btn: var(--tbl-radius-btn);
  --shadow: var(--tbl-shadow);
  font-size: 15px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--tbl-font-body);
  line-height: 1.5;
  min-height: 100vh;
}
html { scrollbar-color: var(--border) var(--bg); scrollbar-width: thin; }
h1, h2, h3 { font-family: var(--tbl-font-heading); font-weight: bold; }
button, input, select, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- Header / nav ---------- */

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px 24px;
  padding: 14px 28px 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-wrap: wrap;
}
.app-header .brand { padding-bottom: 14px; }

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 220px;
}

.brand-logo {
  height: 40px;
  width: auto;
  max-width: 120px;
  object-fit: contain;
  border-radius: 4px;
}

.brand-fallback {
  display: none;
  height: 40px;
  width: 40px;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: var(--accent-contrast);
  font-weight: 700;
  border-radius: 6px;
  letter-spacing: 0.5px;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.brand-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
}

.brand-subtitle {
  font-size: 0.78rem;
  color: var(--text-dim);
}

/* Onglets style « dossier » (Templates\tabs.html) : l'onglet actif s'ouvre sur la page en dessous. */
.tabs {
  display: flex;
  gap: 4px;
  align-self: flex-end;
  align-items: flex-end;
  max-width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin-bottom: -1px;
}
.tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  flex-shrink: 0;
  white-space: nowrap;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-bottom: 0;
  color: var(--text-dim);
  padding: 10px 18px;
  border-radius: var(--radius-btn) var(--radius-btn) 0 0;
  font-family: var(--tbl-font-heading);
  font-size: 0.92rem;
  cursor: pointer;
  transition: color 0.15s;
}

.tab-btn:hover { color: var(--text); }

.tab-btn.active {
  background: var(--bg);
  color: var(--text);
  font-weight: bold;
  box-shadow: inset 0 2px 0 var(--accent);
  padding-bottom: 11px;
}

/* ---------- Content ---------- */

.content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 28px 80px;
  min-height: calc(100vh - 140px);
}

/* Onglet Tâches : tableau plus large (3 colonnes serrées à 1100px) --
   prend 70% de la largeur de la page plutôt que la largeur standard. */
.content.content-taches {
  max-width: 70vw;
}

.view h1 {
  font-size: 1.6rem;
  margin: 0 0 6px;
  font-weight: 600;
}

.lede {
  color: var(--text-dim);
  margin: 0 0 28px;
  font-size: 0.95rem;
}

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.panel h2 {
  margin: 0 0 12px;
  font-size: 1.05rem;
  font-weight: 600;
}

.empty {
  color: var(--text-faint);
  font-style: italic;
  font-size: 0.9rem;
}

/* ---------- Accueil ---------- */

.ventes-indicateurs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 12px;
}

.indicateur-carte {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius);
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  box-shadow: var(--shadow);
}

.indicateur-carte.indicateur-montant { border-left-color: var(--green); }
.indicateur-carte.indicateur-depense { border-left-color: var(--blue); }

.indicateur-valeur {
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
}

.indicateur-carte.indicateur-montant .indicateur-valeur { color: var(--green); }

.indicateur-label {
  color: var(--text-dim);
  font-size: 0.85rem;
}

#ventes-indicateurs-note { margin: -4px 0 24px; }
#ventes-indicateurs-note a { cursor: pointer; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.stat-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--shadow);
}

.stat-value {
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--accent);
}

.stat-label {
  color: var(--text-dim);
  font-size: 0.82rem;
}

.accueil-columns {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 20px;
}

@media (max-width: 720px) {
  .accueil-columns { grid-template-columns: 1fr; }
}

.quick-links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.quick-links li a {
  display: block;
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--bg-elevated);
  color: var(--text);
  border: 1px solid var(--border-soft);
}
.quick-links li a:hover {
  background: var(--bg-hover);
  text-decoration: none;
  border-color: var(--accent-soft);
}

.forum-preview-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border-soft);
  font-size: 0.88rem;
}
.forum-preview-item:last-child { border-bottom: none; }
.forum-preview-meta { color: var(--text-faint); font-size: 0.78rem; }

/* ---------- Documentation ---------- */

.doc-section {
  margin-bottom: 14px;
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
}
.doc-section h2 {
  font-size: 1.05rem;
  margin: 0;
}

.doc-section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  cursor: pointer;
  background: var(--bg-elevated);
  user-select: none;
}
.doc-section-header:hover { background: var(--bg-hover); }

.doc-section-chevron {
  display: inline-block;
  color: var(--text-dim);
  font-size: 0.8rem;
  transition: transform 0.15s;
}
.doc-section.open .doc-section-chevron { transform: rotate(90deg); }

.doc-section-body {
  display: none;
  padding: 18px;
  border-top: 1px solid var(--border-soft);
}
.doc-section.open .doc-section-body { display: block; }

.doc-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.doc-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.doc-card-title {
  font-weight: 600;
  font-size: 0.92rem;
  text-transform: capitalize;
}

.doc-card-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--bg-hover);
  color: var(--text-dim);
  align-self: flex-start;
}

.doc-actions { margin-bottom: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Skills ---------- */

.skills-boutons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.skill-bouton {
  background: var(--bg-panel);
  color: var(--text-dim);
  border: 1px solid var(--border-soft);
  padding: 8px 14px;
  border-radius: var(--radius-btn);
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.skill-bouton:hover { background: var(--bg-hover); color: var(--text); }
.skill-bouton.active {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent-soft);
  font-weight: 600;
}

.skills-detail { max-width: 820px; }

.skill-detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-soft);
}
.skill-detail-header h2 { margin: 0 0 6px; font-size: 1.2rem; }
.skill-detail-description { margin: 0; color: var(--text-dim); font-size: 0.88rem; }

/* Boutons (Templates\action-buttons.html et confirm-modal.html) :
   secondaire = contour, la bordure passe au rouge au survol ; principal = rouge TBL, texte blanc gras. */
.btn {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: var(--radius-btn);
  font-size: 0.88rem;
  font-weight: normal;
  cursor: pointer;
  transition: border-color 0.15s, filter 0.15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); text-decoration: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: bold;
  padding: 10px 18px;
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); }

.btn-sm { padding: 6px 10px; font-size: 0.8rem; }

/* ---------- Forum ---------- */

.forum-compose { margin-bottom: 26px; }
.field-row { display: flex; gap: 12px; margin-bottom: 10px; }
.field-row label, .forum-compose > label { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: var(--text-dim); flex: 1; }

input[type="text"], textarea {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-btn);
  padding: 9px 12px;
  font-family: inherit;
  font-size: 0.9rem;
  resize: vertical;
}
input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.forum-compose textarea { margin-bottom: 12px; width: 100%; }

.forum-liste { display: flex; flex-direction: column; gap: 14px; }

.forum-msg {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 14px 16px;
}

.forum-msg-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}

.forum-msg-auteur { font-weight: 600; color: var(--accent); font-size: 0.9rem; }
.forum-msg-date { color: var(--text-faint); font-size: 0.75rem; }
.forum-msg-texte { white-space: pre-wrap; font-size: 0.92rem; line-height: 1.5; }

.forum-reponses {
  margin-top: 12px;
  padding-left: 18px;
  border-left: 2px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.forum-reponse-toggle {
  margin-top: 10px;
  font-size: 0.8rem;
  display: flex;
  gap: 8px;
}

.forum-msg-actions {
  margin-top: 8px;
}

.delete-message-btn, .delete-reponse-btn {
  color: var(--text-faint);
}
.delete-message-btn:hover, .delete-reponse-btn:hover {
  color: var(--rouge-texte);
  border-color: var(--red);
  background: var(--accent-soft);
}

.forum-reply-box {
  margin-top: 8px;
  display: none;
  gap: 8px;
  flex-direction: column;
}
.forum-reply-box.open { display: flex; }
.forum-reply-box textarea { width: 100%; }

/* ---------- Auteurs ---------- */

.auteurs-liste { display: flex; flex-direction: column; gap: 18px; }

.auteur-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 16px 18px;
}

.auteur-nom { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }

.oeuvre {
  padding: 10px 0;
  border-top: 1px solid var(--border-soft);
}
.oeuvre:first-child { border-top: none; }

.oeuvre-titre { font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }

.oeuvre-docs { display: flex; gap: 8px; flex-wrap: wrap; }

.doc-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  font-size: 0.78rem;
  color: var(--text);
}
.doc-pill:hover { background: var(--bg-hover); text-decoration: none; border-color: var(--accent-soft); }
.doc-pill.manuscrit { border-color: var(--accent-soft); }
.doc-pill.analyse_pdf, .doc-pill.analyse_html { color: var(--green); }

.auteurs-archives-section {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--border-soft);
}
.auteurs-archives-section h2 {
  font-size: 0.95rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  margin: 0 0 14px;
}
.auteurs-liste-archives .auteur-card { opacity: 0.7; }
.auteurs-liste-archives .auteur-card:hover { opacity: 1; }

/* ---------- Rencontres ---------- */

.rencontres-liste { display: flex; flex-direction: column; gap: 20px; }

.rencontre-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
}

.rencontre-header {
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  cursor: pointer;
  background: var(--bg-elevated);
}

.rencontre-titre-group { display: flex; flex-direction: column; gap: 2px; }
.rencontre-date { font-weight: 700; font-size: 1rem; }
.rencontre-titre { color: var(--text-dim); font-size: 0.82rem; }

/* Pastilles de statut (Templates\status-badge.html) : fond teinté et point de couleur. */
.rencontre-status, .pbi-statut {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
}
.rencontre-status::before, .pbi-statut::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.rencontre-status.en-cours, .pbi-statut.en_cours { background: var(--orange-soft); color: var(--orange); }
.rencontre-status.terminee, .pbi-statut.termine { background: var(--green-soft); color: var(--green); }
.rencontre-status.a-venir, .pbi-statut.nouveau { background: var(--blue-soft); color: var(--blue); }
.rencontre-status.a-determiner { background: var(--bg-hover); color: var(--text-dim); }

.rencontre-body { padding: 18px; display: none; border-top: 1px solid var(--border-soft); }
.rencontre-body.open { display: block; }

.rencontre-groupe { margin-bottom: 16px; }
.rencontre-groupe-titre {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-weight: 600;
  font-size: 0.92rem;
  margin-bottom: 8px;
  color: var(--text);
}

.rencontre-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 0;
  font-size: 0.88rem;
}

.rencontre-item-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex: 1;
  cursor: pointer;
}

.rencontre-item input[type="checkbox"] {
  margin-top: 3px;
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
  cursor: pointer;
}

.rencontre-item-texte { flex: 1; }
.rencontre-item.checked .rencontre-item-texte { color: var(--text-dim); text-decoration: line-through; }

.rencontre-item-supprimer {
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
  flex-shrink: 0;
}
.rencontre-item-supprimer:hover { color: var(--rouge-texte); }

.rencontre-subsection { margin-top: 18px; }
.rencontre-subsection h3 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  margin: 0 0 8px;
}

.rencontre-original-text {
  white-space: pre-wrap;
  font-size: 0.85rem;
  color: var(--text-dim);
  background: var(--bg-elevated);
  border-radius: var(--radius-btn);
  padding: 10px 12px;
}

.rencontre-footer {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
}

.rencontre-comment-box { flex: 1; min-width: 240px; }
.rencontre-comment-box label { display: block; font-size: 0.78rem; color: var(--text-dim); margin-bottom: 6px; }
.rencontre-comment-box textarea { width: 100%; }

/* ---------- Markdown viewer (documentation) ---------- */

.md-viewer {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  padding: 20px 24px;
  line-height: 1.6;
  max-width: 820px;
}
.md-viewer h1, .md-viewer h2, .md-viewer h3 { color: var(--text); }
.md-viewer h1 { font-size: 1.4rem; }
.md-viewer h2 { font-size: 1.15rem; margin-top: 26px; }
.md-viewer h3 { font-size: 1rem; margin-top: 18px; }
.md-viewer code { background: var(--bg-elevated); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
.md-viewer pre { background: var(--bg-elevated); padding: 12px 14px; border-radius: 6px; overflow-x: auto; }
.md-viewer table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 0.88rem; }
.md-viewer th, .md-viewer td { border: 1px solid var(--border-soft); padding: 6px 10px; text-align: left; }
.md-viewer ul, .md-viewer ol { padding-left: 22px; }
.md-viewer a { color: var(--accent); }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  z-index: 100;
  overflow-y: auto;
}
.modal-backdrop.open { display: flex; }
.modal-box {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 860px;
  width: 100%;
  box-shadow: 0 20px 50px rgba(0,0,0,.6);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-soft);
}
.modal-header h2 { margin: 0; font-size: 1.05rem; }
.modal-close {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.3rem;
  cursor: pointer;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; max-height: 70vh; overflow-y: auto; }

/* Fenêtre de confirmation (Templates\confirm-modal.html), au-dessus des autres fenêtres. */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 200;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: var(--bg-panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 20px 50px rgba(0,0,0,.6);
  padding: 24px;
  max-width: 380px;
  width: 100%;
}
.confirm-box h3 { margin: 0 0 10px; font-size: 1.15rem; }
.confirm-box p { margin: 0 0 20px; font-size: 0.92rem; line-height: 1.5; color: var(--text-dim); }
.confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ---------- Configuration (bouton global) ---------- */

.btn-config {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-btn);
  font-size: 1.1rem;
  cursor: pointer;
  flex-shrink: 0;
}
.btn-config:hover { color: var(--text); border-color: var(--accent); }

select {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius-btn);
  padding: 9px 12px;
  font-family: inherit;
  font-size: 0.9rem;
}
select:focus { outline: none; border-color: var(--accent); }

.btn-supprimer {
  color: var(--text-faint);
}
.btn-supprimer:hover {
  color: var(--rouge-texte);
  border-color: var(--red);
  background: var(--accent-soft);
}

/* ---------- Tâches (Kanban + PBI) ---------- */

.taches-toolbar { margin-bottom: 18px; display: flex; gap: 10px; flex-wrap: wrap; }

/* Liste en arbre, comme dans Azure DevOps : une ligne par PBI, une sous-ligne par tâche
   (demande de Marcel avec l'accord de Martin, 17 octobre 2026). Colonnes : Titre, État, Assigné à, actions. */
.arbre-taches {
  background: var(--bg-panel);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow: hidden;
}

.arbre-ligne {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px 92px 112px;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  border-top: 1px solid var(--border-soft);
  min-height: 42px;
}

.arbre-entete {
  border-top: 0;
  min-height: 0;
  padding-top: 10px;
  padding-bottom: 10px;
  background: var(--bg-elevated);
  font-size: 0.74rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-faint);
}

.arbre-pbi { background: var(--bg-elevated); cursor: pointer; user-select: none; }
.arbre-pbi:hover { background: var(--bg-hover); }
.arbre-tache { cursor: pointer; }
.arbre-tache:hover { background: var(--bg-hover); }
.arbre-groupe.collapsee .arbre-tache,
.arbre-groupe.collapsee .arbre-vide { display: none; }

.arbre-titre {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
  font-size: 0.9rem;
}
.arbre-pbi .arbre-titre { font-weight: 600; font-size: 0.95rem; }
.arbre-tache .arbre-titre { padding-left: 34px; }

.arbre-chevron {
  flex-shrink: 0;
  width: 14px;
  line-height: 1.35;
  color: var(--text-dim);
  font-size: 0.75rem;
}
.arbre-icone { flex-shrink: 0; font-size: 0.95rem; }
.arbre-texte { min-width: 0; line-height: 1.35; overflow-wrap: anywhere; }

.taches-count {
  flex-shrink: 0;
  display: inline-block;
  min-width: 20px;
  text-align: center;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--rouge-texte);
  background: var(--accent-soft);
  border-radius: 99px;
  padding: 1px 8px;
}

.arbre-qui { font-size: 0.86rem; color: var(--text-dim); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arbre-qui-mobile { display: none; }

/* État d'une tâche : point de couleur et liste déroulante (changer la colonne sans glisser-déposer). */
.arbre-etat { display: flex; align-items: center; gap: 8px; min-width: 0; }
.etat-point { flex-shrink: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--text-faint); }
.etat-point.nouveau { background: var(--blue); }
.etat-point.en_cours { background: var(--orange); }
.etat-point.termine { background: var(--green); }
.etat-select {
  min-width: 0;
  width: 100%;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-btn);
  padding: 4px 6px;
  color: var(--text);
  font: inherit;
  font-size: 0.86rem;
  cursor: pointer;
}
.etat-select:hover, .etat-select:focus { border-color: var(--border); outline: none; }
.etat-select option { background: var(--bg-panel); color: var(--text); }
.arbre-pbi .pbi-statut { margin-left: 0; }

/* Actions d'un PBI : « + Tâche » et le menu ⋯ (Modifier, Archiver, Supprimer). */
.arbre-actions { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.menu-pbi { position: relative; }
.menu-pbi > summary {
  list-style: none;
  cursor: pointer;
  padding: 2px 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-btn);
  color: var(--text-dim);
  font-weight: 700;
  line-height: 1.4;
}
.menu-pbi > summary::-webkit-details-marker { display: none; }
.menu-pbi > summary:hover { border-color: var(--accent); color: var(--text); }
.menu-pbi-liste {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  z-index: 20;
  min-width: 150px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-btn);
  box-shadow: var(--shadow);
}
.menu-pbi-liste .btn { width: 100%; text-align: left; }

.arbre-vide { padding: 8px 14px 10px 62px; border-top: 1px solid var(--border-soft); font-size: 0.84rem; color: var(--text-faint); }

.item-numero {
  flex-shrink: 0;
  font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
  font-size: 0.7rem;
  color: var(--text-faint);
}

.tache-assigne-pill {
  align-self: flex-start;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--rouge-texte);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 2px 9px;
}

.tache-piece-jointe-icone { margin-left: 6px; font-size: 0.8rem; }

/* .pbi-statut : couleurs avec .rencontre-status (section Rencontres) */
.pbi-statut { font-size: 0.72rem; padding: 2px 10px; margin-left: 8px; vertical-align: middle; }

.tache-pieces-jointes {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 4px 0;
}

.tache-piece-jointe {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
}

@media (max-width: 720px) {
  .arbre-ligne { grid-template-columns: minmax(0, 1fr) 118px; gap: 8px; padding: 8px 10px; }
  .arbre-entete .arbre-qui, .arbre-entete .arbre-actions-titre { display: none; }
  .arbre-ligne > .arbre-qui { display: none; }
  .arbre-qui-mobile { display: inline; font-size: 0.74rem; color: var(--text-faint); white-space: nowrap; }
  .arbre-titre { flex-wrap: wrap; row-gap: 4px; }
  .arbre-titre .arbre-texte { order: 10; flex-basis: 100%; }
  .arbre-tache .arbre-titre { padding-left: 18px; }
  .arbre-pbi .arbre-etat { display: none; }
  .arbre-vide { padding-left: 40px; }
}

/* ---------- Footer ---------- */

.app-footer {
  text-align: center;
  color: var(--text-faint);
  font-size: 0.75rem;
  padding: 16px;
  border-top: 1px solid var(--border-soft);
}

/* ---------- Ajouts propres à la version en ligne (non présents dans le tableau local) ---------- */

/* Réunions archivées : discrètes, en bas de l'onglet Rencontres */
.archives {
  margin-top: 28px;
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
}
.archives h3 {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-faint);
  margin: 0 0 8px;
  font-weight: 600;
}
.archive-ligne {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  font-size: 0.85rem;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border-soft);
}
.archive-ligne:last-child { border-bottom: none; }

/* PartnerID : tableau en lecture seule */
.partner-id-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.partner-id-table th {
  text-align: left;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-faint);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.partner-id-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-soft); }
.partner-id-table tr:last-child td { border-bottom: none; }
.partner-id-code { font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace; color: var(--accent); }

/* ---------- Téléphones (720 px et moins) : l'affichage desktop n'est pas touché ---------- */

.mobile-seulement { display: none; }

/* Rencontres : icône calendrier à côté de la date et petite boîte calendrier */
.rencontre-date { display: inline-flex; align-items: center; gap: 8px; }
.rencontre-date-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: var(--radius-btn);
  cursor: pointer;
}
.rencontre-date-btn:hover { color: var(--text); border-color: var(--accent); }

.calendrier-pop {
  position: fixed;
  z-index: 900;
  width: 260px;
  padding: 12px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--tbl-shadow);
  font-size: 0.85rem;
}
.calendrier-pop.occupe { opacity: .6; pointer-events: none; }
.calendrier-entete { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
.calendrier-nav {
  width: 30px;
  height: 30px;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-btn);
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
}
.calendrier-nav:hover { border-color: var(--accent); }
.calendrier-grille { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.calendrier-jsem { padding: 4px 0; font-size: 0.72rem; font-weight: 700; color: var(--text-faint); }
.calendrier-jour {
  height: 32px;
  padding: 0;
  background: transparent;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: 8px;
  font-size: 0.85rem;
  cursor: pointer;
}
.calendrier-jour:hover { background: var(--bg-hover); }
.calendrier-jour.aujourdhui { border-color: var(--border); font-weight: 700; }
.calendrier-jour.choisi { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 700; }
.calendrier-erreur { margin: 8px 0 0; color: var(--rouge-texte); font-size: 0.8rem; }
.calendrier-pied { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-soft); text-align: right; }
.calendrier-lien { background: none; border: 0; padding: 4px 0; color: var(--text-dim); font-size: 0.8rem; cursor: pointer; }
.calendrier-lien:hover { color: var(--text); text-decoration: underline; }

/* Mise en page de l'Espace Auteurs (EDA) : largeur min(1160px, 100% - 28px) et onglets « dossier »
   posés sur le panneau qui contient l'onglet affiché (l'onglet actif se fond dans le panneau). */
.wrap { width: min(1160px, calc(100% - 28px)); margin: 0 auto; }
.app-header { position: static; padding: 14px 0 12px; border-bottom: 0; background: transparent; }
.app-header .brand { padding-bottom: 0; }
.tabs { align-self: auto; margin-bottom: 0; padding: 2px 2px 0; }
.tab-btn.active { background: var(--tbl-paper); padding-bottom: 10px; }
/* Comme dans l'EDA, les cartes à l'intérieur du panneau sont un ton plus foncé que lui. */
.content {
  --bg-panel: var(--tbl-paper-2);
  --bg-elevated: #0b0c0f;
  max-width: none;
  margin: 0 0 28px;
  padding: 24px;
  min-height: calc(100vh - 190px);
  background: var(--tbl-paper);
  border: 1px solid var(--border);
  border-radius: 0 var(--radius) var(--radius) var(--radius);
}
.content.content-taches { max-width: none; }

/* Manuscrits : tableau des livres et visionneuse d'analyse */
.table-defilante { overflow-x: auto; }
.manuscrits-table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: 0.9rem; }
.manuscrits-table th {
  text-align: left;
  padding: 8px 10px;
  font-size: 0.74rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--text-faint);
  border-bottom: 1px solid var(--border-soft);
}
.manuscrits-table td { padding: 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.manuscrits-table tr:last-child td { border-bottom: none; }
.manuscrit-titre { font-weight: 700; }
.manuscrit-auteur { font-weight: 600; }
.manuscrit-coordonnees { display: flex; flex-direction: column; margin-top: 3px; font-size: 0.8rem; color: var(--text-dim); white-space: pre-line; }
.manuscrit-actions { text-align: right; white-space: nowrap; }

.analyse-overlay {
  position: fixed;
  inset: 0;
  z-index: 950;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.75);
}
.analyse-boite {
  display: flex;
  flex-direction: column;
  width: min(1000px, 100%);
  height: min(92vh, 100%);
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.analyse-entete {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.analyse-livre { display: block; font-size: 0.8rem; color: var(--text-dim); }
.analyse-boutons { display: flex; gap: 8px; flex-shrink: 0; }
.analyse-corps { flex: 1; min-height: 0; background: #fff; }
.analyse-corps > .empty { padding: 16px; background: var(--bg-panel); margin: 0; height: 100%; }
.analyse-cadre { width: 100%; height: 100%; border: 0; display: block; }

/* Bouton Actualiser dans l'en-tête, à droite de « Éditions TBL / Tableau de bord » : toujours visible,
   même quand la barre d'onglets déborde et défile
   (bouton secondaire, Templates\action-buttons.html). */
.tabs-actualiser {
  flex-shrink: 0;
  align-self: center;
  margin: 0;
  padding: 8px 14px;
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-btn);
  font-family: var(--tbl-font-body);
  font-size: 0.9rem;
  white-space: nowrap;
  cursor: pointer;
}
.tabs-actualiser:hover { border-color: var(--accent); }
.app-header { justify-content: flex-start; gap: 12px 28px; }

/* Vente <année> : tableaux du classeur de suivi des ventes (en-tête rouge foncé, grille, ligne TOTAL) */
.ventes-table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 0.88rem; }
.ventes-table.ventes-globales { min-width: 0; max-width: 520px; }
.ventes-table th {
  padding: 8px 10px;
  background: var(--tbl-accent-soft);
  color: #fff;
  font-weight: 700;
  text-align: center;
  border: 1px solid var(--border);
}
.ventes-table td { padding: 6px 10px; text-align: center; border: 1px solid var(--border-soft); }
.ventes-table td:first-child, .ventes-table th:first-child { text-align: left; }
.ventes-table .ventes-total-col { font-weight: 700; }
.ventes-table tr.ventes-total td { font-weight: 700; border-top: 2px solid var(--text-dim); background: var(--bg-elevated); }
.ventes-note { margin: 12px 0 0; font-size: 0.85rem; color: var(--text-dim); }
.ventes-choix { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.ventes-titre-livre { margin: 0 0 10px; font-size: 1rem; letter-spacing: 0.3px; }

/* Ventes numériques : choix de la période et tableau des produits */
.num-periode { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.num-rapides { display: flex; flex-wrap: wrap; gap: 8px; }
.num-dates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--text-dim); font-size: 0.88rem; }
.num-dates .btn { display: inline-flex; align-items: center; gap: 6px; }
.num-indicateurs { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 520px; margin-bottom: 16px; }
.num-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.num-table th {
  padding: 8px 10px;
  background: var(--tbl-accent-soft);
  color: #fff;
  font-weight: 700;
  text-align: left;
  border: 1px solid var(--border);
}
.num-table th:last-child, .num-table td:last-child { text-align: right; width: 150px; }
.num-table td { padding: 7px 10px; border: 1px solid var(--border-soft); }
.num-table tr.num-zero td { color: var(--text-faint); }
.num-table tr.num-total td { font-weight: 700; border-top: 2px solid var(--text-dim); background: var(--bg-elevated); }

/* Forum : l'auteur modifie son message en place (zone d'édition sous le texte, comme la réponse) */
.forum-msg-actions { display: flex; gap: 8px; }
.forum-edit-actions { display: flex; gap: 8px; }

/* Commentaires des auteurs (plan « Plan de travail Commentaires », PBI #1084, déménagé de l'Espace Auteurs le
   23 octobre 2026) : bouton de l'en-tête avec le nombre de non-lus, fenêtre pleine grandeur, une carte repliable
   par commentaire, la réponse de l'équipe en dessous comme dans le Forum. */
#btn-commentaires { display: inline-flex; align-items: center; gap: 8px; }
#btn-commentaires[hidden], .com-pastille[hidden] { display: none; }
.com-pastille { background: var(--accent); color: #fff; border-radius: 999px; padding: 0 8px; font-size: 0.75rem; font-weight: 700; min-width: 22px; text-align: center; }
.com-overlay { position: fixed; inset: 0; z-index: 960; background: var(--bg-panel); display: flex; flex-direction: column; padding: 18px 26px 14px; }
.com-overlay[hidden] { display: none; }
.com-overlay > * { flex: 0 0 auto; }
.com-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.com-tete h2 { margin: 0; font-size: 1.35rem; }
.com-intro { margin: 6px 0 10px; color: var(--text-dim); font-size: 0.9rem; }
.com-filtres { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 6px; }
.com-filtres label { color: var(--text-dim); font-size: 0.85rem; }
.com-filtres select { min-width: 150px; padding: 7px 10px; background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-btn); }
.com-case { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.com-case input { width: 17px; height: 17px; accent-color: var(--accent); }
.com-statut { min-height: 1.4em; margin: 2px 0 8px; color: var(--text-dim); font-size: 0.88rem; }
.com-statut.err { color: var(--rouge-texte); }
.com-liste { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.com-carte { flex: 0 0 auto; background: var(--bg-elevated); border: 1px solid var(--border-soft); border-radius: var(--radius-btn); }
.com-carte.non-lu { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.com-carte.supprime { opacity: 0.75; }
.com-carte > button.com-entete { all: unset; box-sizing: border-box; width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 6px 14px; padding: 12px 16px; cursor: pointer; }
.com-carte > button.com-entete:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.com-infos { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.com-date { font-weight: bold; }
.com-endroit { color: var(--text-dim); font-size: 0.85rem; }
.com-apercu { color: var(--text-dim); font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: min(900px, 100%); }
.com-badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; background: var(--bg-hover); color: var(--text-dim); }
.com-badge.non-lu { background: var(--orange-soft); color: var(--orange); }
.com-badge.lu { background: var(--blue-soft); color: var(--blue); }
.com-badge.repondu { background: var(--green-soft); color: var(--green); }
.com-badge.detruite { background: var(--accent-soft); color: var(--rouge-texte); }
.com-corps { padding: 0 16px 14px; }
.com-texte { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.com-note { margin: 6px 0 0; color: var(--text-faint); font-size: 0.8rem; }
.com-detruite { margin: 8px 0 0; color: var(--rouge-texte); font-weight: bold; }
.com-reponse { margin-top: 12px; padding: 10px 14px; border-left: 3px solid var(--green); background: var(--bg-panel); border-radius: 0 var(--radius-btn) var(--radius-btn) 0; }
.com-reponse .com-titre-reponse { margin: 0 0 4px; font-weight: bold; color: var(--green); font-size: 0.88rem; }
.com-zone label { display: block; font-weight: bold; margin: 10px 0 6px; font-size: 0.88rem; }
.com-zone textarea { width: 100%; min-height: 90px; }
.com-compteur { color: var(--text-faint); font-size: 0.78rem; margin-top: 2px; }
.com-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.com-message { min-height: 1.2em; margin: 6px 0 0; font-size: 0.85rem; color: var(--text-dim); }
.com-message.ok { color: var(--green); }
.com-message.err { color: var(--rouge-texte); }

@media (max-width: 720px) {
  .com-overlay { padding: 12px 14px 10px; }
  .com-filtres select { min-width: 0; font-size: 16px; }
  .mobile-seulement { display: block; }
  span.mobile-seulement { display: inline; }
  .desktop-seulement { display: none; }

  /* En-tête : logo sur une ligne, onglets pleine largeur en dessous (défilement horizontal) */
  .app-header { padding: 10px 0 8px; gap: 8px; }
  .app-header .brand { padding-bottom: 0; }
  .brand { min-width: 0; gap: 10px; }
  .brand-logo { height: 32px; }
  .tabs { width: 100%; }
  .tab-btn { padding: 9px 12px; font-size: 0.85rem; }
  .tab-btn.active { padding-bottom: 10px; }

  /* Contenu : marges de 16 px, l'onglet Tâches prend toute la largeur */
  .content { padding: 16px 14px 28px; }
  .content.content-taches { max-width: none; }
  .view h1, .content h1 { font-size: 1.35rem; }
  .lede { margin-bottom: 18px; font-size: 0.9rem; }
  .panel { padding: 14px; }

  /* Accueil : indicateurs et statistiques sur deux colonnes */
  .ventes-indicateurs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .indicateur-carte { padding: 14px; }
  .indicateur-valeur { font-size: 1.45rem; overflow-wrap: anywhere; }
  .indicateur-label { font-size: 0.78rem; }
  .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-card { padding: 14px; }
  .stat-value { font-size: 1.35rem; overflow-wrap: anywhere; }

  /* Formulaires : champs empilés, police de 16 px pour éviter le zoom automatique sur iPhone */
  .field-row { flex-direction: column; gap: 10px; }
  input[type="text"], input[type="date"], textarea, select { font-size: 16px; max-width: 100%; }
  .btn-sm { padding: 8px 12px; }

  /* Forum */
  .forum-edit-actions { flex-wrap: wrap; }
  .forum-msg { padding: 12px; }
  .forum-msg-header { flex-wrap: wrap; gap: 2px 10px; }
  .forum-reponses { padding-left: 10px; }
  .forum-reponse-toggle { flex-wrap: wrap; }

  /* Rencontres */
  .rencontre-header { padding: 12px 14px; }
  .rencontre-body { padding: 14px; }
  .rencontre-comment-box { min-width: 0; flex-basis: 100%; }
  .archive-ligne { flex-wrap: wrap; }

  /* Tâches : l'arbre garde Titre et État ; l'assigné passe sous le titre (voir .arbre-qui-mobile) */
  .arbre-texte { white-space: normal; }

  /* Tableaux : défilement horizontal au besoin plutôt que de déborder de l'écran */
  .partner-id-table { font-size: 0.85rem; }
  .partner-id-table th, .partner-id-table td { padding: 7px 8px; }
  .partner-id-table td { overflow-wrap: anywhere; }
  .tableau-stats td { overflow-wrap: normal; white-space: nowrap; }
  .tableau-stats td:last-child { white-space: normal; min-width: 180px; }

  /* Fenêtres */
  .modal-backdrop { padding: 12px; }
  .modal-header { padding: 12px 16px; }
  .modal-body { padding: 16px; max-height: 80vh; }
  .confirm-box { padding: 18px; }
}

</style>

<script>
(function () {
  'use strict';

  /* ===================== Pont avec la page Velo ===================== */

  var etat = { admin: null, pret: false };
  var attentes = {};
  var compteur = 0;

  // La page est servie par GitHub Pages et chargée dans la composante HTML #dashboard de /dbadmin
  // (comme l'Espace Auteurs) : on n'accepte que les messages de cette page parente
  // (site publié, ou Aperçu dans l'éditeur Wix). Le backend vérifie l'administrateur à chaque appel.
  var ORIGINES_PERMISES = [/^https:\/\/(www\.)?editionstbl\.ca$/, /^https:\/\/[a-z0-9-]+\.editor\.wix\.com$/, /^https:\/\/editor\.wix\.com$/];
  function origineAutorisee(origine) {
    return ORIGINES_PERMISES.some(function (motif) { return motif.test(origine); });
  }

  function envoyerAuParent(message) {
    if (window.parent === window) return;
    window.parent.postMessage(message, '*');
  }

  // Appelle une fonction du backend Velo et renvoie une promesse de son résultat.
  // Sans réponse après DELAI_REPONSE_MS (page Wix pas encore publiée avec cette fonction, serveur
  // en panne), la promesse échoue avec un message clair au lieu d'attendre indéfiniment.
  var DELAI_REPONSE_MS = 30000;
  function appeler(action) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resoudre, rejeter) {
      var reqId = ++compteur;
      var minuterie = setTimeout(function () {
        if (!attentes[reqId]) return;
        delete attentes[reqId];
        rejeter(new Error('le serveur ne répond pas (« ' + action + ' »). Si cette fonction est nouvelle, ' +
          'le site Wix doit être publié pour l\'activer.'));
      }, DELAI_REPONSE_MS);
      attentes[reqId] = {
        resoudre: function (v) { clearTimeout(minuterie); resoudre(v); },
        rejeter: function (e) { clearTimeout(minuterie); rejeter(e); },
      };
      envoyerAuParent({ action: action, reqId: reqId, args: args });
    });
  }

  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || !origineAutorisee(event.origin)) return; // seuls les messages de la page parente sont acceptés
    var d = event.data || {};
    if (d.action === 'init') {
      etat.admin = d.admin;
      etat.pret = true;
      renderTab(currentTab());
      if (etat.admin) comDemarrer(); // bouton « Commentaires » et son nombre de non-lus
      return;
    }
    if (d.reqId && attentes[d.reqId]) {
      var attente = attentes[d.reqId];
      delete attentes[d.reqId];
      if (d.ok) attente.resoudre(d.data);
      else attente.rejeter(new Error(d.error || 'Erreur inconnue'));
    }
  });

  /* ===================== Outils ===================== */

  var MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
    'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var MEMBRES_EQUIPE = ['Marcel', 'Martin'];
  var STATUTS_PBI = [
    { valeur: 'nouveau', label: 'Nouveau' },
    { valeur: 'en_cours', label: 'En cours' },
    { valeur: 'termine', label: 'Terminé' },
  ];

  function esc(valeur) {
    return String(valeur == null ? '' : valeur)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatDateFr(iso) {
    try {
      return new Date(iso).toLocaleString('fr-CA', {
        timeZone: 'America/Toronto', dateStyle: 'medium', timeStyle: 'short'
      });
    } catch (e) {
      return iso;
    }
  }

  // « 15 août 2026 »
  function formatDateLongue(isoDate) {
    var p = String(isoDate).split('-').map(Number);
    return p[2] + ' ' + MOIS_FR[p[1] - 1] + ' ' + p[0];
  }

  function todayIso() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
  }

  function rencontreStatus(dateIso, terminee) {
    if (terminee) return { cls: 'terminee', label: 'Terminée' };
    if (!dateIso) return { cls: 'a-determiner', label: 'À déterminer' };
    if (dateIso > todayIso()) return { cls: 'a-venir', label: 'À venir' };
    return { cls: 'en-cours', label: 'En cours' };
  }

  function statutPbiLabel(valeur) {
    return (STATUTS_PBI.find(function (s) { return s.valeur === valeur; }) || STATUTS_PBI[0]).label;
  }

  function optionsResponsableHtml(actuel) {
    return ['<option value="">(Non assigné)</option>']
      .concat(MEMBRES_EQUIPE.map(function (n) {
        return '<option value="' + esc(n) + '"' + (n === actuel ? ' selected' : '') + '>' + esc(n) + '</option>';
      })).join('');
  }

  function optionsStatutPbiHtml(actuel) {
    return STATUTS_PBI.map(function (s) {
      return '<option value="' + s.valeur + '"' + (s.valeur === (actuel || 'nouveau') ? ' selected' : '') + '>' + s.label + '</option>';
    }).join('');
  }

  /* ----- Fenêtres modales (identiques au tableau local) ----- */

  var modalEl = null;
  function ensureModal() {
    if (modalEl) return modalEl;
    modalEl = document.createElement('div');
    modalEl.className = 'modal-backdrop';
    modalEl.innerHTML =
      '<div class="modal-box">' +
        '<div class="modal-header"><h2 id="modal-title"></h2>' +
        '<button class="modal-close" aria-label="Fermer">&times;</button></div>' +
        '<div class="modal-body" id="modal-body"></div>' +
      '</div>';
    document.body.appendChild(modalEl);
    modalEl.querySelector('.modal-close').addEventListener('click', closeModal);
    modalEl.addEventListener('click', function (e) { if (e.target === modalEl) closeModal(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
    return modalEl;
  }
  function closeModal() {
    if (confirmEl && confirmEl.classList.contains('open')) { confirmEl.classList.remove('open'); confirmAction = null; return; }
    if (modalEl) modalEl.classList.remove('open');
  }

  /* ----- Fenêtre de confirmation (Templates\confirm-modal.html) ----- */

  var confirmEl = null;
  var confirmAction = null;
  function ensureConfirm() {
    if (confirmEl) return confirmEl;
    confirmEl = document.createElement('div');
    confirmEl.className = 'confirm-overlay';
    confirmEl.innerHTML =
      '<div class="confirm-box" role="dialog" aria-modal="true">' +
        '<h3 id="confirm-titre"></h3>' +
        '<p id="confirm-message"></p>' +
        '<div class="confirm-actions">' +
          '<button class="btn" id="confirm-annuler">Annuler</button>' +
          '<button class="btn btn-primary" id="confirm-ok"></button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(confirmEl);
    function fermer() { confirmEl.classList.remove('open'); confirmAction = null; }
    confirmEl.querySelector('#confirm-annuler').addEventListener('click', fermer);
    confirmEl.addEventListener('click', function (e) { if (e.target === confirmEl) fermer(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modalEl) fermer(); });
    confirmEl.querySelector('#confirm-ok').addEventListener('click', function () {
      var action = confirmAction;
      fermer();
      if (action) action();
    });
    return confirmEl;
  }
  // Demande une confirmation avant une action importante ; « action » ne s'exécute que sur le bouton rouge.
  function confirmer(titre, message, libelle, action) {
    var el = ensureConfirm();
    el.querySelector('#confirm-titre').textContent = titre;
    el.querySelector('#confirm-message').textContent = message;
    el.querySelector('#confirm-ok').textContent = libelle || 'Supprimer';
    confirmAction = action;
    el.classList.add('open');
    el.querySelector('#confirm-annuler').focus();
  }
  function openModal(titre, corpsHtml) {
    var el = ensureModal();
    el.querySelector('#modal-title').textContent = titre;
    el.querySelector('#modal-body').innerHTML = corpsHtml;
    el.classList.add('open');
  }

  // Affiche une erreur dans une fenêtre, ou exécute l'action puis recharge la vue.
  function signaler(promesse, recharger) {
    return promesse.then(function () {
      if (recharger) recharger();
    }).catch(function (e) {
      alert(e.message);
    });
  }

  /* ===================== Navigation ===================== */

  var ONGLETS = ['accueil', 'forum', 'rencontres', 'taches', 'manuscrits', 'ventes', 'ventes-numeriques', 'partner-id', 'publicite'];

  function currentTab() {
    var t = location.hash.slice(1);
    return ONGLETS.indexOf(t) >= 0 ? t : 'accueil';
  }

  function setActiveTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });
  }

  async function renderTab(tab) {
    if (!etat.pret) return;
    if (ONGLETS.indexOf(tab) < 0) tab = 'accueil';
    setActiveTab(tab);
    var content = document.getElementById('content');
    content.classList.toggle('content-taches', tab === 'taches');

    if (!etat.admin) {
      content.innerHTML = '<h1>Accès réservé</h1>' +
        '<p class="lede">Cette page est réservée aux administrateurs des Éditions TBL. ' +
        'Connecte-toi avec ton compte membre pour continuer.</p>';
      return;
    }

    content.innerHTML = '<p class="empty">Chargement…</p>';
    try {
      if (tab === 'accueil') await initAccueil();
      else if (tab === 'forum') await initForum();
      else if (tab === 'rencontres') await initRencontres();
      else if (tab === 'manuscrits') await initManuscrits();
      else if (tab === 'ventes') await initVentes();
      else if (tab === 'ventes-numeriques') await initVentesNumeriques();
      else if (tab === 'partner-id') await initPartnerId();
      else if (tab === 'publicite') await initPublicite();
      else await initTaches();
    } catch (e) {
      var message = '<p class="empty">Erreur de chargement : ' + esc(e.message) + '</p>';
      // Si l'onglet n'a rien affiché d'autre que « Chargement… », le message le remplace.
      if (content.children.length === 1 && content.firstElementChild.textContent === 'Chargement…') content.innerHTML = message;
      else content.insertAdjacentHTML('beforeend', message);
    }
  }

  // Actualiser (comme dans l'Espace Auteurs) : recharge seulement la composante HTML, pas la page Wix.
  // Le rechargement garde l'onglet affiché (#onglet) et redemande la session à la page.
  document.getElementById('btn-actualiser').addEventListener('click', function () {
    location.reload();
  });

  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    var tab = btn.dataset.tab;
    if (location.hash.slice(1) === tab) renderTab(tab);
    else location.hash = '#' + tab;
  });

  window.addEventListener('hashchange', function () { renderTab(currentTab()); });

  /* ===================== Commentaires des auteurs ===================== */
  // Plan « Plan de travail Commentaires » (PBI #1084, tâches #1090 à #1094), déménagé de l'Espace Auteurs le
  // 23 octobre 2026 avec l'accord de Martin. Serveur : backend/commentairesAdmin.web.js (Auteurs.admin relu à
  // chaque appel ; les fonctions renvoient { statut, ... } au lieu de lever une erreur).
  //   - bouton « Commentaires » de l'en-tête avec le nombre de commentaires non lus ;
  //   - liste du plus récent au plus ancien : date, auteur, endroit, livre ; filtres Auteur, Endroit,
  //     Non lus seulement ou Tous, et les commentaires supprimés par l'auteur sur demande (mention « Détruite ») ;
  //   - ouvrir un commentaire le passe à « Lu » ; le texte de l'auteur reste en lecture seule ;
  //   - réponse à la façon du Forum, modifiable ; la première réponse envoie un courriel à l'auteur.

  var COM_ENDROITS = { EDA: 'Espace Auteurs', EDL: 'Éditeur de livre', EDV: 'Mise en vedette', ELC: 'Espace Lecteur' };
  var COM_MAX = 2000;
  var com = { liste: null, ouverts: {}, brouillons: {}, editions: {}, messages: {}, envoi: null, avecSupprimes: false, overlay: null };

  function comEl(tag, classe, texte) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texte !== undefined && texte !== null) n.textContent = texte;
    return n;
  }
  function comPluriel(n, un, plusieurs) { return n + ' ' + (n > 1 ? plusieurs : un); }
  function comDate(iso) {
    if (!iso) return '';
    return new Intl.DateTimeFormat('fr-CA', { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Toronto' }).format(new Date(iso));
  }
  function comNonLus() {
    return (com.liste || []).filter(function (c) { return !c.supprime && c.etat === 'Non lu'; }).length;
  }
  function comMajPastille() {
    var n = comNonLus();
    var p = document.getElementById('nb-commentaires');
    p.textContent = n;
    p.hidden = n === 0;
    document.getElementById('btn-commentaires').setAttribute('aria-label', 'Commentaires' + (n ? ', ' + comPluriel(n, 'commentaire non lu', 'commentaires non lus') : ''));
  }

  function comDemarrer() {
    document.getElementById('btn-commentaires').hidden = false;
    comCharger();
  }

  function comCharger() {
    return appeler('listerCommentairesAdmin', { avecSupprimes: com.avecSupprimes }).then(function (r) {
      if (!r || r.statut !== 'ok') {
        comStatut('err', r && r.statut === 'refuse' ? 'Les commentaires sont réservés aux administrateurs (champ admin de la collection Auteurs).' : 'Les commentaires n’ont pas pu être chargés. Réessayez dans un instant.');
        return;
      }
      com.liste = r.commentaires || [];
      comMajPastille();
      if (com.overlay && !com.overlay.hidden) { comFiltreAuteur(); comRendre(); }
    }).catch(function (e) {
      comStatut('err', 'Les commentaires n’ont pas pu être chargés : ' + e.message);
    });
  }

  function comStatut(classe, texte) {
    if (!com.overlay) return;
    var s = com.overlay.querySelector('.com-statut');
    s.className = 'com-statut' + (classe ? ' ' + classe : '');
    s.textContent = texte;
  }

  function comConstruire() {
    if (com.overlay) return com.overlay;
    var o = comEl('div', 'com-overlay');
    o.setAttribute('role', 'dialog');
    o.setAttribute('aria-modal', 'true');
    o.setAttribute('aria-labelledby', 'com-titre');
    o.hidden = true;
    o.innerHTML =
      '<div class="com-tete"><h2 id="com-titre">Commentaires des auteurs/lecteurs</h2>' +
        '<button class="btn" type="button" id="com-fermer">Fermer</button></div>' +
      '<p class="com-intro">Ouvrez un commentaire pour le lire (il passe alors à « Lu ») et y répondre. Le texte de l’auteur reste en lecture seule ; votre réponse peut être modifiée. La première réponse envoie un courriel à l’auteur.</p>' +
      '<div class="com-filtres">' +
        '<label for="com-filtre-auteur">Auteur</label><select id="com-filtre-auteur"></select>' +
        '<label for="com-filtre-endroit">Endroit</label><select id="com-filtre-endroit">' +
          '<option value="">Tous les endroits</option><option value="EDA">Espace Auteurs</option>' +
          '<option value="EDL">Éditeur de livre</option><option value="EDV">Mise en vedette</option></select>' +
        '<label for="com-filtre-lus">Afficher</label><select id="com-filtre-lus">' +
          '<option value="tous">Tous</option><option value="nonlus">Non lus seulement</option></select>' +
        '<label class="com-case"><input type="checkbox" id="com-filtre-supprimes"> Inclure les commentaires supprimés par l’auteur</label>' +
      '</div>' +
      '<p class="com-statut" role="status" aria-live="polite"></p>' +
      '<div class="com-liste" id="com-liste"></div>';
    document.body.appendChild(o);
    com.overlay = o;
    o.querySelector('#com-fermer').addEventListener('click', comFermer);
    ['com-filtre-auteur', 'com-filtre-endroit', 'com-filtre-lus'].forEach(function (id) {
      o.querySelector('#' + id).addEventListener('change', comRendre);
    });
    o.querySelector('#com-filtre-supprimes').addEventListener('change', function (e) {
      com.avecSupprimes = e.target.checked;
      comCharger();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !o.hidden && !(confirmEl && confirmEl.classList.contains('open'))) comFermer();
    });
    return o;
  }

  function comOuvrir() {
    var o = comConstruire();
    o.hidden = false;
    document.body.style.overflow = 'hidden';
    comStatut('', com.liste ? '' : 'Chargement des commentaires…');
    comFiltreAuteur();
    comRendre();
    comCharger();
    o.querySelector('#com-fermer').focus();
  }
  function comFermer() {
    if (!com.overlay) return;
    com.overlay.hidden = true;
    document.body.style.overflow = '';
    document.getElementById('btn-commentaires').focus();
  }

  function comFiltreAuteur() {
    var select = com.overlay.querySelector('#com-filtre-auteur');
    var choix = select.value || '';
    var auteurs = {};
    (com.liste || []).forEach(function (c) {
      var cle = c.auteurId || c.auteurNom;
      if (!auteurs[cle]) auteurs[cle] = c.auteurNom || 'Auteur inconnu';
    });
    select.innerHTML = '';
    var tous = comEl('option', null, 'Tous les auteurs'); tous.value = '';
    select.appendChild(tous);
    Object.keys(auteurs).sort(function (a, b) { return auteurs[a].localeCompare(auteurs[b], 'fr'); }).forEach(function (cle) {
      var opt = comEl('option', null, auteurs[cle]); opt.value = cle;
      select.appendChild(opt);
    });
    select.value = auteurs[choix] ? choix : '';
  }

  function comFiltres() {
    var o = com.overlay;
    var auteur = o.querySelector('#com-filtre-auteur').value;
    var endroit = o.querySelector('#com-filtre-endroit').value;
    var nonLus = o.querySelector('#com-filtre-lus').value === 'nonlus';
    return (com.liste || []).filter(function (c) {
      return (!auteur || (c.auteurId || c.auteurNom) === auteur)
        && (!endroit || c.page === endroit)
        && (!nonLus || (!c.supprime && c.etat === 'Non lu'));
    });
  }

  function comBadge(c) {
    if (c.supprime) return comEl('span', 'com-badge detruite', 'Détruite');
    if (c.etat === 'Non lu') return comEl('span', 'com-badge non-lu', 'Non lu');
    if (c.reponse) return comEl('span', 'com-badge repondu', 'Répondu');
    if (c.etat === 'Archivé') return comEl('span', 'com-badge', 'Archivé');
    return comEl('span', 'com-badge lu', 'Lu');
  }

  function comRendre() {
    if (!com.overlay) return;
    var liste = com.overlay.querySelector('#com-liste');
    var defilement = liste.scrollTop;
    liste.innerHTML = '';
    if (!com.liste) return;
    var visibles = comFiltres();
    if (!visibles.length) {
      liste.appendChild(comEl('p', 'empty', com.liste.length ? 'Aucun commentaire ne correspond à ces filtres.' : 'Aucun commentaire pour le moment.'));
    }
    visibles.forEach(function (c) { liste.appendChild(comCarte(c)); });
    liste.scrollTop = defilement;
    var s = com.overlay.querySelector('.com-statut');
    if (!s.classList.contains('err')) {
      comStatut('', comPluriel(visibles.length, 'commentaire affiché', 'commentaires affichés') + ' · ' + comPluriel(comNonLus(), 'non lu', 'non lus'));
    }
  }

  function comCarte(c) {
    var ouvert = !!com.ouverts[c.id];
    var carte = comEl('article', 'com-carte' + (!c.supprime && c.etat === 'Non lu' ? ' non-lu' : '') + (c.supprime ? ' supprime' : ''));
    carte.id = 'com-' + c.id;
    var entete = comEl('button', 'com-entete'); entete.type = 'button';
    entete.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
    var infos = comEl('span', 'com-infos');
    infos.appendChild(comEl('span', 'com-date', comDate(c.date)));
    infos.appendChild(comEl('span', 'com-endroit', (c.auteurNom || 'Auteur inconnu') + ' · ' + (COM_ENDROITS[c.page] || 'Endroit inconnu') + (c.livreTitre ? ' · ' + c.livreTitre : '')));
    if (!ouvert) infos.appendChild(comEl('span', 'com-apercu', c.commentaire));
    entete.appendChild(infos);
    entete.appendChild(comBadge(c));
    entete.addEventListener('click', function () { comBasculer(c); });
    carte.appendChild(entete);
    if (!ouvert) return carte;

    var corps = comEl('div', 'com-corps');
    corps.appendChild(comEl('p', 'com-texte', c.commentaire)); // lecture seule : jamais modifiable ici
    if (c.dateModification) corps.appendChild(comEl('p', 'com-note', 'Modifié par l’auteur le ' + comDate(c.dateModification)));
    if (c.supprime) corps.appendChild(comEl('p', 'com-detruite', 'Détruite : l’auteur a supprimé ce commentaire. Il reste visible ici pour l’historique, sans réponse possible.'));

    if (c.reponse && !com.editions[c.id]) {
      var rep = comEl('div', 'com-reponse');
      rep.appendChild(comEl('p', 'com-titre-reponse', 'Réponse de l’équipe TBL' + (c.reponduPar ? ' (' + c.reponduPar + ')' : '')));
      rep.appendChild(comEl('p', 'com-texte', c.reponse));
      var quand = 'Le ' + comDate(c.dateReponse);
      if (c.dateModificationReponse) quand += ' (modifiée le ' + comDate(c.dateModificationReponse) + ')';
      rep.appendChild(comEl('p', 'com-note', quand));
      corps.appendChild(rep);
      if (!c.supprime) {
        var actions = comEl('div', 'com-actions');
        var bModif = comEl('button', 'btn btn-sm', 'Modifier la réponse'); bModif.type = 'button';
        bModif.addEventListener('click', function () {
          com.editions[c.id] = true;
          com.brouillons[c.id] = c.reponse;
          comRendre();
          var z = document.getElementById('com-reponse-' + c.id);
          if (z) z.focus();
        });
        actions.appendChild(bModif);
        corps.appendChild(actions);
      }
    } else if (!c.supprime) {
      corps.appendChild(comZoneReponse(c));
    }
    var msg = comEl('p', 'com-message'); msg.id = 'com-message-' + c.id; msg.setAttribute('role', 'status');
    if (com.messages[c.id]) { msg.className = 'com-message ' + com.messages[c.id].classe; msg.textContent = com.messages[c.id].texte; }
    corps.appendChild(msg);
    carte.appendChild(corps);
    return carte;
  }

  function comZoneReponse(c) {
    var bloc = comEl('div', 'com-zone');
    var lab = comEl('label', null, c.reponse ? 'Modifier votre réponse' : 'Votre réponse à l’auteur');
    lab.htmlFor = 'com-reponse-' + c.id;
    var zone = comEl('textarea'); zone.id = 'com-reponse-' + c.id; zone.maxLength = COM_MAX;
    zone.value = com.brouillons[c.id] || '';
    var compteur = comEl('div', 'com-compteur', zone.value.length + ' / ' + COM_MAX);
    zone.addEventListener('input', function () { com.brouillons[c.id] = zone.value; compteur.textContent = zone.value.length + ' / ' + COM_MAX; });
    var actions = comEl('div', 'com-actions');
    if (c.reponse) {
      var bAnnuler = comEl('button', 'btn btn-sm', 'Annuler'); bAnnuler.type = 'button';
      bAnnuler.addEventListener('click', function () { delete com.editions[c.id]; delete com.brouillons[c.id]; comRendre(); });
      actions.appendChild(bAnnuler);
    }
    var bEnvoyer = comEl('button', 'btn btn-primary btn-sm', c.reponse ? 'Enregistrer la réponse' : 'Répondre'); bEnvoyer.type = 'button';
    bEnvoyer.disabled = com.envoi === c.id;
    bEnvoyer.addEventListener('click', function () { comRepondre(c); });
    actions.appendChild(bEnvoyer);
    bloc.appendChild(lab); bloc.appendChild(zone); bloc.appendChild(compteur); bloc.appendChild(actions);
    return bloc;
  }

  function comMessage(id, classe, texte) {
    com.messages[id] = { classe: classe, texte: texte };
    var m = document.getElementById('com-message-' + id);
    if (m) { m.className = 'com-message ' + classe; m.textContent = texte; }
  }

  function comRemplacer(nouveau) {
    com.liste = (com.liste || []).map(function (c) { return c.id === nouveau.id ? nouveau : c; });
  }

  function comBasculer(c) {
    if (com.ouverts[c.id]) { delete com.ouverts[c.id]; comRendre(); return; }
    com.ouverts[c.id] = true;
    if (!c.supprime && c.etat === 'Non lu') {
      c.etat = 'Lu'; // tout de suite à l'écran ; le serveur confirme
      comMajPastille();
      appeler('marquerCommentaireLu', { id: c.id }).then(function (r) {
        if (r && r.statut === 'ok' && r.commentaire) { comRemplacer(r.commentaire); comMajPastille(); comRendre(); }
        else comCharger();
      }).catch(function () { comCharger(); });
    }
    comRendre();
  }

  function comRepondre(c) {
    var texte = (com.brouillons[c.id] || '').trim();
    if (!texte) {
      comMessage(c.id, 'err', 'Écrivez votre réponse avant de l’enregistrer.');
      var z = document.getElementById('com-reponse-' + c.id);
      if (z) z.focus();
      return;
    }
    com.envoi = c.id;
    comMessage(c.id, '', 'Enregistrement…');
    comRendre();
    appeler('repondreCommentaire', { id: c.id, reponse: texte }).then(function (r) {
      com.envoi = null;
      if (r && r.statut === 'ok' && r.commentaire) {
        comRemplacer(r.commentaire);
        delete com.editions[c.id];
        delete com.brouillons[c.id];
        comMessage(c.id, r.courriel && r.courriel.envoye === false ? 'err' : 'ok', r.message || 'Réponse enregistrée.');
        comMajPastille();
      } else {
        comMessage(c.id, 'err', r && r.statut === 'refuse' ? 'Cette action est réservée aux administrateurs.' : ((r && r.message) || 'La réponse n’a pas pu être enregistrée. Réessayez dans un instant.'));
      }
      comRendre();
    }).catch(function (e) {
      com.envoi = null;
      comMessage(c.id, 'err', 'La réponse n’a pas pu être enregistrée : ' + e.message);
      comRendre();
    });
  }

  document.getElementById('btn-commentaires').addEventListener('click', comOuvrir);

  /* ===================== Accueil ===================== */

  function indicateursVentesHtml(v) {
    var configuree = v && v.configuree !== false;
    var nb = !configuree || v.erreurVentes ? '—' : v.count;
    var montant = !configuree || v.erreurVentes ? '—' :
      Number(v.total).toLocaleString('fr-CA', { style: 'currency', currency: 'CAD' });
    var visiteurs = !configuree || v.erreurVisiteurs ? '—' : v.visiteurs;
    var meta = (v && v.meta) || { configuree: false };
    var depenseMeta = !meta.configuree || meta.erreur ? '—' :
      Number(meta.montant).toLocaleString('fr-CA', { style: 'currency', currency: meta.devise || 'CAD' });

    var notes = configuree ? [v.erreurVentes, v.erreurVisiteurs] :
      ['Clé API Wix non configurée : ajoutez le secret API_WIX_KEY dans Wix Secrets Manager pour activer les indicateurs de ventes et de visiteurs.'];
    notes.push(meta.configuree ? meta.erreur :
      'Jeton Meta non configuré : ajoutez le secret META_ADS_TOKEN dans Wix Secrets Manager pour afficher la dépense Meta Ads du jour.');
    var note = notes.filter(Boolean).map(function (m) {
      return '<p class="empty">' + esc(m) + '</p>';
    }).join('');

    return '<div class="ventes-indicateurs">' +
        '<div class="indicateur-carte"><span class="indicateur-valeur">' + esc(nb) + '</span>' +
          '<span class="indicateur-label">Ventes aujourd\'hui</span></div>' +
        '<div class="indicateur-carte indicateur-montant"><span class="indicateur-valeur">' + esc(montant) + '</span>' +
          '<span class="indicateur-label">Montant total des ventes du jour</span></div>' +
        '<div class="indicateur-carte"><span class="indicateur-valeur">' + esc(visiteurs) + '</span>' +
          '<span class="indicateur-label">Visiteurs du site aujourd\'hui</span></div>' +
        '<div class="indicateur-carte indicateur-depense"><span class="indicateur-valeur">' + esc(depenseMeta) + '</span>' +
          '<span class="indicateur-label">Dépensé sur Meta Ads aujourd\'hui</span></div>' +
      '</div>' +
      '<div id="ventes-indicateurs-note">' + note + '</div>';
  }

  async function initAccueil() {
    var content = document.getElementById('content');
    var r = await Promise.all([
      appeler('getVentesDuJour').catch(function (e) {
        return { configuree: true, erreurVentes: e.message, erreurVisiteurs: e.message, meta: { configuree: true, erreur: e.message } };
      }),
      appeler('getAccueil'),
      appeler('getNombreAuteurs').catch(function () { return null; }),
      appeler('getResumeRencontres'),
    ]);
    var ventes = r[0], accueil = r[1], nbAuteurs = r[2], rencontres = r[3];

    var apercu = (accueil.derniersMessages || []).slice(0, 3).map(function (m) {
      var texte = m.texte.length > 140 ? m.texte.slice(0, 140) + '…' : m.texte;
      return '<div class="forum-preview-item"><div class="forum-msg-auteur">' + esc(m.auteur) + '</div>' +
        '<div>' + esc(texte) + '</div>' +
        '<div class="forum-preview-meta">' + esc(formatDateFr(m.created_at)) + '</div></div>';
    }).join('') || '<p class="empty">Aucun message pour le moment.</p>';

    content.innerHTML =
      indicateursVentesHtml(ventes) +
      '<h1>Bienvenue sur le tableau de bord des Éditions TBL</h1>' +
      '<p class="lede">Ce tableau de bord centralise les échanges d\'équipe, le suivi des rencontres et les tâches.</p>' +
      '<div class="stat-grid">' +
        '<div class="stat-card"><span class="stat-value">' + esc(nbAuteurs === null ? '—' : nbAuteurs) + '</span><span class="stat-label">Auteurs suivis</span></div>' +
        '<div class="stat-card"><span class="stat-value">' + esc(accueil.nbMessages) + '</span><span class="stat-label">Messages au forum</span></div>' +
        '<div class="stat-card"><span class="stat-value">' + esc(rencontres.nombre) + '</span><span class="stat-label">Rencontres enregistrées</span></div>' +
        '<div class="stat-card"><span class="stat-value">' +
          esc(rencontres.prochaine ? formatDateLongue(rencontres.prochaine) : 'Aucune définie') +
          '</span><span class="stat-label">Prochaine rencontre</span></div>' +
      '</div>' +
      '<div class="accueil-columns">' +
        '<div class="panel"><h2>Derniers messages du forum</h2>' + apercu + '</div>' +
        '<div class="panel"><h2>Sections disponibles</h2><ul class="quick-links">' +
          '<li><a href="#forum">Forum — messages internes</a></li>' +
          '<li><a href="#rencontres">Rencontres — ordres du jour et suivi</a></li>' +
          '<li><a href="#taches">Tâches — PBI et suivi</a></li>' +
        '</ul></div>' +
      '</div>';
  }

  /* ===================== Forum ===================== */

  // Seul l'auteur d'un message (ou d'une réponse) peut le modifier ; le backend le vérifie aussi.
  function estAuteur(auteur) {
    return !!(etat.admin && etat.admin.nom === auteur);
  }

  function forumDateHtml(item) {
    return '<span class="forum-msg-date">' + esc(formatDateFr(item.date)) +
      (item.modifie ? ' · modifié' : '') + '</span>';
  }

  // Texte affiché, suivi de la zone d'édition cachée (ouverte par le bouton Modifier).
  function forumTexteHtml(item) {
    var html = '<div class="forum-msg-texte" id="texte-' + esc(item.id) + '">' + esc(item.texte) + '</div>';
    if (!estAuteur(item.auteur)) return html;
    return html +
      '<div class="forum-reply-box forum-edit-box" id="edit-box-' + esc(item.id) + '">' +
        '<textarea class="edit-texte" rows="3">' + esc(item.texte) + '</textarea>' +
        '<div class="forum-edit-actions">' +
          '<button class="btn btn-primary btn-sm edit-submit-btn" data-id="' + esc(item.id) + '">Enregistrer</button>' +
          '<button class="btn btn-sm edit-cancel-btn" data-id="' + esc(item.id) + '">Annuler</button>' +
        '</div>' +
      '</div>';
  }

  function boutonModifierHtml(item) {
    return estAuteur(item.auteur)
      ? '<button class="btn btn-sm edit-toggle-btn" data-id="' + esc(item.id) + '">Modifier</button>'
      : '';
  }

  function forumMessageHtml(m) {
    var reponses = (m.reponses || []).map(function (r) {
      return '<div class="forum-msg" style="background:var(--bg-elevated);">' +
        '<div class="forum-msg-header"><span class="forum-msg-auteur">' + esc(r.auteur) + '</span>' +
        forumDateHtml(r) + '</div>' +
        forumTexteHtml(r) +
        '<div class="forum-msg-actions">' + boutonModifierHtml(r) +
          '<button class="btn btn-sm delete-reponse-btn" data-reponse-id="' + esc(r.id) + '">Supprimer</button></div>' +
      '</div>';
    }).join('');

    return '<div class="forum-msg" data-id="' + esc(m.id) + '">' +
      '<div class="forum-msg-header"><span class="forum-msg-auteur">' + esc(m.auteur) + '</span>' +
      forumDateHtml(m) + '</div>' +
      forumTexteHtml(m) +
      (reponses ? '<div class="forum-reponses">' + reponses + '</div>' : '') +
      '<div class="forum-reponse-toggle">' +
        '<button class="btn btn-sm reply-toggle-btn" data-id="' + esc(m.id) + '">Répondre</button>' +

  async function refreshForumListe() {
    var brut = await appeler('getForum');
    var messages = brut.map(function (m) {
      return {
        id: m.id, auteur: m.auteur, texte: m.texte, date: m.created_at, archivee: m.archivee, modifie: !!m.modifie_le,
        reponses: (m.forum_reponses || []).map(function (r) {
          return { id: r.id, auteur: r.auteur, texte: r.texte, date: r.created_at, modifie: !!r.modifie_le };
        }),
      };
    }).sort(function (a, b) {
      // Du plus récent au plus ancien.
      return new Date(b.date) - new Date(a.date);
    });
    var actifs = messages.filter(function (m) { return !m.archivee; });
    var archives = messages.filter(function (m) { return m.archivee; });

    var liste = document.getElementById('forum-liste');
    liste.innerHTML = actifs.length
      ? actifs.map(forumMessageHtml).join('')
      : '<p class="empty">Aucun message pour le moment. Soyez le premier à écrire !</p>';
    document.getElementById('forum-archives').innerHTML = archives.length
      ? '<div class="archives"><h3>Conversations archivées</h3>' + archives.map(conversationArchiveeHtml).join('') + '</div>'

        confirmer('Supprimer cette réponse ?', 'La réponse sera retirée du fil de discussion.', 'Supprimer', function () {
          signaler(appeler('supprimerReponse', btn.dataset.reponseId), refreshForumListe);
