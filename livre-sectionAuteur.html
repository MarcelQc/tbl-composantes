<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Livre, section Auteur | Éditions TBL</title>
<style>
/* Section Auteur de la page d'un livre (/livres/{cle}) : titre en image « Auteur », photo de l'auteur, note de
   l'auteur (texte enrichi) et bouton « Contacter l'auteur ». Même allure que l'aperçu de l'éditeur de livre (EDL,
   Web\modifier-livre.html, section data-section="auteur"). Demande de Marcel du 1er novembre 2026.
   Données : envoyées par la page (public/livre-page.js du dépôt editionstbl, brancherLivre), message
   { type: 'tbl-livre', livre } ; cette boîte lit livre.auteur = { afficher, photo, bio: [blocs], contact }.
   Le courriel de l'auteur ne vient jamais ici : le bouton demande à la page d'ouvrir le courriel
   ('tbl-livre:contact'). Section masquée par l'auteur (afficher faux) : la page replie la composante.
   Ouverte seule dans un navigateur ou dans l'éditeur Wix (le code de la page ne tourne pas) : l'auteur du livre
   « lodt » (Les Ombres du temps) en démonstration, comme livre-section1.html ; ?photo=non montre la boîte sans photo. */
:root{--tbl-paper:#16181c;--tbl-line:#34373e;--tbl-muted:#b7bac2;--tbl-accent:#e52530;--tbl-font-body:Arial,Helvetica,sans-serif;--tbl-radius:14px}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{color:#fff;font-family:var(--tbl-font-body);line-height:1.5}
.page{width:min(1160px,100%);margin:0 auto;padding:0 0 4px;container-type:inline-size;container-name:page}
.titre-img{display:block;margin:4px auto -8px;width:min(340px,72%);height:auto;position:relative;z-index:1}
/* Boîte grise comme les autres sections (EDL) */
.pg{max-width:1000px;margin:0 auto 22px;background:var(--tbl-paper);border-radius:var(--tbl-radius)}
.carte-auteur{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;padding:26px 30px}
.portrait{width:210px;border:6px solid #C7C7C7;display:block;height:auto}
.col-photo{width:210px}
.col-note{display:flex;flex-direction:column;min-height:260px}
/* Sans photo (retirée par l'auteur dans l'EDL) : la note et le bouton prennent toute la largeur */
.carte-auteur.sans-photo{grid-template-columns:1fr}
.carte-auteur.sans-photo .col-note{min-height:0}
/* Texte enrichi : mêmes règles que .rt de l'EDL */
.rt{font:15px/1.6 Arial,Helvetica,sans-serif;color:#fff;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.rt p,.rt blockquote,.rt h1,.rt h2,.rt h3,.rt h4,.rt h5,.rt h6{margin:0;min-height:1.6em}
.rt h1{font-size:32px;line-height:1.25}
.rt h2{font-size:28px;line-height:1.25}
.rt h3{font-size:24px;line-height:1.3}
.rt h4{font-size:20px;font-weight:400;line-height:1.35}
.rt h5{font-size:17px;line-height:1.4}
.rt h6{font-size:15px;line-height:1.5}
.rt blockquote{border-left:4px solid #0057E1;padding:6px 0 6px 16px;margin:0 0 6px 20px}
.rt b{font-weight:700}
.ligne-contact{margin-top:auto;padding-top:16px}
/* Bouton noir (Templates\bouton-noir.html) : au survol, texte noir sur fond blanc */
.btn-noir{display:inline-block;background:transparent;color:#fff;border:2px solid #fff;border-radius:99px;padding:12px 26px;font:700 16px/1.2 var(--tbl-font-body);white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
.btn-noir:hover,.btn-noir:focus-visible{background:#fff;color:#000}
/* Chargement : boîte grise et petit message, comme la section 1 */
.pg.chargement{min-height:220px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--tbl-muted)}
.roue{width:1.1em;height:1.1em;border:2px solid var(--tbl-line);border-top-color:var(--tbl-accent);border-radius:50%;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.roue{animation:none}}
@container page (max-width:760px){
  .carte-auteur{grid-template-columns:1fr;padding:20px 16px;gap:16px;justify-items:center}
  .portrait{width:180px}
  .col-photo{width:auto;max-width:100%}
  .col-note{min-height:0;width:100%}
  .ligne-contact{text-align:center}
}
</style>
</head>
<body>
<div class="page" id="page">
  <section class="pg chargement" aria-busy="true"><span class="roue" aria-hidden="true"></span>Chargement de l’auteur…</section>
</div>
<script>
(function () {
  var page = document.getElementById('page');
  var IMAGE_TITRE = 'https://static.wixstatic.com/media/26b968_114e6bb5852148aa8f30705393fa9ca8~mv2.png';
  function bloc(type, runs, niveau) { var b = { type: type, runs: runs }; if (niveau) { b.niveau = niveau; } return b; }
  // Démonstration : l'auteur du livre « lodt », avec sa vraie note (Livres.bioAuteur) et sa photo
  var DEMO = { titre: 'Les Ombres du temps', auteur: {
    afficher: true, contact: true,
    photo: /[?&]photo=non(&|$)/.test(location.search) ? '' : 'https://static.wixstatic.com/media/26b968_53a195ac1d504d2d814a7acc27120fd0~mv2.png',
    bio: [
      bloc('titre', [{ texte: 'Note de l’auteur' }], 4),
      bloc('paragraphe', [{ texte: 'J’écris pour explorer ce qui se cache derrière les apparences : les silences, les émotions, les souvenirs et ces vérités que l’on découvre parfois trop tard. Avec ' },
        { texte: 'Les Ombres du temps', italique: true },
        { texte: ', je vous invite à entrer dans un univers où chaque histoire laisse une trace et où, derrière chaque ombre, quelque chose attend d’être révélé.' }]),
      bloc('paragraphe', []),
      bloc('paragraphe', [{ texte: 'Je vous conte pleins de mes souvenirs' }])
    ] } };
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (txt !== undefined) { e.textContent = txt; } return e; }
  function urlSure(u) { return typeof u === 'string' && /^https:\/\//i.test(u) ? u : ''; }
  function couleurSure(c) { return typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c) ? c : ''; }
  function demander(type) { if (window.parent !== window) { window.parent.postMessage({ type: type }, '*'); } }

  // Blocs du texte enrichi (modèle de l'EDL : paragraphe, titre, citation ; runs gras, italique, souligné,
  // couleur du texte) vers des éléments, sans jamais passer par du HTML.
  function blocsVersDom(blocs) {
    var frag = document.createDocumentFragment();
    (Array.isArray(blocs) ? blocs : []).forEach(function (b) {
      var niveau = Math.min(6, Math.max(1, Number(b.niveau) || 4));
      var e = document.createElement(b.type === 'titre' ? 'h' + niveau : (b.type === 'citation' ? 'blockquote' : 'p'));
      var runs = Array.isArray(b.runs) ? b.runs : [];
      if (!runs.length) { e.appendChild(document.createElement('br')); }
      runs.forEach(function (r) {
        var n = document.createTextNode(String(r.texte || ''));
        function envelopper(tag) { var x = document.createElement(tag); x.appendChild(n); n = x; }
        if (r.souligne) { envelopper('u'); }
        if (r.italique) { envelopper('i'); }
        if (r.gras) { envelopper('b'); }
        var fg = r.couleur && couleurSure(r.couleur.foreground);
        if (fg) { envelopper('span'); n.style.color = fg; }
        e.appendChild(n);
      });
      frag.appendChild(e);
    });
    return frag;
  }

  function afficher(L) {
    page.textContent = '';
    var A = L && L.auteur;
    if (!A || !A.afficher) { page.hidden = true; return; } // section masquée par l'auteur : la page replie la composante
    page.hidden = false;
    var t = el('img', 'titre-img'); t.src = IMAGE_TITRE; t.alt = 'Auteur'; page.appendChild(t);
    var photo = urlSure(A.photo);
    var carte = el('section', 'pg carte-auteur' + (photo ? '' : ' sans-photo'));
    if (photo) {
      var colPhoto = el('div', 'col-photo');
      var p = el('img', 'portrait'); p.src = photo; p.alt = 'Photo de l’auteur' + (L.titre ? ' du livre ' + L.titre : '');
      colPhoto.appendChild(p); carte.appendChild(colPhoto);
    }
    var colNote = el('div', 'col-note');
    var rt = el('div', 'rt'); rt.appendChild(blocsVersDom(A.bio)); colNote.appendChild(rt);
    if (A.contact) {
      var ligne = el('div', 'ligne-contact');
      var b = el('button', 'btn-noir', 'Contacter l’auteur'); b.type = 'button';
      b.addEventListener('click', function () { demander('tbl-livre:contact'); });
      ligne.appendChild(b); colNote.appendChild(ligne);
    }
    carte.appendChild(colNote);
    page.appendChild(carte);
  }
  function afficherDemo() { console.log('[livre-sectionAuteur] auteur de démonstration'); afficher(DEMO); }

  var recu = false;
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (d && d.type === 'tbl-livre') { recu = true; afficher(d.livre); }
  });
  if (window.parent === window) { afficherDemo(); return; }
  window.parent.postMessage({ type: 'tbl-livre:pret' }, '*');

  // Même détection que livre-section1.html : éditeur Wix (démonstration après 1,5 s) ou site (le livre vient de
  // la page ; rien reçu après 8 s, la boîte se cache plutôt que de tourner sans fin).
  function hotesParents() {
    var h = [];
    try { Array.prototype.forEach.call(location.ancestorOrigins || [], function (o) { h.push(new URL(o).hostname); }); } catch (e) { /* ignore */ }
    try { if (document.referrer) { h.push(new URL(document.referrer).hostname); } } catch (e) { /* ignore */ }
    return h;
  }
  var hotes = hotesParents();
  var dansEditeur = hotes.some(function (x) { return /(^|\.)(editor\.wix\.com|wixstudio\.com|editorx\.com)$/i.test(x); });
  var surLeSite = !dansEditeur && hotes.some(function (x) { return /(^|\.)editionstbl\.ca$/i.test(x); });
  console.log('[livre-sectionAuteur] parents :', hotes.join(', ') || '(inconnus)', dansEditeur ? '→ éditeur' : (surLeSite ? '→ site' : '→ autre'));
  if (surLeSite) {
    setTimeout(function () { if (!recu) { console.warn('[livre-sectionAuteur] aucun livre reçu de la page'); page.hidden = true; } }, 8000);
    return;
  }
  setTimeout(function () { if (!recu) { afficherDemo(); } }, 1500);
})();
</script>
</body>
</html>
