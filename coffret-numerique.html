<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Coffret numérique | Éditions TBL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Haut de la page dynamique Coffrets (/coffrets/{cle}) : titre « Coffret », section 1 (présentation des livres ou
   image publicitaire, bouton d'achat avec prix, « Découvrir les livres ») et boîte du message (« Disponible en
   numérique… », « Acheter l'ensemble numérique »). Même allure que l'aperçu de l'éditeur de coffret (EDC,
   Web\modifier-coffret.html, rendrePage) : demande de Marcel du 25 octobre 2026.
   Données : envoyées par la page (public/coffret-page.js du dépôt editionstbl, brancherCoffret), message
   { type: 'tbl-coffret', coffret }. Boutons : la composante demande à la page d'agir (messages
   'tbl-coffret:acheter' et 'tbl-coffret:decouvrir').
   Ouverte seule dans un navigateur (hors Wix) : coffret de démonstration. Dans l'éditeur Wix : coffret de
   ?apercu=<cle>, sinon le plus récent publié. */
:root{
  --tbl-paper:#16181c;--tbl-paper-2:#111317;--tbl-line:#34373e;--tbl-ink:#f5f5f5;--tbl-muted:#b7bac2;--tbl-accent:#e52530;
  --tbl-font-heading:Arial,Helvetica,sans-serif;--tbl-font-body:Arial,Helvetica,sans-serif;
  --tbl-space-md:24px;--tbl-radius:14px;--tbl-shadow:0 6px 18px rgba(0,0,0,.5);--vide:#20232a
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{color:#fff;font-family:var(--tbl-font-body);line-height:1.5}
.page{width:min(1160px,100%);margin:0 auto;padding:0 0 4px}
.pg{max-width:1000px;margin:0 auto;padding:0 14px}
/* Chaque section dans une boîte grise ; ses éléments intérieurs un ton plus foncé (comme l'EDC) */
.pg.s1,.pg.s-message{background:var(--tbl-paper);border-radius:var(--tbl-radius);padding:22px 20px;margin:0 auto 22px}
.titre-img{display:block;margin:4px auto -8px;width:min(340px,72%);height:auto;position:relative;z-index:1}
.s1{text-align:center}
.s1 .image-pub{width:100%;display:block;border-radius:6px}
.boutons-s1{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:22px 0 6px}
.btn-achat{display:inline-block;background:#8b0000;color:#fff;border:2px solid #8b0000;border-radius:99px;padding:12px 26px;font:700 16px/1.2 var(--tbl-font-body);white-space:nowrap;cursor:pointer}
.btn-achat:hover,.btn-achat:focus-visible{filter:brightness(1.15)}
.btn-decouvrir{display:inline-block;background:transparent;color:#fff;border:2px solid #fff;border-radius:99px;padding:12px 26px;font:700 16px/1.2 var(--tbl-font-body);white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
/* Bouton noir (Templates\bouton-noir.html) : au survol, texte noir sur fond blanc */
.btn-decouvrir:hover,.btn-decouvrir:focus-visible{background:#fff;color:#000}
.s-message{text-align:center}
.accroche{font:500 26px/1.3 'Oswald','Arial Narrow',Arial,sans-serif;text-align:center;margin:18px 0;letter-spacing:.02em}
/* Gabarit bundle-block.html (Templates\) : pleine largeur de la section, couvertures et textes à la mesure de la boîte */
.tbl-bundle{background:var(--tbl-paper-2);color:var(--tbl-ink);border-radius:var(--tbl-radius);box-shadow:var(--tbl-shadow);border:1px solid var(--tbl-line);
  padding:clamp(18px,4cqw,36px) var(--tbl-space-md);margin:0 auto;text-align:center;container-type:inline-size}
.tbl-bundle .covers{--cw:clamp(90px,20cqw,190px);display:flex;justify-content:center;align-items:center;margin-bottom:clamp(16px,4cqw,32px);min-height:160px}
.tbl-bundle .covers.n1{--cw:clamp(110px,24cqw,220px)}
.tbl-bundle .covers.n3{--cw:clamp(80px,17cqw,170px)}
.tbl-bundle .covers.n4{--cw:clamp(70px,14cqw,150px)}
.tbl-bundle .covers img{width:var(--cw);height:auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.4);margin:0 calc(var(--cw) * -.14)}
.tbl-bundle .covers.n1 img{margin:0}
.tbl-bundle .titles{font-size:clamp(.9rem,.5rem + 1.2cqw,1.25rem);color:var(--tbl-muted);margin-bottom:clamp(8px,1.6cqw,16px)}
.tbl-bundle .price{font-family:var(--tbl-font-heading);font-size:clamp(1.3rem,.6rem + 2.2cqw,2.2rem);margin-bottom:4px}
.tbl-bundle .price .old{text-decoration:line-through;color:var(--tbl-muted);font-size:.7em;margin-right:.5em}
/* Chargement : boîte grise et petit message (demande de Marcel du 25 octobre 2026) */
.s1.chargement{min-height:220px;display:flex;align-items:center;justify-content:center}
.chargement .msg{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--tbl-muted);font-size:1rem}
.chargement .roue{width:1.1em;height:1.1em;border:2px solid var(--tbl-line);border-top-color:var(--tbl-accent);border-radius:50%;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.chargement .roue{animation:none}}
@media (max-width:520px){.btn-achat,.btn-decouvrir{padding:11px 20px;font-size:15px}.accroche{font-size:22px}}
</style>
</head>
<body>
<div class="page" id="page">
  <!-- Chargement neutre : ni titre ni couvertures, la présentation (livres ou image publicitaire) n'est pas encore connue -->
  <section class="pg s1 chargement" aria-busy="true">
    <div class="msg" role="status"><span class="roue" aria-hidden="true"></span>Chargement du coffret…</div>
  </section>
</div>
<script>
(function () {
  var page = document.getElementById('page');
  var IMAGE_TITRE = 'https://static.wixstatic.com/media/26b968_842870b77bb644ea9b65693c3b2d0b01~mv2.png';
  var ACCROCHES = ['Disponible en numérique et en papier', 'Disponible en numérique seulement'];
  var DEMO = {
    titre: 'Coffret de démonstration', prix: 12.99, presentation1: 'gabarit',
    texteAchat: 'Les 2 tomes numériques', texteDecouvrir: 'Découvrir les livres', accroche: ACCROCHES[0], texteAcheter: 'Acheter l’ensemble numérique',
    livres: [
      { titre: 'Mon premier livre démo', couverture: 'https://via.placeholder.com/220x330/1d3b6e/ffffff?text=Livre+1', prix: 8.99 },
      { titre: 'Mon deuxième livre démo', couverture: 'https://via.placeholder.com/220x330/1b5e3a/ffffff?text=Livre+2', prix: 8.98 }
    ]
  };
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (txt !== undefined) { e.textContent = txt; } return e; }
  function argent(n) { return n.toFixed(2).replace('.', ',') + ' $'; }
  function urlSure(u) { return typeof u === 'string' && /^https:\/\//i.test(u) ? u : ''; }
  function demander(type) { if (window.parent !== window) { window.parent.postMessage({ type: type }, '*'); } }

  // Gabarit Templates\bundle-block.html : couvertures en éventail, titres, ancien prix barré et prix du coffret.
  function gabarit(c, livres) {
    var b = el('div', 'tbl-bundle'), n = livres.length;
    var covers = el('div', 'covers n' + n), centre = (n - 1) / 2;
    livres.forEach(function (l, i) {
      var img = el('img'); img.src = l.couverture; img.alt = l.titre;
      var dec = i - centre;
      img.style.transform = 'rotate(' + (dec * 7) + 'deg) translateY(' + (Math.abs(dec) * 4) + 'px)';
      img.style.zIndex = String(100 - Math.abs(dec * 10));
      covers.appendChild(img);
    });
    b.appendChild(covers);
    b.appendChild(el('div', 'titles', livres.map(function (l) { return l.titre; }).join(' + ')));
    var price = el('div', 'price');
    var somme = livres.reduce(function (s, l) { return s + (Number(l.prix) || 0); }, 0);
    // Ancien prix barré seulement s'il est plus élevé que le prix du coffret (comme dans l'EDC).
    if (c.prix > 0 && somme > c.prix) { price.appendChild(el('span', 'old', argent(somme))); }
    price.appendChild(el('span', null, c.prix > 0 ? argent(c.prix) : 'Prix à venir'));
    b.appendChild(price);
    return b;
  }

  function afficher(c) {
    page.textContent = '';
    if (!c || c.vide || !c.livres || !c.livres.length) { page.hidden = true; return; } // rien à montrer : composante vide
    page.hidden = false;
    var livres = c.livres.slice(0, 4);
    var mobile = window.matchMedia('(max-width:600px)').matches;
    var imagePub = c.presentation1 === 'image' ? urlSure(mobile ? (c.image1Mob || c.image1Ord) : c.image1Ord) : '';
    // Section 1 : image publicitaire, ou titre « Coffret » au-dessus de la boîte et présentation des livres
    if (!imagePub) { var t = el('img', 'titre-img'); t.src = IMAGE_TITRE; t.alt = 'Coffret'; page.appendChild(t); }
    var s1 = el('section', 'pg s1');
    if (imagePub) { var im = el('img', 'image-pub'); im.src = imagePub; im.alt = c.titre || 'Coffret'; s1.appendChild(im); }
    else { s1.appendChild(gabarit(c, livres)); }
    var bs = el('div', 'boutons-s1');
    var achat = el('button', 'btn-achat', (c.texteAchat || 'Les tomes numériques') + (c.prix > 0 ? ' - ' + argent(c.prix) : '')); achat.type = 'button';
    achat.addEventListener('click', function () { demander('tbl-coffret:acheter'); });
    var dec = el('button', 'btn-decouvrir', c.texteDecouvrir || 'Découvrir les livres'); dec.type = 'button';
    dec.addEventListener('click', function () { demander('tbl-coffret:decouvrir'); });
    bs.appendChild(achat); bs.appendChild(dec); s1.appendChild(bs);
    page.appendChild(s1);
    // Boîte du message : un des deux textes fixes et « Acheter l'ensemble numérique »
    var sMsg = el('section', 'pg s-message');
    sMsg.appendChild(el('p', 'accroche', ACCROCHES.indexOf(c.accroche) >= 0 ? c.accroche : ACCROCHES[0]));
    var acheter = el('button', 'btn-achat', c.texteAcheter || 'Acheter l’ensemble numérique'); acheter.type = 'button';
    acheter.addEventListener('click', function () { demander('tbl-coffret:acheter'); });
    sMsg.appendChild(acheter);
    page.appendChild(sMsg);
  }

  var recu = false;
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (d && d.type === 'tbl-coffret') { recu = true; afficher(d.coffret); }
  });
  if (window.parent === window) { afficher(DEMO); return; }
  window.parent.postMessage({ type: 'tbl-coffret:pret' }, '*');

  // Éditeur Wix (Design) : le code de la page ne tourne pas, rien n'arrive du dataset. La composante lit alors
  // elle-même un coffret publié : celui de ?apercu=<cle> dans son adresse (ex. ?apercu=epdl), sinon le plus
  // récent. Sur le site (et dans l'Aperçu), c'est toujours le coffret envoyé par la page.
  // Seuls les noms de serveurs comptent (l'adresse de l'éditeur Wix contient elle aussi « editionstbl.ca » dans
  // ses paramètres) ; l'éditeur a priorité sur le site.
  function hotesParents() {
    var h = [];
    try { Array.prototype.forEach.call(location.ancestorOrigins || [], function (o) { h.push(new URL(o).hostname); }); } catch (e) { /* ignore */ }
    try { if (document.referrer) { h.push(new URL(document.referrer).hostname); } } catch (e) { /* ignore */ }
    return h;
  }
  var hotes = hotesParents();
  var dansEditeur = hotes.some(function (x) { return /(^|\.)(editor\.wix\.com|wixstudio\.com|editorx\.com)$/i.test(x); });
  var surLeSite = !dansEditeur && hotes.some(function (x) { return /(^|\.)editionstbl\.ca$/i.test(x); });
  console.log('[coffret-numerique] parents :', hotes.join(', ') || '(inconnus)', dansEditeur ? '→ éditeur' : (surLeSite ? '→ site' : '→ autre'));
  if (surLeSite) { return; }
  setTimeout(function () {
    if (recu) { return; }
    var cle = new URLSearchParams(location.search).get('apercu') || '';
    fetch('https://www.editionstbl.ca/_functions/coffretPublic?cle=' + encodeURIComponent(cle))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) { if (!recu) { afficher(c || DEMO); } })
      .catch(function () { if (!recu) { afficher(DEMO); } });
  }, 1500);
})();
</script>
</body>
</html>
