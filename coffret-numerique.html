<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Coffret numérique | Éditions TBL</title>
<style>
/* Boîte « Coffret numérique » de la page dynamique Coffrets (/coffrets/{cle}), demande de Marcel du 25 octobre 2026.
   Gabarit Templates\bundle-block.html, le même que la section 1 de l'éditeur de coffret (EDC) : étiquette,
   couvertures en éventail, titres des livres, ancien prix barré et prix du coffret.
   Données : envoyées par la page (public/coffret-page.js du dépôt editionstbl, brancherCoffret) à partir du
   dataset de la page : message { type: 'tbl-coffret', coffret: { titre, prix, livres: [{ titre, couverture, prix }] } }.
   Ouverte seule dans un navigateur (hors Wix) : coffret de démonstration. */
:root{
  --tbl-paper:#16181c;--tbl-line:#34373e;--tbl-ink:#f5f5f5;--tbl-muted:#b7bac2;--tbl-accent:#e52530;
  --tbl-font-heading:Arial,Helvetica,sans-serif;--tbl-font-body:Arial,Helvetica,sans-serif;
  --tbl-space-md:24px;--tbl-radius:14px;--tbl-shadow:0 6px 18px rgba(0,0,0,.5);--vide:#20232a
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{padding:4px}
/* La boîte remplit toute la composante Wix (largeur et hauteur) ; couvertures et textes grandissent avec elle
   (demande de Marcel du 25 octobre 2026). La couverture prend la plus petite des deux mesures : une part de la
   largeur ou une part de la hauteur, pour toujours tenir dans la boîte. */
.tbl-bundle{background:var(--tbl-paper);color:var(--tbl-ink);border-radius:var(--tbl-radius);box-shadow:var(--tbl-shadow);border:1px solid var(--tbl-line);
  padding:clamp(14px,3vh,32px) clamp(14px,3vw,32px);font-family:var(--tbl-font-body);width:100%;height:100%;text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
.tbl-bundle .titre-coffret{display:block;width:min(max(34vw,190px),60vh);max-width:90%;height:auto;margin-bottom:clamp(10px,2.5vh,24px)}
.tbl-bundle .label{font-family:var(--tbl-font-heading);font-size:clamp(.85rem,.4rem + 1.4vw,1.5rem);text-transform:uppercase;letter-spacing:.1em;color:var(--tbl-accent);margin-bottom:clamp(12px,3vh,28px)}
.tbl-bundle .covers{--cw:min(max(20vw,90px),30vh);display:flex;justify-content:center;align-items:center;margin-bottom:clamp(16px,5vh,36px)}
.tbl-bundle .covers.n1{--cw:min(max(26vw,110px),36vh)}
.tbl-bundle .covers.n3{--cw:min(max(17vw,80px),28vh)}
.tbl-bundle .covers.n4{--cw:min(max(14vw,70px),26vh)}
.tbl-bundle .covers img,.chargement .covers span{width:var(--cw);height:auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.4);margin:0 calc(var(--cw) * -.14)}
.tbl-bundle .covers.n1 img{margin:0}
.tbl-bundle .titles{font-size:clamp(.9rem,.45rem + 1.2vw,1.35rem);color:var(--tbl-muted);margin-bottom:clamp(8px,1.8vh,16px)}
.tbl-bundle .price{font-family:var(--tbl-font-heading);font-size:clamp(1.3rem,.6rem + 2.2vw,2.4rem)}
.tbl-bundle .price .old{text-decoration:line-through;color:var(--tbl-muted);font-size:.7em;margin-right:.5em}
.chargement .covers span{display:block;aspect-ratio:2/3;background:var(--vide);animation:pulse 1.2s ease-in-out infinite}
/* Petit message pendant le chargement (demande de Marcel du 25 octobre 2026) */
.chargement .msg{display:flex;align-items:center;gap:10px;color:var(--tbl-muted);font-size:clamp(.9rem,.45rem + 1.2vw,1.2rem)}
.chargement .roue{width:1.1em;height:1.1em;border:2px solid var(--tbl-line);border-top-color:var(--tbl-accent);border-radius:50%;animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.chargement .roue{animation:none}}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.chargement .covers span{animation:none}}
</style>
</head>
<body>
<div class="tbl-bundle chargement" id="coffret" aria-busy="true">
  <img class="titre-coffret" src="https://static.wixstatic.com/media/26b968_842870b77bb644ea9b65693c3b2d0b01~mv2.png" alt="Coffret">
  <div class="covers n2"><span></span><span></span></div>
  <div class="msg" role="status"><span class="roue" aria-hidden="true"></span>Chargement du coffret…</div>
</div>
<script>
(function () {
  var boite = document.getElementById('coffret');
  var IMAGE_TITRE = 'https://static.wixstatic.com/media/26b968_842870b77bb644ea9b65693c3b2d0b01~mv2.png';
  var DEMO = {
    titre: 'Coffret de démonstration', prix: 12.99,
    livres: [
      { titre: 'Mon premier livre démo', couverture: 'https://via.placeholder.com/220x330/1d3b6e/ffffff?text=Livre+1', prix: 8.99 },
      { titre: 'Mon deuxième livre démo', couverture: 'https://via.placeholder.com/220x330/1b5e3a/ffffff?text=Livre+2', prix: 8.98 }
    ]
  };
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (txt !== undefined) { e.textContent = txt; } return e; }
  function argent(n) { return n.toFixed(2).replace('.', ',') + ' $'; }

  function afficher(c) {
    boite.textContent = '';
    boite.classList.remove('chargement'); boite.removeAttribute('aria-busy');
    if (!c || c.vide || !c.livres || !c.livres.length) { boite.hidden = true; return; } // rien à montrer : boîte vide
    var livres = c.livres.slice(0, 4), n = livres.length;
    // Titre en image « Coffret » (coffret.png de la médiathèque), comme dans l'EDC.
    var titre = el('img', 'titre-coffret'); titre.src = IMAGE_TITRE; titre.alt = 'Coffret';
    boite.appendChild(titre);
    var covers = el('div', 'covers n' + n), centre = (n - 1) / 2;
    livres.forEach(function (l, i) {
      var img = el('img'); img.src = l.couverture; img.alt = l.titre;
      var dec = i - centre;
      img.style.transform = 'rotate(' + (dec * 7) + 'deg) translateY(' + (Math.abs(dec) * 4) + 'px)';
      img.style.zIndex = String(100 - Math.abs(dec * 10));
      covers.appendChild(img);
    });
    boite.appendChild(covers);
    boite.appendChild(el('div', 'titles', livres.map(function (l) { return l.titre; }).join(' + ')));
    var price = el('div', 'price');
    var somme = livres.reduce(function (s, l) { return s + (Number(l.prix) || 0); }, 0);
    // Ancien prix barré seulement s'il est plus élevé que le prix du coffret (comme dans l'EDC).
    if (c.prix > 0 && somme > c.prix) { price.appendChild(el('span', 'old', argent(somme))); }
    price.appendChild(el('span', null, c.prix > 0 ? argent(c.prix) : 'Prix à venir'));
    boite.appendChild(price);
  }

  var recu = false;
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (d && d.type === 'tbl-coffret') { recu = true; afficher(d.coffret); }
  });
  if (window.parent === window) { afficher(DEMO); return; }
  window.parent.postMessage({ type: 'tbl-coffret:pret' }, '*');

  // Éditeur Wix (Design) : le code de la page ne tourne pas, rien n'arrive du dataset. La composante lit alors
  // elle-même un coffret publié : celui de ?apercu=<cle> dans son adresse (ex. ?apercu=epdl), sinon le plus
  // récent. Sur le site (et dans l'Aperçu), c'est toujours le coffret du dataset envoyé par la page.
  // Seuls les noms de serveurs comptent (l'adresse de l'éditeur Wix contient elle aussi « editionstbl.ca » dans
  // ses paramètres) ; l'éditeur a priorité sur le site.
  function hotesParents() {
    var h = [];
    try { Array.prototype.forEach.call(location.ancestorOrigins || [], function (o) { h.push(new URL(o).hostname); }); } catch (e) { /* ignore */ }
    try { if (document.referrer) { h.push(new URL(document.referrer).hostname); } } catch (e) { /* ignore */ }
    return h;
  }
  var hotes = hotesParents();
  var dansEditeur = hotes.some(function (x) { return /(^|\.)(editor\.wix\.com|wixstudio\.com|editorx\.com)$/i.test(x); });
  var surLeSite = !dansEditeur && hotes.some(function (x) { return /(^|\.)editionstbl\.ca$/i.test(x); });
  console.log('[coffret-numerique] parents :', hotes.join(', ') || '(inconnus)', dansEditeur ? '→ éditeur' : (surLeSite ? '→ site' : '→ autre'));
  if (surLeSite) { return; }
  setTimeout(function () {
    if (recu) { return; }
    var cle = new URLSearchParams(location.search).get('apercu') || '';
    fetch('https://www.editionstbl.ca/_functions/coffretPublic?cle=' + encodeURIComponent(cle))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (c) { if (!recu) { afficher(c || DEMO); } })
      .catch(function () { if (!recu) { afficher(DEMO); } });
  }, 1500);
})();
</script>
</body>
</html>
