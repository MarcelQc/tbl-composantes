<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Éditeur de coffret | Éditions TBL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Éditeur de coffret (EDC) : plan .claude/Plans/Plan-de-travail-coffret.md. Même en-tête, même barre d'actions et
   mêmes composantes que l'éditeur de livre (Web\modifier-livre.html), lui-même conforme aux gabarits (Templates\).
   Jetons des gabarits (Templates\tokens.css) copiés ici : la composante est un fichier autonome. */
:root{--tbl-bg:#000;--tbl-paper:#16181c;--tbl-paper-2:#111317;--tbl-line:#34373e;--tbl-ink:#f5f5f5;--tbl-muted:#b7bac2;--tbl-accent:#e52530;--tbl-accent-soft:#5b2126;--tbl-ok:#4cc38a;--tbl-orange:#e8a33d;--tbl-orange-soft:#3d2c12;--tbl-blue:#5b9bf0;--tbl-blue-soft:#14233d;--tbl-font-heading:Arial,Helvetica,sans-serif;--tbl-font-body:Arial,Helvetica,sans-serif;--tbl-space-xs:8px;--tbl-space-sm:16px;--tbl-space-md:24px;--tbl-space-lg:40px;--tbl-radius:14px;--tbl-radius-btn:9px;--tbl-shadow:0 6px 18px rgba(0,0,0,.5)}
/* --gold : ajouts dans « Voir les changements » (même jaune que l'EDL). --edit : contour des zones modifiables. */
:root{--bg:var(--tbl-bg);--card:var(--tbl-paper);--card2:var(--tbl-paper-2);--line:var(--tbl-line);--txt:var(--tbl-ink);--muted:var(--tbl-muted);--accent:var(--tbl-accent);--rouge-texte:#ffb3b8;--red:#ED1C24;--redsoft:var(--tbl-accent-soft);--gold:#FFCB05;--ok:var(--tbl-ok);--edit:var(--tbl-blue)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{scrollbar-color:var(--line) var(--bg);scrollbar-width:thin;scroll-behavior:smooth}
body{margin:0;color:var(--txt);font-family:var(--tbl-font-body);line-height:1.5}
.wrap{width:min(1160px,calc(100% - 28px));margin:auto}
.bloc{max-width:1000px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);margin:0}
.version-tbl{margin:18px auto 12px;text-align:center;font:12px/1.4 Arial,Helvetica,sans-serif;color:#8a8e97}

/* Boutons (Templates\action-buttons.html) */
.btn{border:0;border-radius:var(--tbl-radius-btn);padding:12px 18px;background:var(--accent);color:#fff;font-weight:bold;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:normal}
.btn.sec:hover:not(:disabled){border-color:var(--accent);filter:none}
.btn.petit{padding:8px 14px;font-size:.85rem}
.btn.sec[aria-pressed="true"]{background:var(--redsoft);border-color:var(--accent);color:#fff}
.btn.valider{background:var(--ok);color:#0b1a12}
.btn.refuser{background:var(--accent)}
.mini{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:var(--tbl-radius-btn);padding:4px 11px;font:600 12px var(--tbl-font-body);cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--accent)}
.mini:disabled{opacity:.4;cursor:not-allowed}

/* États plein écran */
.etat{max-width:620px;margin:70px auto;text-align:center;padding:0 16px}
.etat h1{font-size:1.6rem;margin:0 0 10px}
.etat p{color:var(--muted);margin:0 0 18px}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}html{scroll-behavior:auto}}

/* En-tête et barre d'actions : identiques à l'éditeur de livre */
#haut{padding:18px 0 4px}
.entete{margin-bottom:12px}
.barre-haut{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.barre-haut .version-tbl{margin:0 auto 0 0;align-self:center;text-align:left}
.actions-haut{display:flex;flex-wrap:wrap;gap:8px}
.barre-haut .btn,#outils .btn{padding:8px 14px;font-size:.9rem}
.sur-titre{margin:6px 0 0;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.titre-page{font-family:var(--tbl-font-heading);font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.1;margin:2px 0 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
/* Pastilles de statut (Templates\status-badge.html) */
.pastille{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 12px;font-family:var(--tbl-font-body);font-size:.8rem;font-weight:600;line-height:1.4;background:#20232a;color:var(--muted);white-space:nowrap}
.pastille::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pastille.pub{background:rgba(76,195,138,.15);color:var(--ok)}
.pastille.mod{background:var(--tbl-orange-soft);color:var(--tbl-orange)}
.pastille.appr{background:var(--tbl-blue-soft);color:var(--tbl-blue)}
.pastille.corr{background:var(--redsoft);color:var(--rouge-texte)}
.pastille.admin{background:transparent;border:1px solid var(--line);color:var(--txt)}
.pastille.admin::before{display:none}
.resume{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:14px}
.resume .aide{width:auto;margin-left:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.aide{font-size:.8rem;color:var(--muted);min-height:1.2em;text-align:right;width:100%}
.taux-global{display:flex;align-items:center;gap:10px}
.taux-global .lib{font-size:.82rem;color:var(--muted)}
.taux-global strong{font-size:1.3rem;min-width:4.4ch;line-height:1}
/* Barre d'actions collante : une boîte à la largeur standard (1000 px), alignée sur la fiche et les sections */
#outils{position:sticky;top:0;z-index:30;background:transparent;padding:8px 0}
#outils .bloc{background:var(--card);border:1px solid var(--line);border-radius:var(--tbl-radius);padding:8px 14px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.rang-outils{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rang-outils .ecart{flex:1}
.rang-outils .aide{width:auto}
.rang-outils .actions{margin-left:auto}
#outils #aide-appr:empty{display:none}
.legende{font-size:.8rem;color:var(--muted);display:flex;gap:12px;align-items:center}
.legende .aj{color:var(--gold);font-weight:bold}
@media (max-width:720px){
  .rang-outils{gap:6px 10px}
  .rang-outils .ecart{display:none}
  .rang-outils .actions{width:100%}
  .rang-outils .actions .btn{flex:1 1 auto}
  .legende{display:none}
}
#bandeau-appr,#bandeau-refus,#msg-global{border-radius:var(--tbl-radius);padding:12px 16px;margin:14px auto;max-width:1000px}
#bandeau-appr{background:var(--tbl-blue-soft);border:1px solid var(--tbl-blue);color:var(--txt)}
#bandeau-refus{background:var(--redsoft);border:1px solid var(--accent);color:var(--txt);white-space:pre-wrap}
#msg-global{background:var(--redsoft);border:1px solid var(--accent);color:var(--txt)}

/* Fiche du coffret dans la boutique (n'apparaît pas sur la page) */
.fiche{max-width:1000px;margin:14px auto 0;background:var(--card);border:1px solid var(--line);border-radius:var(--tbl-radius);padding:18px 20px}
.fiche h2{font-size:1.1rem;margin:0 0 4px}
.fiche .grille-fiche{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;margin-top:12px}
.champ-f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font:600 12px var(--tbl-font-body);color:var(--muted)}
.champ-f input,.champ-f textarea{background:var(--card2);border:1px solid var(--line);border-radius:var(--tbl-radius-btn);padding:10px 12px;font:15px var(--tbl-font-body);color:var(--txt);width:100%}
.champ-f textarea{min-height:110px;resize:vertical}
.champ-f input:focus,.champ-f textarea:focus{outline:none;border-color:var(--edit)}
.champ-f input:disabled,.champ-f textarea:disabled{opacity:.6;cursor:not-allowed}
.champ-f.err input,.champ-f.err textarea{border-color:var(--accent)}
.champ-f .msg{color:var(--rouge-texte);font-weight:600}
.ligne-prix{display:flex;gap:10px;align-items:center}
.ligne-prix input{max-width:140px}
@media (max-width:720px){.fiche .grille-fiche{grid-template-columns:1fr}}

/* Contrôles d'image (comme l'EDL) : Changer, Rétablir, Demander à TBL */
.controle-image{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px auto 0;max-width:420px;background:var(--card);border-radius:var(--tbl-radius);padding:10px 12px;text-align:center;font:12px var(--tbl-font-body);color:var(--muted)}
.controle-image .rang{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.controle-image input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.controle-image .etat-img{color:var(--gold);font-weight:bold}
.controle-image .err-img{color:var(--rouge-texte);font-weight:bold}
.demande-tbl{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.demande-tbl label.case{display:flex;gap:8px;align-items:center;color:var(--txt);font-weight:600;cursor:pointer}
.demande-tbl textarea{width:100%;min-height:60px;background:var(--card2);border:1px solid var(--line);border-radius:var(--tbl-radius-btn);color:var(--txt);padding:8px;font:13px var(--tbl-font-body);resize:vertical}
.image-vide{border:2px dashed rgba(255,255,255,.45);border-radius:10px;background:rgba(255,255,255,.04);color:#e6e6e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;font:13px/1.4 Arial,sans-serif;margin:0 auto;width:100%}
.image-vide strong{font-size:14px}
.image-vide.tbl{border-color:var(--tbl-blue);color:var(--tbl-blue)}

/* Interrupteur (comme l'EDL) */
.interrupteur{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold}
.interrupteur input{position:absolute;opacity:0;width:1px;height:1px}
.interrupteur .piste{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.interrupteur .piste::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.interrupteur input:checked+.piste{background:var(--ok)}
.interrupteur input:checked+.piste::after{left:23px}
.interrupteur input:focus-visible+.piste{outline:2px solid var(--accent);outline-offset:2px}
.interrupteur input:disabled+.piste{opacity:.5}
.controle-section{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;margin:18px auto 8px;padding:8px 14px;border-radius:var(--tbl-radius);background:var(--card);font:13px var(--tbl-font-body);color:var(--txt);max-width:760px}
.controle-section .info-l{color:var(--muted);font-size:12px}
.choix-pres{display:inline-flex;border:1px solid var(--line);border-radius:var(--tbl-radius-btn);overflow:hidden}
.choix-pres button{border:0;background:transparent;color:var(--txt);padding:7px 14px;font:600 13px var(--tbl-font-body);cursor:pointer}
.choix-pres button[aria-pressed="true"]{background:var(--redsoft);color:#fff}
.choix-pres button:disabled{opacity:.45;cursor:not-allowed}
.section-masquee{border:1px dashed var(--line);border-radius:22px;padding:18px;text-align:center;color:var(--muted);font:14px Arial,sans-serif;margin:8px auto;max-width:1000px}

/* ---------- Page du coffret (réplique de la page dynamique /coffrets/{cle}) ---------- */
#zone-page{padding:14px 0 60px}
.page-coffret{width:min(1160px,100%);margin:0 auto;container-type:inline-size;container-name:page;background:#000;color:#fff}
.pg{max-width:1000px;margin:0 auto;padding:0 14px}
/* Chaque section dans une boîte grise, comme les cartes de l'EDL ; ses éléments intérieurs un ton plus foncé */
.pg.s1,.pg.s-message,.pg.s2,.pg.s3,.pg.ved{background:var(--card);border-radius:var(--tbl-radius);padding:22px 20px;margin:0 auto 22px}
.s-message{text-align:center}
.s-message .controle-section{margin-top:0}
.s-message .accroche{margin:18px 0}
.pg .place,.pg .tbl-bundle,.pg .controle-section{background:var(--card2)}
.oswald{font-family:'Oswald','Arial Narrow',Arial,sans-serif}
.s1{padding:26px 0 10px;text-align:center}
.s1 .image-pub{width:100%;display:block;border-radius:6px}
.s1 .image-vide{aspect-ratio:2/1}
.boutons-s1{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:22px 0 6px}
/* Boutons de la page : même hauteur et mêmes marges intérieures pour tous (bordure de 2 px partout, transparente
   pour les boutons pleins), texte toujours sur une ligne. */
.btn-achat{display:inline-block;box-sizing:border-box;background:#8b0000;color:#fff;border:2px solid #8b0000;border-radius:99px;padding:12px 26px;font:700 16px/1.2 var(--tbl-font-body);white-space:nowrap;cursor:pointer}
.btn-decouvrir{display:inline-block;box-sizing:border-box;background:transparent;color:#fff;border:2px solid #fff;border-radius:99px;padding:12px 26px;font:700 16px/1.2 var(--tbl-font-body);white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
/* Bouton noir (Templates\bouton-noir.html) : au survol, texte noir sur fond blanc */
.btn-decouvrir:hover,.btn-decouvrir:focus-visible{background:#fff;color:#000}
.accroche{font:500 26px/1.3 'Oswald','Arial Narrow',Arial,sans-serif;text-align:center;margin:30px 0 18px;letter-spacing:.02em}
.centre{text-align:center}
.s2{padding:20px 0}
.s2 img{width:100%;display:block;border-radius:6px}
.s2 .image-vide{aspect-ratio:3/1}
/* Gabarit bundle-block.html (Templates\) : couvertures en éventail et prix groupé */
.tbl-bundle{background:var(--tbl-paper);color:var(--tbl-ink);border-radius:var(--tbl-radius);box-shadow:var(--tbl-shadow);border:1px solid var(--tbl-line);padding:var(--tbl-space-md);max-width:460px;margin:0 auto;text-align:center}
.tbl-bundle .label{font-family:var(--tbl-font-heading);font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tbl-accent);margin-bottom:20px}
.tbl-bundle .covers{display:flex;justify-content:center;align-items:center;margin-bottom:16px;min-height:160px}
.tbl-bundle .covers img{width:100px;height:auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.4);margin:0 -14px}
.tbl-bundle .covers.n4 img{width:86px;margin:0 -16px}
.tbl-bundle .covers.n1 img{width:130px;margin:0}
.tbl-bundle .titles{font-size:.9rem;color:var(--tbl-muted);margin-bottom:12px}
.tbl-bundle .price{font-family:var(--tbl-font-heading);font-size:1.3rem;margin-bottom:4px}
.tbl-bundle .price .old{text-decoration:line-through;color:var(--tbl-muted);font-size:.95rem;margin-right:8px}
/* Section 3 : livres du coffret (modèle de la page True Crime Québec) */
.s3{padding:30px 0 20px;scroll-margin-top:70px}
.titre-s3{font:600 24px 'Oswald','Arial Narrow',Arial,sans-serif;text-align:center;margin:0 0 18px;letter-spacing:.04em}
.livres-coffret{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:22px;align-items:stretch}
.carte-livre{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
/* Boutons poussés au bas de la carte : toujours alignés d'une carte à l'autre (demande de Marcel du 24 octobre 2026) */
.carte-livre .boutons-carte{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center}
.carte-livre .btn-amazon.reserve{visibility:hidden}
.carte-livre .couv{width:100%;max-width:230px;aspect-ratio:2/3;object-fit:cover;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.carte-livre .ct-titre{font:600 24px 'Oswald','Arial Narrow',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;display:block}
.carte-livre .ct-accroche{font:700 19px/1.25 Georgia,'Times New Roman',serif;display:block}
.carte-livre .ct-mots{font:14px Georgia,'Times New Roman',serif;color:#ddd;display:block}
/* Boutons des cartes de livres : même largeur que la couverture, même hauteur et mêmes marges l'un sous l'autre */
.btn-num{box-sizing:border-box;width:100%;max-width:230px;background:#8b0000;color:#fff;border:2px solid #8b0000;border-radius:99px;padding:10px 12px;font:700 14px/1.2 var(--tbl-font-body);white-space:nowrap;margin-top:10px;cursor:pointer}
/* « Livre papier sur Amazon.ca » : bouton noir (Templates\bouton-noir.html), un peu plus petit sous la carte */
.btn-decouvrir.btn-amazon{display:block;width:100%;max-width:230px;margin-top:8px;padding:10px 12px;font-size:14px;text-decoration:none}
.livres-coffret.n4 .btn-num,.livres-coffret.n4 .btn-decouvrir.btn-amazon{font-size:12.5px;padding:10px 14px}
@container page (max-width:760px){.livres-coffret.n4 .btn-num,.livres-coffret.n4 .btn-decouvrir.btn-amazon{font-size:14px}}
/* Places des livres en édition : allure de la Mise en vedette (EDV) */
.place{border:1px solid var(--line);background:var(--card);border-radius:var(--tbl-radius);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.place.vide .image-vide{aspect-ratio:2/3;max-width:200px}
.place select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--tbl-radius-btn);padding:8px 10px;color:var(--txt)}
.place select:disabled{opacity:.5}
.place .num-place{font:700 12px var(--tbl-font-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.verrou-livres{max-width:760px;margin:0 auto 16px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:var(--tbl-radius-btn);padding:8px 12px}
/* En vedette (comme l'EDL) */
/* Titre en image, comme dans l'EDL (.titre-img de Web\modifier-livre.html) */
.titre-img{display:block;margin:4px auto -8px;width:min(340px,72%);height:auto}
.vedettes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:6px 0 30px}
.vedettes img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:4px}
.vedettes figure{margin:0}
.vedettes figcaption{font-size:12px;text-align:center;padding-top:6px;color:#ddd}
.vedettes figcaption small{display:block;color:var(--muted);font-size:11px}
.vedettes button.place-ved{display:block;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:inherit;cursor:pointer}
.vedettes button.place-ved:hover img,.vedettes button.place-ved:focus-visible img{outline:2px solid var(--accent);outline-offset:3px}
.vedettes button.place-ved:disabled{cursor:not-allowed}
/* Vedette de la semaine dans une place libre : bien visible, à peine atténuée pour la distinguer d'un choix */
.vedettes .libre img{opacity:.8}
.vedettes .vide-ved{aspect-ratio:2/3;border:2px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.choix-ved{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:6px}
.choix-ved button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--tbl-radius-btn);background:var(--card2);color:var(--txt);font:inherit;font-size:.82rem;cursor:pointer;text-align:center}
.choix-ved button:hover:not(:disabled){border-color:var(--accent)}
.choix-ved button:disabled{opacity:.4;cursor:not-allowed}
.choix-ved button[aria-pressed="true"]{border-color:var(--accent);background:var(--redsoft)}
.choix-ved img,.choix-ved .vide-ved{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px}
@container page (max-width:760px){
  .livres-coffret{grid-template-columns:1fr}
  .accroche{font-size:21px}
  .vedettes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .carte-livre .couv{max-width:200px}
}
/* Édition en place : textes modifiables directement sur la page */
.v-edition [contenteditable="true"]{outline:1px dashed rgba(255,255,255,.3);outline-offset:4px;border-radius:4px;cursor:text;min-width:2ch}
.v-edition [contenteditable="true"]:hover{outline-color:var(--edit)}
.v-edition [contenteditable="true"]:focus{outline:2px solid var(--edit)}
.v-edition [contenteditable="true"]:empty::before{content:attr(data-vide);color:var(--muted);font-style:italic}
.diff-on .chg{outline:2px solid var(--gold)!important;outline-offset:4px}
.etiquette-ed{display:block;font:600 11px var(--tbl-font-body);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.v-apercu .etiquette-ed,.v-apercu .controle-image,.v-apercu .controle-section,.v-apercu .section-masquee,.v-apercu .verrou-livres{display:none}

// Image réduite dans le navigateur (WebP, comme l'EDL) avant l'envoi au serveur.
function reduireImage(fichier, maxL, maxH) {
  return new Promise(function (ok, ko) {
    var lecteur = new FileReader();
    lecteur.onload = function () {
      var img = new Image();
      img.onload = function () {
        var r = Math.min(1, maxL / img.width, maxH / img.height);
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL('image/webp', 0.85));
      };
      img.onerror = ko; img.src = lecteur.result;
    };
    lecteur.onerror = ko; lecteur.readAsDataURL(fichier);
  });
}

  var n = choisis.length;
  b.appendChild(el('div', 'label', 'Coffret numérique' + (n >= 3 ? ' · ' + n + ' livres' : '')));
  var covers = el('div', 'covers n' + Math.max(n, 1));
  var centre = (n - 1) / 2;
  choisis.forEach(function (l, i) {
    var img = el('img'); img.src = l.couverture; img.alt = l.titre;
    var dec = i - centre;
    img.style.transform = 'rotate(' + (dec * 7) + 'deg) translateY(' + (Math.abs(dec) * 4) + 'px)';
    img.style.zIndex = String(100 - Math.abs(dec * 10));
    covers.appendChild(img);
  });
  if (!n) { var vd = el('div', 'image-vide'); vd.style.maxWidth = '180px'; vd.style.aspectRatio = '2/3'; vd.appendChild(el('strong', null, 'Choisissez vos livres')); vd.appendChild(el('span', null, 'Section 3, plus bas')); covers.appendChild(vd); }
  b.appendChild(covers);
  b.appendChild(el('div', 'titles', choisis.map(function (l) { return l.titre; }).join(' + ')));
  var price = el('div', 'price');
  var somme = choisis.reduce(function (s, l) { return s + l.prix; }, 0);
  if (somme && prixCents(c.prix) > 0 && prixCents(c.prix) < Math.round(somme * 100)) { price.appendChild(el('span', 'old', somme.toFixed(2).replace('.', ',') + ' $')); }
  price.appendChild(el('span', null, prixTexte(c.prix) || 'Prix à venir'));
  b.appendChild(price);
  return b;
}

function carteLivre(c, i, mode) {
  var ed = mode === 'edition';
  var id = c['livre' + i];
  var l = id ? livre(id) : null;
  var choisir = ed && livresModifiables();
  var carte = el('div', choisir ? 'place carte-livre' + (l ? '' : ' vide') : 'carte-livre');
  if (choisir) {
    carte.appendChild(el('span', 'num-place', 'Livre ' + i));
    var sel = el('select'); sel.setAttribute('aria-label', 'Livre ' + i + ' du coffret');
    var opt0 = el('option', null, l ? 'Retirer ce livre' : 'Choisir un livre'); opt0.value = ''; sel.appendChild(opt0);
    var pris = livresChoisis(c);
    etat.d.livresAuteur.forEach(function (x) {
      if (x.id !== id && pris.indexOf(x.id) >= 0) { return; }
      var o = el('option', null, x.titre + ' (' + prixTexte(x.prix) + ')'); o.value = x.id; o.selected = x.id === id; sel.appendChild(o);
    });
    // Places remplies dans l'ordre (comme la Mise en vedette) : la suivante s'ouvre quand la précédente est occupée.
    sel.disabled = !l && i > 1 && !c['livre' + (i - 1)];
    sel.addEventListener('change', function () { choisirLivre(i, sel.value); });
    carte.appendChild(sel);
    if (etat.diff && change('livre' + i)) { carte.classList.add('chg'); }
  }
  if (!l) {
    if (choisir) { var vd = el('div', 'image-vide'); vd.appendChild(el('strong', null, sel.disabled ? 'Choisissez d’abord le livre ' + (i - 1) : 'Place libre')); vd.appendChild(el('span', null, 'Un coffret contient de 1 à 4 livres.')); carte.appendChild(vd); }
    return carte;
  }
  var img = el('img', 'couv'); img.src = l.couverture; img.alt = l.titre; carte.appendChild(img);
  var t = texteEditable('span', 'ct-titre', 'carte' + i + 'Titre', 'Titre court (ex. Tome 1)', mode);
  var a = texteEditable('span', 'ct-accroche', 'carte' + i + 'Accroche', 'Accroche d’une ligne', mode);
  var m = texteEditable('span', 'ct-mots', 'carte' + i + 'Mots', 'Mots clés (ex. Lieu • Personnage)', mode);
  if (!ed) { t.textContent = c['carte' + i + 'Titre']; a.textContent = c['carte' + i + 'Accroche']; m.textContent = c['carte' + i + 'Mots']; }
  carte.appendChild(t); carte.appendChild(a); carte.appendChild(m);
  // Boutons regroupés au bas de la carte : alignés d'une carte à l'autre, quelle que soit la longueur des textes.
  var bas = el('div', 'boutons-carte');
  var b = el('button', 'btn-num', 'Numérique - ' + prixTexte(l.prix)); b.type = 'button'; bas.appendChild(b);
  // « Livre papier sur Amazon.ca » : bouton noir (gabarit bouton-noir.html), seulement si le message du coffret est
  // « Disponible en numérique et en papier » (demande de Marcel du 24 octobre 2026).
  var papier = (c.accroche || ACCROCHES[0]) === ACCROCHES[0];
  if (l.amazon && papier) { var am = el('a', 'btn-decouvrir btn-amazon', 'Livre papier sur Amazon.ca'); am.href = l.amazon; am.target = '_blank'; am.rel = 'noopener'; bas.appendChild(am); }
  else if (papier && livresChoisis(c).some(function (x) { var lx = livre(x); return lx && lx.amazon; })) {
    // Pas de lien Amazon pour ce livre : place réservée invisible, pour que son bouton Numérique reste aligné.
    var vide = el('span', 'btn-decouvrir btn-amazon reserve', 'Livre papier sur Amazon.ca'); vide.setAttribute('aria-hidden', 'true'); bas.appendChild(vide);
  }
  carte.appendChild(bas);
  return carte;
}
// Choix d'un livre à la place i (création seulement). Vide = retirer : les livres suivants remontent d'une place.
function choisirLivre(i, id) {
  var c = etat.c;
  var liste = livresChoisis(c), cartes = [1, 2, 3, 4].map(function (n) { return { t: c['carte' + n + 'Titre'], a: c['carte' + n + 'Accroche'], m: c['carte' + n + 'Mots'], id: c['livre' + n] }; }).filter(function (x) { return x.id; });
  if (!id) { liste.splice(i - 1, 1); cartes.splice(i - 1, 1); }
  else {
    var l = livre(id);
    var carte = { id: id, t: l.titreCourt || '', a: l.accroche || '', m: l.motsCles || '' };
    if (i - 1 < liste.length) { liste[i - 1] = id; cartes[i - 1] = carte; } else { liste.push(id); cartes.push(carte); }
  }
  for (var n = 1; n <= 4; n += 1) {
    var x = cartes[n - 1];
    c['livre' + n] = x ? x.id : ''; c['carte' + n + 'Titre'] = x ? x.t : ''; c['carte' + n + 'Accroche'] = x ? x.a : ''; c['carte' + n + 'Mots'] = x ? x.m : '';
  }
  if (!c.texteAchat || /^(Les (\d+ )?tomes numériques|Le tome numérique)$/.test(c.texteAchat)) {
    var nb = livresChoisis(c).length;
    c.texteAchat = nb > 1 ? 'Les ' + nb + ' tomes numériques' : 'Le tome numérique';
  }
  modifie(); rendreTout();
}

// Vedette de la semaine montrée dans la place libre v (comme l'EDL) : les vedettes de la semaine, ou les livres TBL
// par défaut, qui ne sont pas déjà choisis, dans l'ordre des places libres (elles sont toujours à la fin).
function vedetteSemaineDe(c, v) {
  var choisis = [1, 2, 3, 4].map(function (n) { return c['vedette' + n]; }).filter(Boolean);
  var restants = ((etat.d && etat.d.vedettesSemaine) || []).filter(function (s) { return choisis.indexOf(s.id) < 0; });
  return restants[v - 1 - choisis.length] || null;
}
// En vedette : livres de l'auteur choisis par place ; une place libre montre la vedette de la semaine.
function placeVedette(c, v, mode) {
  var ed = mode === 'edition';
  var id = c['vedette' + v], l = id ? livre(id) : null;
  var sem = l ? null : vedetteSemaineDe(c, v);
  var fig = el('figure', l ? '' : 'libre');
  var contenu;
  if (l) { contenu = el('img'); contenu.src = l.couverture; contenu.alt = l.titre; }
  else if (sem && urlSure(sem.couverture)) { contenu = el('img', 'ved-semaine'); contenu.src = sem.couverture; contenu.alt = sem.titre; }
  else { contenu = el('div', 'vide-ved', 'Vedette de la semaine'); }
  var cap = el('figcaption', null, l ? l.titre : (sem ? sem.titre : 'Place libre'));
  if (!l) { cap.appendChild(el('small', null, 'Vedette de la semaine, choisie par TBL')); }
  if (ed && editable()) {
    var b = el('button', 'place-ved'); b.type = 'button';
    b.disabled = !l && v > 1 && !c['vedette' + (v - 1)];
    b.title = b.disabled ? 'Remplissez d’abord la place ' + (v - 1) : 'Choisir le livre de cette place';
    b.addEventListener('click', function () { choisirVedette(v); });
    b.appendChild(contenu); fig.appendChild(b);
  } else { fig.appendChild(contenu); }
  fig.appendChild(cap);
  if (ed && etat.diff && change('vedette' + v)) { fig.classList.add('chg'); }
  return fig;
}
async function choisirVedette(v) {
  var c = etat.c, actuel = c['vedette' + v];
  var corps = el('div');
  corps.appendChild(el('p', null, etat.d.dejaPublie ? 'Changer une place coûte ' + argent(PRIX.place) + '. Une place libre affiche la vedette de la semaine choisie par TBL.' : 'Compris dans le forfait. Une place libre affiche la vedette de la semaine choisie par TBL.'));
  var g = el('div', 'choix-ved');
  var choisi = { id: actuel };
  var pris = [1, 2, 3, 4].filter(function (n) { return n !== v; }).map(function (n) { return c['vedette' + n]; });
  function bouton(id, titre, couv) {
    var b = el('button'); b.type = 'button'; b.setAttribute('aria-pressed', id === actuel ? 'true' : 'false');
    if (couv) { var im = el('img'); im.src = couv; im.alt = ''; b.appendChild(im); } else { b.appendChild(el('div', 'vide-ved', 'Libre')); }
    b.appendChild(document.createTextNode(titre));
    b.disabled = !!id && pris.indexOf(id) >= 0;
    b.addEventListener('click', function () { choisi.id = id; g.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); });
    g.appendChild(b);
  }
  bouton('', 'Place libre', null);
  etat.d.livresAuteur.forEach(function (l) { bouton(l.id, l.titre, l.couverture); });
  corps.appendChild(g);
  var r = await modale({ titre: 'En vedette : place ' + v, corps: corps, boutons: [{ id: 'non', libelle: 'Annuler' }, { id: 'ok', libelle: 'Choisir', principal: true }] });
  if (r !== 'ok' || choisi.id === actuel) { return; }
  var liste = [1, 2, 3, 4].map(function (n) { return c['vedette' + n]; });
  liste[v - 1] = choisi.id;
  liste = liste.filter(Boolean); // une place libérée fait remonter les suivantes
  for (var n = 1; n <= 4; n += 1) { c['vedette' + n] = liste[n - 1] || ''; }
  modifie(); rendreTout();
}

/* ---------- Actions ---------- */
async function enregistrer() {
  if (!etat.dirty || etat.occupe) { return; }
  if (etat.c.prix !== '' && !(prixCents(etat.c.prix) > 0)) { toast('Le prix du coffret doit être un montant, par exemple 14,99.', 'mal'); return; }
  etat.occupe = true; majOutils(); $('etat-sauv').textContent = 'Enregistrement…';
  var r = await appeler('enregistrer', { coffretId: etat.d.coffretId, champs: etat.c });
  etat.occupe = false;
  if (!r || !r.ok) { majOutils(); toast((r && r.message) || 'L’enregistrement a échoué. Réessayez dans un instant.', 'mal'); return; }
  etat.d.coffretId = r.coffretId || etat.d.coffretId;
  etat.d.etat = r.etat || etat.d.etat;
  // Valeurs telles qu'enregistrées (images téléversées : leur adresse remplace l'image en mémoire, pour ne pas
  // la renvoyer au prochain enregistrement).
  if (r.champs) { etat.c = Object.assign(vierge(), r.champs); }
  etat.d.derniereModification = r.date || new Date().toISOString();
  etat.dirty = false;
  rendreTout();
  toast('Modifications enregistrées.', 'ok');
}
async function lancerApprobation() {
  if (raisonRefusApprobation()) { return; }
  var f = facture();
  var corps = el('div');
  corps.appendChild(el('p', null, f.total ? 'Après le paiement, l’équipe des Éditions TBL vérifie votre coffret puis le publie. Vous recevrez un courriel à chaque étape.' : 'Votre coffret est envoyé à l’équipe des Éditions TBL, qui le vérifie puis le publie.'));
  corps.appendChild(tableauFacture(f));
  var r = await modale({ titre: f.total ? 'Payer et envoyer en approbation' : 'Envoyer en approbation', corps: corps, boutons: [{ id: 'non', libelle: 'Annuler' }, { id: 'ok', libelle: f.total ? 'Payer ' + argent(f.total) : 'Envoyer', principal: true }] });
  if (r !== 'ok') { return; }
  etat.occupe = true; majOutils();
  var rep = await appeler(f.total ? 'payer' : 'envoyer', { coffretId: etat.d.coffretId });
  etat.occupe = false;
  if (!rep || !rep.ok) { majOutils(); toast((rep && rep.message) || 'L’envoi a échoué. Réessayez dans un instant.', 'mal'); return; }
  toast(f.total ? 'Paiement reçu : votre coffret est envoyé en approbation.' : 'Demande envoyée : votre coffret attend la validation de l’équipe.', 'ok');
  demarrer();
}
async function valider() {
  var corps = el('div');
  corps.appendChild(el('p', null, 'Le coffret sera publié sur sa page. Le produit de la boutique sera mis à jour automatiquement : nom, prix, description et image' + (etat.d.produitBoutique ? '.' : ' (il sera créé, ce coffret n’en a pas encore).')));
  if (revueAdmin()) { corps.appendChild(el('p', null, 'Un courriel d’approbation sera envoyé à l’auteur.')); }
  var r = await modale({ titre: 'Approuver et publier', corps: corps, boutons: [{ id: 'non', libelle: 'Annuler' }, { id: 'ok', libelle: 'Publier', principal: true, cls: 'valider' }] });
  if (r !== 'ok') { return; }
  etat.occupe = true; majOutils();
  var rep = await appeler('approuver', { coffretId: etat.d.coffretId });
  etat.occupe = false;
  if (!rep || !rep.ok) { majOutils(); toast((rep && rep.message) || 'La publication a échoué.', 'mal'); return; }
  toast('Coffret publié. ' + (rep.produit === 'cree' ? 'Produit créé dans la boutique.' : (rep.produit === 'maj' ? 'Produit de la boutique mis à jour.' : 'Le produit de la boutique sera relié par l’équipe TBL.')), 'ok');

async function refuser() {
  var corps = el('div');
  corps.appendChild(el('p', null, 'Expliquez à l’auteur ce qu’il doit corriger. Il recevra ce message par courriel et le coffret repassera à « À corriger ».'));

  if (r !== 'ok') { return; }

  if (!rep || !rep.ok) { toast((rep && rep.message) || 'Le refus a échoué.', 'mal'); return; }

}
function tableauFacture(f) {

  function rang(nom, cents, total) { var tr = el('tr', total ? 'total' : ''); tr.appendChild(el('td', null, nom)); tr.appendChild(el('td', null, argent(cents))); t.appendChild(tr); }
  if (!f.lignes.length) { var p = el('p', null, 'Aucune modification à payer pour le moment.'); return p; }
  f.lignes.forEach(function (l) { rang(l.nom, l.montant); });
  rang('Frais de service (5 %)', f.frais);
  if (f.gratuite) { rang('Gratuité (services offerts)', f.gratuite); }
  rang('TPS', f.tps); rang('TVQ', f.tvq);
  rang('Total à payer', f.total, true);
  return t;
}

/* ---------- Aperçus et rapport ---------- */
function ouvrirApercu(appareil) {
  etat.appareil = appareil;
  $('h-titre-ap').textContent = etat.c.titre || 'Nouveau coffret';
  $('ap-ord').setAttribute('aria-selected', appareil === 'ordinateur' ? 'true' : 'false');
  $('ap-mob').setAttribute('aria-selected', appareil === 'mobile' ? 'true' : 'false');
  var cadre = $('cadre-apercu'); cadre.className = 'cadre ' + appareil; cadre.textContent = '';
  cadre.appendChild(rendrePage(etat.c, 'apercu', appareil));
  montrer('vue-apercu'); ajusterCadre(); window.scrollTo(0, 0);
}
// L'aperçu ordinateur est dessiné à 1160 px de large, comme le site : on le réduit pour qu'il tienne en entier,
// sans barre de défilement horizontale (comme l'EDL, demande de Marcel du 24 octobre 2026).
function ajusterCadre() {
  var cadre = $('cadre-apercu');
  if (!cadre || $('vue-apercu').hidden) { return; }
  cadre.style.zoom = '';
  if (!cadre.classList.contains('ordinateur')) { return; }
  var dispo = $('panneau-apercu').clientWidth - 30; // marges intérieures du panneau et bordure du cadre
  var echelle = Math.min(1, dispo / 1160);
  if (echelle < 1) { cadre.style.zoom = String(echelle); }
}
window.addEventListener('resize', ajusterCadre);
function ouvrirRapport() {
  var v = $('vue-rapport'); v.textContent = '';
  var r = el('div', 'rap');
  var outils = el('div', 'barre-outils');
  var bRet = el('button', 'btn sec petit', '← Retour à l’éditeur'); bRet.type = 'button'; bRet.addEventListener('click', function () { montrer('vue-edition'); });
  var bImp = el('button', 'btn sec petit', 'Imprimer'); bImp.type = 'button'; bImp.addEventListener('click', function () { window.print(); });
  outils.appendChild(bRet); outils.appendChild(bImp); r.appendChild(outils);
  r.appendChild(el('h1', null, 'Rapport Avant / Après : ' + (etat.c.titre || 'Nouveau coffret')));
  r.appendChild(el('p', 'sous', etat.d.dejaPublie ? 'Comparaison de la version publiée et de vos modifications.' : 'Nouveau coffret : la colonne « Avant » est vide.'));
  var t = el('table'); var tr = el('tr'); ['Élément', 'Avant (publié)', 'Après (vos modifications)'].forEach(function (h) { tr.appendChild(el('th', null, h)); }); t.appendChild(tr);
  CHAMPS.forEach(function (f) {
    var a = valeur(etat.ref, f.k), b = valeur(etat.c, f.k);
    if (a === '' && b === '' || (f.t === 'demande' || f.t === 'autre') && !a && !b) { return; }
    var ligne = el('tr', String(a) !== String(b) ? 'chg' : '');
    ligne.appendChild(el('td', null, f.nom));
    [a, b].forEach(function (x) { ligne.appendChild(celluleRapport(f, x)); });
    t.appendChild(ligne);
  });
  r.appendChild(t);
  v.appendChild(r);
  montrer('vue-rapport'); window.scrollTo(0, 0);
}
function celluleRapport(f, x) {
  var td = el('td');
  if (f.t === 'image' && urlSure(x)) { var im = el('img'); im.src = x; im.alt = f.nom; td.appendChild(im); return td; }
  if (f.t === 'livre' || f.t === 'vedette') { var l = livre(x); td.textContent = l ? l.titre : (x ? x : '(libre)'); return td; }
  if (f.t === 'demande' || f.t === 'autre') { td.textContent = x === true ? 'Oui' : (x === false ? 'Non' : ({ image: 'Image publicitaire', gabarit: 'Présentation des livres' }[x] || String(x))); return td; }
  td.textContent = f.k === 'prix' ? prixTexte(x) : String(x);
  return td;
}

/* ---------- Démonstration dans l'éditeur Wix ---------- */
// En mode design, Wix affiche la composante sans faire tourner le code de la page : aucune donnée n'arrive.
// On montre alors un coffret fictif à 4 livres, toutes les sections visibles, pour régler la hauteur de la boîte.
function couverture(titre, c1, c2) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="330" viewBox="0 0 220 330"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs><rect width="220" height="330" fill="url(#g)"/><text x="110" y="120" fill="#fff" font-family="Arial" font-weight="bold" font-size="22" text-anchor="middle">' + titre.split('|').map(function (l, i) { return '<tspan x="110" dy="' + (i ? 28 : 0) + '">' + l + '</tspan>'; }).join('') + '</text><text x="110" y="300" fill="#ddd" font-family="Arial" font-size="13" text-anchor="middle">Éditions TBL</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function donneesDemo() {
  var livres = [1, 2, 3, 4, 5, 6].map(function (i) {
    return { id: 'demo' + i, titre: 'Livre de démonstration ' + i, prix: 5.99, couverture: couverture('LIVRE|' + i, ['#7a0d0d', '#5a4a10', '#0d3a5a', '#3a0d4a', '#0d4a2a', '#4a2a0d'][i - 1], '#111'),
      amazon: 'https://www.amazon.ca/', titreCourt: 'Livre ' + i, accroche: 'Une accroche de démonstration pour le livre ' + i + '.', motsCles: 'Mot clé • Mot clé • Mot clé' };
  });
  var c = vierge();
  Object.assign(c, { titre: 'Coffret de démonstration', prix: '19,99', description: 'Description de démonstration du coffret.',
    imageBoutique: couverture('COFFRET|DÉMO', '#7a0d0d', '#000'), texteAchat: 'Les 4 livres numériques', section2: true,
    vedette1: 'demo5', vedette2: 'demo6' });
  [1, 2, 3, 4].forEach(function (i) { var l = livres[i - 1]; c['livre' + i] = l.id; c['carte' + i + 'Titre'] = l.titreCourt; c['carte' + i + 'Accroche'] = l.accroche; c['carte' + i + 'Mots'] = l.motsCles; });
  return { statut: 'ok', demo: true, coffretId: '', etat: 'nouveau', dejaPublie: false, admin: false, gratuit: false,
    auteur: { nom: 'Auteur de démonstration' }, publie: null, copie: c, livresAuteur: livres,
    vedettesSemaine: [1, 2, 3, 4].map(function (i) { return { id: 'sem' + i, titre: 'Vedette de la semaine ' + i, couverture: couverture('VEDETTE|' + i, '#1d3557', '#111') }; }), produitBoutique: null, derniereModification: null, refus: null };
}
