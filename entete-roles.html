<title>Rôles de l'en-tête | Éditions TBL</title>
<style>
/* Boîte HTML des rôles dans l'en-tête du site (demande de Marcel du 31 octobre 2026, prototype
   Prototype\entete-roles.html). Trois icônes de 28 px, la grosseur de l'avatar du membre, avec pastilles rouges :
   Admin (commentaires non lus de l'ADM), Auteur (réponses pas encore vues dans l'EDA) et Lecteur (réponses pas
   encore vues dans l'ELC). Boîte Wix de 116 × 36 px ; masterPage.js envoie les rôles et les nombres. */
:root{--tbl-accent:#e52530;--tbl-font-body:Arial,Helvetica,sans-serif;--entete:#0d1020}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:transparent;overflow:hidden}
/* Collées à droite, avec une marge pour que la pastille de l'icône de droite ne soit pas coupée. */
.roles{display:flex;gap:8px;align-items:center;justify-content:flex-end;height:36px;padding:4px 8px 0 0}
.role{position:relative;width:28px;height:28px;border-radius:50%;border:0;background:none;cursor:pointer;padding:0;transition:transform .15s}
.role:hover{transform:scale(1.08)}
.role:focus-visible{outline:2px solid #fff;outline-offset:2px}
.role img{width:28px;height:28px;display:block}
.pastille{position:absolute;top:-5px;right:-6px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:var(--tbl-accent);color:#fff;font:bold 10px/12px var(--tbl-font-body);text-align:center;border:2px solid var(--entete)}
@media (prefers-reduced-motion:reduce){.role{transition:none}}

</style>

<script>
(function () {
'use strict';

var EN_WIX = true;
var RELANCE_MS = 1500;
var ABANDON_MS = 10000;
// Éditeur Wix (mode design) : le code de masterPage.js ne tourne pas. On montre les trois icônes avec les pastilles
// 1, 2 et 3 pour voir le design ; en Aperçu, les vrais rôles envoyés par masterPage.js remplacent la démonstration.
function originesParent() { try { return Array.prototype.slice.call(location.ancestorOrigins || []).join(' ') + ' ' + document.referrer; } catch (e) { return document.referrer || ''; } }
var DANS_EDITEUR = EN_WIX && /editor\.wix\.com|wixstudio\.com|editorx\.com/i.test(originesParent());
var SUR_LE_SITE = /editionstbl\.ca/i.test(originesParent());
var DEMO = { connecte: true, admin: true, auteur: true, nbAdmin: 1, nbAuteur: 2, nbLecteur: 3 };
// Pages ouvertes au clic (masterPage.js n'accepte que celles-ci).
var PAGES = { admin: '/dbadmin', auteur: '/dashboardauteur', lecteur: '/dashboardlecteurs' };
var NOMS = { admin: 'Dashboard Admin', auteur: 'Espace Auteurs', lecteur: 'Espace Lecteur' };
var DETAILS = { admin: ['commentaire non lu', 'commentaires non lus'], auteur: ['nouvelle réponse', 'nouvelles réponses'], lecteur: ['nouvelle réponse', 'nouvelles réponses'] };

var etat = { recu: false, demo: false, relance: null, abandon: null };
function $(id) { return document.getElementById(id); }

// Version publiée : dans la console seulement (la boîte est trop petite pour l'afficher).
var VERSION_TBL = 'a163d95 · 2026-10-31 10:52';
console.log('[entete-roles] ' + (VERSION_TBL.indexOf('__TBL_' + 'VERSION__') === 0 ? 'Version locale (non publiée)' : 'Version ' + VERSION_TBL));

function pastille(cle, n) {
  var p = $('nb-' + cle);
  n = Math.max(0, Number(n) || 0);
  p.hidden = n === 0;
  p.textContent = n > 99 ? '99+' : String(n);
  var b = $('btn-' + cle);
  var texte = NOMS[cle] + (n ? ', ' + n + ' ' + DETAILS[cle][n > 1 ? 1 : 0] : '');
  b.setAttribute('aria-label', texte);
  b.title = texte;
}
// d : { connecte, admin, auteur, nbAdmin, nbAuteur, nbLecteur }. Admin : administrateur ; Auteur : auteur actif ou
// administrateur ; Lecteur : tout membre connecté.
function appliquer(d) {
  d = d || {};
  var connecte = !!d.connecte;
  $('btn-admin').hidden = !(connecte && d.admin);
  $('btn-auteur').hidden = !(connecte && (d.auteur || d.admin));
  $('btn-lecteur').hidden = !connecte;
  pastille('admin', d.nbAdmin);
  pastille('auteur', d.nbAuteur);
  pastille('lecteur', d.nbLecteur);
}

/* ---------- Pont avec masterPage.js ---------- */
function envoyer(message) {
  if (EN_WIX) { window.parent.postMessage(message, '*'); }

}
var ORIGINES_PERMISES = [/^https:\/\/(www\.)?editionstbl\.ca$/, /^https:\/\/[a-z0-9-]+\.editor\.wix\.com$/, /^https:\/\/editor\.wix\.com$/];
function origineAutorisee(origine) {
  return ORIGINES_PERMISES.some(function (motif) { return motif.test(origine); });
}
function arreter() { clearInterval(etat.relance); clearTimeout(etat.abandon); }
window.addEventListener('message', function (e) {
  if (!EN_WIX || e.source !== window.parent || !origineAutorisee(e.origin)) { return; }
  var msg = e.data;
  if (msg && msg.type === 'roles') {
    arreter();
    etat.recu = true;
    etat.demo = false;
    appliquer(msg);
  }
});

['admin', 'auteur', 'lecteur'].forEach(function (cle) {
  $('btn-' + cle).addEventListener('click', function () {
    if (etat.demo) { return; } // démonstration dans l'éditeur : aucun changement de page
    envoyer({ type: 'naviguer', page: PAGES[cle] });
  });
});

/* ---------- Démarrage ---------- */
// La boîte demande les rôles (« pret ») toutes les 1,5 s jusqu'à la réponse de masterPage.js, au cas où elle se
// charge avant lui. Sans réponse après 10 s : rien n'est affiché sur le site (visiteur ou erreur), démonstration
// ailleurs (éditeur Wix).
function demarrer() {
  appliquer({});
  if (DANS_EDITEUR) { etat.demo = true; appliquer(DEMO); }
  arreter();
  etat.relance = setInterval(function () { envoyer({ type: 'pret' }); }, RELANCE_MS);
  etat.abandon = setTimeout(function () {
    arreter();
    if (!etat.recu && (DANS_EDITEUR || !SUR_LE_SITE)) { etat.demo = true; appliquer(DEMO); }
  }, ABANDON_MS);
  envoyer({ type: 'pret' });
}

demarrer();
})();
</script>
