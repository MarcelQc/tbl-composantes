<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Modifier la page d'un livre | Éditions TBL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#16181c;--card2:#0f1114;--line:#34373e;--txt:#f5f5f5;--muted:#b7bac2;--red:#ED1C24;--redsoft:#5b2126;--gold:#FFCB05;--ok:#4cc38a;--edit:#4d9fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{scrollbar-color:var(--line) var(--bg);scrollbar-width:thin}
body{margin:0;color:var(--txt);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.wrap{width:min(1160px,calc(100% - 28px));margin:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--edit);outline-offset:2px}

/* Boutons de l'interface (pas ceux de la page du livre) */
.btn{border:0;border-radius:9px;padding:10px 18px;background:var(--red);color:#fff;font-weight:bold;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sec{background:transparent;border:1px solid #5a5e67;color:var(--txt)}
.btn.sec:hover:not(:disabled){border-color:var(--txt)}
.btn.petit{padding:6px 12px;font-size:.85rem}
.btn.valider{background:#1f9d63}
.btn.refuser{background:#b3261e}
.motif-saisie{width:100%;min-height:120px;box-sizing:border-box;background:#0d0e10;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;resize:vertical}
.motif-saisie:focus{outline:2px solid var(--edit)}
.motif-compteur{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px}
.pastille.admin{border-color:#c792ff;color:#c792ff}

/* ---------- Etats plein ecran ---------- */
.etat{max-width:620px;margin:70px auto;text-align:center;padding:0 16px}
.etat svg{width:96px;height:96px;color:var(--red);margin-bottom:8px}
.etat h1{font-size:1.6rem;margin:0 0 10px}
.etat p{color:var(--muted);margin:0 0 18px}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:0 auto 14px;animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* ---------- En-tete collant (edition) ---------- */
#entete{position:sticky;top:0;z-index:30}
#haut{background:#0d0e10;border-bottom:1px solid var(--line);padding:10px 0 8px}
.ligne1{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.titre-app .petit{display:block;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.titre-app strong{font-size:1.2rem}
.pastille{display:inline-block;border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:bold;border:1px solid var(--line);background:var(--card);color:var(--muted);margin-left:10px;vertical-align:middle}
.pastille.mod{border-color:var(--gold);color:var(--gold)}
.pastille.appr{border-color:var(--edit);color:var(--edit)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.aide{font-size:.8rem;color:var(--muted);min-height:1.2em;text-align:right;width:100%}
.ligne2{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin-top:8px}
.taux-global{display:flex;align-items:center;gap:10px}
.taux-global .lib{font-size:.82rem;color:var(--muted)}
.taux-global strong{font-size:1.6rem;min-width:4.4ch;line-height:1}
.barre{width:150px;height:9px;border-radius:99px;background:#24272d;overflow:hidden}
.barre i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 11px;font-size:.8rem;color:var(--muted);cursor:pointer}
.pill:hover{border-color:var(--txt);color:var(--txt)}
.pill b{color:var(--txt)}
.pill.chg{border-color:var(--gold)}
/* Récapitulatif des services à prix fixe (livre au statut Nouveau) */
.recap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.recap .lig{border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:.8rem;color:var(--muted)}
.recap .lig b{color:var(--txt);font-weight:600;margin-left:4px}
.recap .lig.total{border-color:var(--gold);color:var(--txt)}
.recap .lig.total b{color:var(--gold)}
.recap .lig.controle{border-style:dashed;opacity:.8}
#outils{background:#111317;border-bottom:1px solid var(--line);padding:7px 0}
#outils .wrap{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.grp.vues{border-right:0;flex-wrap:wrap}
.grp.vues .tb{height:30px;font-size:.82rem}
.tb{min-width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:7px;cursor:pointer;padding:0 8px;font-size:.88rem}
.tb:hover:not(:disabled){border-color:var(--txt)}
.tb:disabled{opacity:.38;cursor:not-allowed}
.tb[aria-pressed="true"]{background:var(--edit);border-color:var(--edit);color:#00142e}
.tb.lien{text-decoration:none;display:inline-flex;align-items:center}
/* Barre de mise en forme propre à chaque texte enrichi, juste au-dessus de la zone de saisie */
.outils-champ{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px;padding:6px 8px;background:#111317;border:1px solid var(--line);border-radius:9px}
.outils-champ .tb{min-width:30px;height:30px;font-size:.82rem}
.outils-champ .grp{padding-right:6px}
.legende{font-size:.8rem;color:var(--muted);display:flex;gap:12px;align-items:center}
.legende .aj{color:var(--gold);font-weight:bold}
.legende .re{color:var(--red);text-decoration:line-through;font-weight:bold}
@media (max-width:720px){
  #entete{display:contents}
  #haut{position:static}
  #outils{position:sticky;top:0;z-index:30;overflow-x:auto}
  #outils .wrap{flex-wrap:nowrap;width:max-content;min-width:calc(100% - 28px)}
  .barre{width:100px}
}

#bandeau-appr{background:#0e1a2b;border:1px solid #2a4a7a;color:#cfe2ff;border-radius:12px;padding:12px 16px;margin:14px auto;max-width:1000px}
#bandeau-refus{background:#2a0f12;border:1px solid var(--red);color:#ffd6d8;border-radius:12px;padding:12px 16px;margin:14px auto;max-width:1000px;white-space:pre-wrap}
#msg-global{background:#2a0f12;border:1px solid var(--red);color:#ffd6d8;border-radius:12px;padding:10px 16px;margin:12px auto;max-width:1000px}

/* ---------- Page du livre (replique de /livres/xxx) ---------- */
#zone-page{padding:14px 0 60px}
#page{width:min(1160px,100%);margin:0 auto;container-type:inline-size;container-name:page;background:#000;color:#fff}
.pg{max-width:1000px;margin:0 auto;padding:0 14px}
.oswald{font-family:'Oswald','Arial Narrow',Arial,sans-serif}
.fond-hero{background:#000 center bottom/cover no-repeat}
.grille-hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:26px;align-items:start;padding:30px 0 34px}
.couv img{width:100%;max-width:330px;display:block;margin:0 auto}
.hero-carte{border:1px solid #fff;border-radius:30px;padding:16px 26px 20px;min-height:400px;display:flex;flex-direction:column;background:rgba(0,0,0,.88)}
.hero-titre{font:500 30px/1.2 'Oswald','Arial Narrow',Arial,sans-serif;text-align:center;margin:0 0 14px;letter-spacing:.02em}
.prix{margin-top:auto;padding-top:18px;text-align:center;font:700 24px Georgia,'Times New Roman',serif;color:#F28901}
.pill-cmd{margin-top:22px;border:1px solid #fff;border-radius:22px;background:#480000;color:#fff;text-align:center;padding:10px 14px;letter-spacing:.22em;font-size:14px;display:flex;justify-content:center;align-items:center;gap:14px}
.pill-cmd i{width:16px;height:16px;border-radius:50%;border:1px solid #d8a0a0;display:inline-block;font:700 11px/14px Georgia,serif;font-style:normal;letter-spacing:0;color:#e88}
.carte-epub{border:1px solid #fff;border-radius:30px;margin:26px auto 4px;padding:14px 20px 18px;display:flex;justify-content:center;gap:70px;text-align:center;font-size:12px;line-height:1.4;width:92%}
.col-epub{width:250px;display:flex;flex-direction:column;align-items:center}
.col-epub h3{font:700 15px Georgia,'Times New Roman',serif;margin:0 0 6px}
.col-epub img.ico{height:98px;width:auto;margin:2px 0 6px}
.col-epub .achat{width:212px;margin-top:auto;padding-top:8px}
.col-epub .bientot{margin-top:auto;padding-top:14px;font:700 14px Georgia,'Times New Roman',serif;color:#F00000}
.col-epub ul{margin:0;padding:0;list-style:none}
.carte-epub.cache{display:none}
/* Bannière « numérique seulement » : titre et icône à gauche, texte au centre, bouton d'achat à droite */
.carte-epub-seul{justify-content:space-between;align-items:center;gap:30px;padding:14px clamp(20px,5vw,60px)}
.carte-epub-seul .titre-epub{display:flex;flex-direction:column;align-items:center;width:200px}
.carte-epub-seul h3{font:700 15px Georgia,'Times New Roman',serif;margin:0 0 6px}
.carte-epub-seul img.ico{height:98px;width:auto}
.carte-epub-seul .texte-epub{max-width:260px;text-align:center}
.carte-epub-seul .texte-epub ul{margin:4px 0 0;padding-left:18px;text-align:left}
.carte-epub-seul .achat{width:212px}
.titre-img{display:block;margin:4px auto -8px;width:min(340px,72%);height:auto}
.carte{border:1px solid #C7C7C7;border-radius:30px;padding:18px 18px;margin:0 auto 4px}
.carte-auteur{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;padding:26px 30px}
.portrait{width:210px;border:6px solid #C7C7C7;display:block;height:auto}
.col-photo{width:210px}
.col-photo .controle-image{max-width:210px;padding:8px}
.col-photo .controle-image .mini.gros{padding:6px 10px;font-size:12px}
.col-note{display:flex;flex-direction:column;min-height:260px}
.bouton-contour{align-self:flex-start;border:1px solid #fff;background:transparent;color:#fff;padding:9px 12px;margin-top:auto;font-size:15px;font-family:Arial,sans-serif}
.controle-image{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px auto 0;max-width:330px;background:rgba(0,0,0,.78);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center;font:12px Arial,sans-serif;color:#cfd3da}
.controle-image .rang{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.controle-image .etat-img{color:var(--gold);font-weight:bold}
.controle-image .err-img{color:#ff8a8f;font-weight:bold}
.controle-image .info-l{color:var(--muted)}
.controle-image input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.controle-image .mini.gros{padding:7px 14px;font-size:13px}
.couv{position:relative}
/* Boîte vide quand le livre n'a pas encore d'image (livre Nouveau) : mêmes proportions que les gabarits */
.image-vide{border:2px dashed rgba(255,255,255,.45);border-radius:10px;background:rgba(0,0,0,.45);color:#e6e6e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;font:13px/1.4 Arial,sans-serif;margin:0 auto}
.image-vide strong{font-size:14px}
.couv .image-vide{width:100%;max-width:330px;aspect-ratio:2/3}
.col-photo .image-vide{width:210px;max-width:100%;aspect-ratio:400/454}
.controle-auteur{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;margin:8px auto 10px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:#0d0e10;font:13px Arial,sans-serif;color:#e6e8ec;max-width:640px}
.controle-auteur .info-l{color:var(--muted);font-size:12px}
.interrupteur{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold}
.interrupteur input{position:absolute;opacity:0;width:1px;height:1px}
.interrupteur .piste{width:44px;height:24px;border-radius:99px;background:#3a3d45;position:relative;transition:background .15s;flex:none}
.interrupteur .piste::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.interrupteur input:checked+.piste{background:var(--ok)}
.interrupteur input:checked+.piste::after{left:23px}
.interrupteur input:focus-visible+.piste{outline:2px solid var(--edit);outline-offset:2px}
.interrupteur input:disabled+.piste{opacity:.5}
.section-masquee{display:none;border:1px dashed #5a5e67;border-radius:22px;padding:18px;text-align:center;color:var(--muted);font:14px Arial,sans-serif;margin:8px auto}
.v-edition [data-section].masque .section-masquee{display:block}
.v-edition [data-section].masque .titre-img,.v-edition [data-section].masque .carte{display:none}
.v-apercu [data-section].masque{display:none}
.v-apercu .controle-auteur,.v-apercu .controle-image,.v-apercu .champ-email,.v-apercu .section-masquee{display:none}
.ligne-contact{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:auto}
.ligne-contact .bouton-contour{margin-top:0}
.champ-email{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;min-width:0;font:600 12px Arial,sans-serif;color:#cfd3da}
.champ-email input{width:100%;background:transparent;border:1px solid #fff;color:#fff;padding:9px 12px;font:15px Arial,sans-serif;border-radius:2px}
.champ-email input::placeholder{color:#8b8f98}
.champ-email input:focus{outline:2px solid var(--edit);outline-offset:2px}
.champ-email.err input{border-color:var(--red);outline:2px solid var(--red)}
.champ-email input:disabled{opacity:.55;cursor:not-allowed}
.msg-email{color:#ff8a8f;font:600 13px Arial,sans-serif;margin-top:6px}
.note-email{color:var(--muted);font:12px Arial,sans-serif;margin-top:4px}
.v-edition .diff-l .ancien{color:var(--red);text-decoration:line-through}
.v-edition .diff-l .nouveau{color:var(--gold)}
.pill-extrait{margin:24px auto 6px;border:1px solid #fff;border-radius:22px;background:#480000;color:#fff;text-align:center;padding:10px 14px;letter-spacing:.22em;font-size:14px;width:min(562px,92%);display:flex;justify-content:center;align-items:center;gap:14px}
.carte-duo img{width:100%;max-width:770px;display:block;margin:6px auto}
.duo-grille{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.duo-etiquette{font:700 12px Arial,sans-serif;color:#cfd3da;text-align:center;margin-bottom:6px;letter-spacing:.04em}
.duo-mob img{max-width:340px}
.duo-col .controle-image{max-width:none;margin-top:10px}
.v-apercu .duo-etiquette{display:none}
.v-apercu .duo-grille{display:block}
.v-apercu .duo-mob{display:none}
@container page (max-width:760px){
  .v-edition .duo-grille{grid-template-columns:1fr}
  .v-apercu .duo-ord{display:none}
  .v-apercu .duo-mob{display:block}
}
.vedettes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:6px 0 30px}
.vedettes img{width:100%;height:auto;display:block;border-radius:4px}
.vedettes figcaption{font-size:12px;text-align:center;padding-top:6px;color:#ddd}
.vedettes figure{margin:0}
@container page (max-width:760px){
  .grille-hero{grid-template-columns:1fr;gap:14px}
  .hero-carte{min-height:0;padding:14px 16px 18px;border-radius:24px}
  .hero-titre{font-size:24px}
  .couv img{max-width:240px}
  .carte-epub{flex-direction:column;align-items:center;gap:22px;width:100%}
  .carte-auteur{grid-template-columns:1fr;padding:20px 16px;gap:16px;justify-items:center}
  .portrait{width:180px}
  .col-photo{width:210px;max-width:100%}
  .col-note{min-height:0;width:100%}
  .vedettes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .carte{border-radius:22px;padding:14px 12px}
  .pill-cmd,.pill-extrait{letter-spacing:.1em;font-size:13px}
}

/* Texte riche : meme rendu que le site (Ricos) */
.rt{font:15px/1.6 Arial,Helvetica,sans-serif;color:#fff;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;min-height:1.7em}
.rt p,.rt blockquote,.rt h1,.rt h2,.rt h3,.rt h4,.rt h5,.rt h6{margin:0;min-height:1.6em}
.rt h1{font-size:32px;line-height:1.25}
.rt h2{font-size:28px;line-height:1.25}
.rt h3{font-size:24px;line-height:1.3}
.rt h4{font-size:20px;font-weight:400;line-height:1.35}
.rt h5{font-size:17px;line-height:1.4}
.rt h6{font-size:15px;line-height:1.5}
.rt blockquote{border-left:4px solid #0057E1;padding:6px 0 6px 16px;margin:0 0 6px 20px}
.rt-hero,.rt-hero p,.rt-hero h1,.rt-hero h2,.rt-hero h3,.rt-hero h4,.rt-hero h5,.rt-hero h6{font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:500;letter-spacing:.04em}
.rt-hero,.rt-hero p,.rt-hero h6{font-size:22px;line-height:1.5;letter-spacing:.05em}
/* DESC_PLAN : composante à hauteur FIXE, une barre de défilement apparaît si le texte déborde */
.champ[data-champ="desc_plan"] .rt{height:236px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#8a8d95 transparent;padding-right:6px}
.rt-hero [data-fg],.rt-hero [data-bg]{color:inherit!important;background:none!important}
.rt-hero h4{font-size:22px}.rt-hero h5{font-size:21px}
.rt-hero h1{font-size:30px}.rt-hero h2{font-size:28px}.rt-hero h3{font-size:25px}
@container page (max-width:760px){.rt-hero,.rt-hero p,.rt-hero h6{font-size:17px}.champ[data-champ="desc_plan"] .rt{height:196px}}
.ajout{color:var(--gold)}
.retrait{color:var(--red);text-decoration:line-through}
.rt b,.rt strong{font-weight:700}

/* ---------- Edition en place ---------- */
.champ-tete{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;font:600 12px Arial,sans-serif;color:#cfd3da;letter-spacing:normal}
.chip{background:#1b1e24;border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip.crayon{border-color:#5a6577}
.chip.tx{color:var(--muted)}
.chip.tx.chg{border-color:var(--gold);color:var(--gold)}
.chip.fmt{border-color:var(--edit);color:var(--edit)}
.champ-tete .ecart{flex:1}
.mini{background:#1b1e24;border:1px solid #5a5e67;color:#fff;border-radius:99px;padding:3px 11px;font:600 12px Arial,sans-serif;cursor:pointer}
.mini:hover:not(:disabled){border-color:#fff}
.mini:disabled{opacity:.4;cursor:not-allowed}
.v-edition .rt[contenteditable="true"]{outline:1px dashed rgba(255,255,255,.3);outline-offset:6px;border-radius:4px;cursor:text}
/* Zones de saisie des textes enrichis : au moins 6 lignes (15 px x 1,6 = 24 px par ligne), même vides.
   La description de l'en-tête (.rt-hero) garde sa hauteur fixe ; l'aperçu n'est pas touché. */
.v-edition .rt:not(.rt-hero){min-height:144px}
.v-edition .rt[contenteditable="true"]:hover{outline-color:#8ab4ff}
.v-edition .rt[contenteditable="true"]:focus{outline:2px solid var(--edit)}
.v-edition .champ.err .rt{outline:2px solid var(--red)!important}
.v-edition .rt.lecture{outline:1px dashed rgba(255,255,255,.18);outline-offset:6px;cursor:default}
.v-edition .rt.diff{outline:1px solid rgba(255,203,5,.5);outline-offset:6px;border-radius:4px}
.msg-url{margin-top:12px;color:#ff8a8f;font:600 13px Arial,sans-serif}
.note-champ{margin-top:10px;color:var(--muted);font:12px Arial,sans-serif}
.v-edition .fige{opacity:.38;pointer-events:none;user-select:none}
button.pill-extrait{font-family:inherit;cursor:pointer}
/* Section « En vedette » masquée dans l'édition et l'aperçu tant que les vedettes ne sont pas programmées (tâche 138) */
.section-vedettes-cachee{display:none!important}
.v-edition button.pill-extrait:hover{background:#6a0000;border-color:#ffd0d0}
.v-apercu .champ-tete,.v-apercu .msg-url,.v-apercu .note-champ{display:none}
.v-apercu .rt{outline:none}

/* ---------- Apercu (nouvel onglet) ---------- */

/* ---------- Fenetre modale ---------- */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}

/* ---------- Avis (toast) ---------- */

<script>
/*MODULE-DEBUT*/
// Textes riches des pages de livres (Ricos de Wix) : conversion vers un modèle de « blocs » simple, validation,
// détection d'adresses web et taux de modification. Fonctions PURES : aucun accès à Wix, aucune donnée sensible.
// Ce bloc sert aussi au serveur : sync_modifier_livre.ps1 le copie dans backend/livres-textes.js (dépôt editionstbl).
//
// Modèle de bloc échangé avec la page (jamais de HTML) :
//   { type: 'paragraphe' | 'titre' | 'citation', niveau?: 1..6 (titre seulement),
//     runs: [ { texte, gras?, italique?, souligne?, couleur?: { foreground?, background? } } ] }
// Un paragraphe vide (runs: []) sert d'espacement, comme dans les textes actuels du site.
//
// Ce fichier n'utilise aucune séquence d'échappement Unicode dans une expression régulière (l'éditeur Velo refuse les
// caractères de contrôle bruts) : les caractères de contrôle sont retirés par code numérique.

// Textes riches (Ricos) de la collection Livres modifiables par l'auteur.
const CHAMPS_TEXTE = ['synopsis', 'extrait', 'bioAuteur'];
// La description de l'en-tête est Livres.desc_plan : du texte BRUT (une seule ligne, sans mise en forme).
// Le style vient de la page (h6, Oswald 22 px) et la composante a une hauteur FIXE (barre de défilement si le texte déborde).
const CHAMP_TEXTE_BRUT = 'desc_plan';

const LIMITES = {
  blocs: 120,
  runsParBloc: 200,
  caracteresParRun: 6000,
  caracteresParChamp: 12000,
};

// ---------------------------------------------------------------------------
// Ricos vers blocs
// ---------------------------------------------------------------------------

function borner(n, min, max) {
  const v = Number(n);
  if (!Number.isFinite(v)) {
    return min;
  }
  return Math.min(max, Math.max(min, Math.round(v)));
}

function runsDe(noeud) {
  const runs = [];
  for (const t of noeud.nodes || []) {
    if (!t || t.type !== 'TEXT' || !t.textData) {
      return null; // noeud inconnu (image, lien, liste...) : le champ ne sera pas modifiable
    }
    const run = { texte: String(t.textData.text === undefined || t.textData.text === null ? '' : t.textData.text) };
    for (const d of t.textData.decorations || []) {
      if (d.type === 'BOLD') {
        run.gras = true;
      } else if (d.type === 'ITALIC') {
        run.italique = true;
      } else if (d.type === 'UNDERLINE') {
        run.souligne = true;
      } else if (d.type === 'COLOR') {
        const c = d.colorData || {};
        const couleur = {};
        if (typeof c.foreground === 'string') {
          couleur.foreground = c.foreground;
        }
        if (typeof c.background === 'string') {
          couleur.background = c.background;
        }
        run.couleur = couleur;
      } else {
        return null; // décoration inconnue (lien, taille de police...) : on ne risque pas de la perdre
      }
    }
    runs.push(run);
  }
  return runs;
}

// Renvoie la liste de blocs, ou null si le texte contient quelque chose que l'éditeur ne sait pas conserver.
function ricosVersBlocs(ricos) {
  if (!ricos || typeof ricos !== 'object' || !Array.isArray(ricos.nodes)) {
    return null;
  }
  const blocs = [];
  for (const n of ricos.nodes) {
    let bloc = null;
    if (n.type === 'PARAGRAPH') {
      const runs = runsDe(n);
      bloc = runs ? { type: 'paragraphe', runs } : null;
    } else if (n.type === 'HEADING') {
      const runs = runsDe(n);
      bloc = runs ? { type: 'titre', niveau: borner(n.headingData && n.headingData.level, 1, 6), runs } : null;
    } else if (n.type === 'BLOCKQUOTE') {
      const enfants = n.nodes || [];
      if (enfants.length === 1 && enfants[0].type === 'PARAGRAPH') {
        const runs = runsDe(enfants[0]);
        bloc = runs ? { type: 'citation', runs } : null;
      }
    }
    if (!bloc) {
      return null;
    }
    blocs.push(bloc);
  }
  return blocs;
}

// ---------------------------------------------------------------------------
// Blocs vers Ricos
// ---------------------------------------------------------------------------

const ALPHABET = 'abcdefghijklmnopqrstuvwxyz0123456789';
function idAleatoire() {
  let s = '';
  for (let i = 0; i < 9; i++) {
    s += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  }
  return s;
}

function noeudsTexte(runs) {
  return runs.map((run) => {
    const decorations = [];
    if (run.couleur) {
      const colorData = {};
      if (run.couleur.background) {
        colorData.background = run.couleur.background;
      }
      if (run.couleur.foreground) {
        colorData.foreground = run.couleur.foreground;
      }
      decorations.push({ colorData, type: 'COLOR' });
    }
    if (run.gras) {
      decorations.push({ fontWeightValue: 700, type: 'BOLD' });
    }
    if (run.italique) {
      decorations.push({ italicData: true, type: 'ITALIC' });
    }
    if (run.souligne) {
      decorations.push({ underlineData: true, type: 'UNDERLINE' });
    }
    return { id: '', nodes: [], textData: { decorations, text: run.texte }, type: 'TEXT' };
  });
}

// `ricosOriginal` sert seulement à conserver documentStyle. Les blocs doivent avoir été validés (validerBlocs).
function blocsVersRicos(blocs, ricosOriginal) {
  const nodes = blocs.map((bloc) => {
    const enfants = noeudsTexte(bloc.runs);
    if (bloc.type === 'titre') {
      return { headingData: { level: bloc.niveau, textStyle: { textAlignment: 'AUTO' } }, id: idAleatoire(), nodes: enfants, type: 'HEADING' };
    }
    if (bloc.type === 'citation') {
      return {
        blockquoteData: { indentation: 0 },
        id: idAleatoire(),
        nodes: [{ id: idAleatoire(), nodes: enfants, paragraphData: { indentation: 0 }, type: 'PARAGRAPH' }],
        type: 'BLOCKQUOTE',

    }

  });

}

// Validation des blocs reçus de la page (le serveur ne fait confiance à rien)
// ---------------------------------------------------------------------------

const MOTIF_COULEUR = /^(#[0-9a-fA-F]{6}|\$theme-color-\d{1,2})$/;

function sansCaracteresDeControle(texte) {
  let resultat = '';
  for (const caractere of texte) {
    const code = caractere.charCodeAt(0);
    resultat += code < 32 || code === 127 ? ' ' : caractere;
  }
  return resultat;
}

function memeStyle(a, b) {
  return !!a.gras === !!b.gras && !!a.italique === !!b.italique && !!a.souligne === !!b.souligne
    && JSON.stringify(a.couleur || null) === JSON.stringify(b.couleur || null);
}

// Retourne { ok: true, blocs } (blocs normalisés) ou { ok: false, message }.
function validerBlocs(entree) {
  if (!Array.isArray(entree)) {
    return { ok: false, message: 'Le texte reçu est invalide.' };
  }
  if (entree.length > LIMITES.blocs) {
    return { ok: false, message: `Le texte compte trop de paragraphes (${LIMITES.blocs} au plus).` };
  }
  const blocs = [];
  let total = 0;
  for (const b of entree) {
    if (!b || typeof b !== 'object' || !['paragraphe', 'titre', 'citation'].includes(b.type) || !Array.isArray(b.runs)) {
      return { ok: false, message: 'Le texte reçu est invalide.' };
    }
    if (b.runs.length > LIMITES.runsParBloc) {
      return { ok: false, message: 'Un paragraphe contient trop de mises en forme différentes.' };
    }
    const bloc = { type: b.type, runs: [] };
    if (b.type === 'titre') {
      if (!Number.isInteger(b.niveau) || b.niveau < 1 || b.niveau > 6) {
        return { ok: false, message: 'Un niveau de titre est invalide.' };
      }
      bloc.niveau = b.niveau;
    }
    for (const r of b.runs) {
      if (!r || typeof r !== 'object' || typeof r.texte !== 'string') {
        return { ok: false, message: 'Le texte reçu est invalide.' };
      }
      if (r.texte.length > LIMITES.caracteresParRun) {
        return { ok: false, message: 'Un paragraphe est trop long.' };
      }
      const texte = sansCaracteresDeControle(r.texte);
      if (texte === '') {
        continue;
      }
      const run = { texte };
      if (r.gras === true) {
        run.gras = true;
      }
      if (r.italique === true) {
        run.italique = true;
      }
      if (r.souligne === true) {
        run.souligne = true;
      }
      if (r.couleur !== undefined && r.couleur !== null) {
        const c = r.couleur;
        if (typeof c !== 'object') {
          return { ok: false, message: 'Une couleur est invalide.' };
        }
        const couleur = {};
        for (const cle of ['foreground', 'background']) {
          if (c[cle] !== undefined) {
            if (typeof c[cle] !== 'string' || !MOTIF_COULEUR.test(c[cle])) {
              return { ok: false, message: 'Une couleur est invalide.' };
            }
            couleur[cle] = c[cle];
          }
        }
        if (Object.keys(couleur).length) {
          run.couleur = couleur;
        }
      }
      total += texte.length;
      const precedent = bloc.runs[bloc.runs.length - 1];
      if (precedent && memeStyle(precedent, run)) {
        precedent.texte += run.texte;
      } else {
        bloc.runs.push(run);
      }
    }
    blocs.push(bloc);
  }
  if (total > LIMITES.caracteresParChamp) {
    return { ok: false, message: `Le texte est trop long (${LIMITES.caracteresParChamp} caractères au plus).` };
  }
  return { ok: true, blocs };
}

// Texte d'un champ : un paragraphe par ligne (les paragraphes vides sont ignorés).
function texteBrut(blocs) {
  return blocs
    .map((bloc) => bloc.runs.map((r) => r.texte).join(''))
    .filter((ligne) => ligne.trim() !== '')
    .join('\n');
}

const EXTENSIONS = 'com|ca|fr|org|net|io|info|biz|co|be|ch|app|dev|me|tv|ly|link|xyz|shop|store|site|online|quebec|qc|edu|gov|us|uk|de|eu|ai|cc|to|gg|page|blog|live|news|pro|club|tech|cloud|world|email|mobi|name';
const MOTIFS_URL = [
  /[a-zA-Z][a-zA-Z0-9+.-]*:\/\/[^\s]+/g, // schéma://
  /\bwww\.[^\s]+/gi, // www.
  /\bmailto:[^\s]+/gi, // mailto:
  /[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g, // adresse courriel
  new RegExp('(?:^|[^\\w@.-])((?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\\.)+(?:' + EXTENSIONS + ')(?![a-z0-9])(?:/[^\\s]*)?)', 'gi'), // domaine nu
];
const PONCTUATION_FINALE = /[.,;:!?)\]}»”'"]+$/;

// Liste des adresses web trouvées dans le texte (sans doublon, ponctuation finale retirée).
function trouverUrls(texte) {
  const trouvees = new Set();
  for (let i = 0; i < MOTIFS_URL.length; i++) {
    const motif = new RegExp(MOTIFS_URL[i].source, MOTIFS_URL[i].flags);
    let m;
    while ((m = motif.exec(texte)) !== null) {
      const brut = i === MOTIFS_URL.length - 1 ? m[1] : m[0];
      const propre = brut.replace(PONCTUATION_FINALE, '');
      if (propre) {
        trouvees.add(propre);
      }
      if (m[0] === '') {
        motif.lastIndex++;
      }
    }
  }
  return Array.from(trouvees);
}

// Adresses NOUVELLES : celles déjà présentes dans le texte publié sont tolérées.
function urlsInterdites(blocsNouveaux, blocsPublies) {
  const tolerees = new Set(trouverUrls(texteBrut(blocsPublies || [])).map((u) => u.toLowerCase()));
  return trouverUrls(texteBrut(blocsNouveaux)).filter((u) => !tolerees.has(u.toLowerCase()));
}

// Texte brut (desc_plan) vers blocs, pour réutiliser la validation et le taux de modification.
// Une ligne = un bloc (les lignes vides sont gardées), sauf au début et à la fin du texte.
function blocsDepuisTexteBrut(texte) {
  const lignes = String(texte === undefined || texte === null ? '' : texte)
    .split('\r')
    .join('')
    .split('\n')
    .map((l) => sansCaracteresDeControle(l).split(' ').filter(Boolean).join(' '));
  while (lignes.length && lignes[0] === '') {
    lignes.shift();
  }
  while (lignes.length && lignes[lignes.length - 1] === '') {
    lignes.pop();
  }
  return lignes.map((l) => ({ type: 'paragraphe', runs: l === '' ? [] : [{ texte: l }] }));
}

// Blocs vers texte brut : une ligne par bloc, espaces multiples réduits
function texteBrutDepuisBlocs(blocs) {
  return blocsDepuisTexteBrut(blocs.map((b) => b.runs.map((r) => r.texte).join('')).join('\n'))
    .map((b) => b.runs.map((r) => r.texte).join(''))
    .join('\n');
}

function mots(blocs) {
  return texteBrut(blocs).split(/\s+/).filter(Boolean);
}

// Plus longue sous-suite commune entre deux listes de mots.
function communs(a, b) {
  if (a.length === 0 || b.length === 0) {
    return 0;
  }
  let precedente = new Uint32Array(b.length + 1);
  let courante = new Uint32Array(b.length + 1);
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      courante[j] = a[i - 1] === b[j - 1] ? precedente[j - 1] + 1 : Math.max(precedente[j], courante[j - 1]);
    }
    const t = precedente;
    precedente = courante;
    courante = t;
  }
  return precedente[b.length];
}

// Taux de modification d'UN champ : (1 - 2 x mots communs / (mots avant + mots après)) x 100, entre 0 et 100.
function tauxModification(blocsAvant, blocsApres) {
  const a = mots(blocsAvant);
  const b = mots(blocsApres);
  const c = communs(a, b);
  const somme = a.length + b.length;
  return { taux: somme === 0 ? 0 : (1 - (2 * c) / somme) * 100, communs: c, avant: a.length, apres: b.length };
}

// Taux global sur plusieurs champs : mêmes formules, sur la somme des mots.
function tauxGlobal(paires) {
  let c = 0;
  let somme = 0;
  for (const p of paires) {
    const t = tauxModification(p.avant, p.apres);
    c += t.communs;
    somme += t.avant + t.apres;
  }
  return somme === 0 ? 0 : (1 - (2 * c) / somme) * 100;
}

// Facture : frais de service et taxes (service-correction-pages-livre.md, section 4)
// ---------------------------------------------------------------------------

const TAUX_FRAIS_SERVICE = 0.05;
const TAUX_TPS = 0.05;
const TAUX_TVQ = 0.09975;

// lignes : [{ nom, montant }] en CENTS (entiers). Frais de service sur le sous-total, puis TPS et TVQ sur
// le sous-total plus les frais, chacune arrondie au cent. Ex. 100 $ + 100 $ : 210,00 + 10,50 + 20,95 = 241,45 $.
//
// options.gratuit (auteur gratuit ou admin, nouveau-livre-et-auteur.md) : une ligne « Gratuité » NÉGATIVE,
// placée après les services et les frais et AVANT les taxes, ramène la base taxable à 0 : TPS, TVQ et total
// valent 0,00 $. Les frais restent calculés sur les vrais services. Les taxes théoriques (comme sans
// gratuité) sont gardées pour le bloc « Contrôle ».
// Ex. 5 $ + 10 $ + 10 $, frais 1,25 $, gratuité −26,25 $, total 0,00 $ ; TPS théorique 1,31 $, TVQ 2,62 $.
function calculerFacture(lignes, options) {
  const sousTotal = lignes.reduce((s, l) => s + l.montant, 0);
  const frais = Math.round(sousTotal * TAUX_FRAIS_SERVICE);
  const baseReelle = sousTotal + frais;
  const tpsTheorique = Math.round(baseReelle * TAUX_TPS);
  const tvqTheorique = Math.round(baseReelle * TAUX_TVQ);
  const gratuit = !!(options && options.gratuit);
  const montantGratuite = gratuit ? -baseReelle : 0;
  const base = baseReelle + montantGratuite;
  const tps = gratuit ? 0 : tpsTheorique;
  const tvq = gratuit ? 0 : tvqTheorique;
  return { lignes, sousTotal, frais, montantGratuite, tps, tvq, total: base + tps + tvq, tpsTheorique, tvqTheorique, gratuit };
}

var TAGS_BLOC = { P: 1, DIV: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1, H6: 1, BLOCKQUOTE: 1 };

function versHex(rgb) {
  var m = /^rgba?\((\d+),\s*(\d+),\s*(\d+)/i.exec(rgb || '');
  if (!m) { return /^#[0-9a-f]{6}$/i.test(rgb || '') ? rgb.toUpperCase() : null; }
  return '#' + [m[1], m[2], m[3]].map(function (n) { return ('0' + Number(n).toString(16)).slice(-2); }).join('').toUpperCase();
}

function parcourir(n, st, out) {
  if (n.nodeType === 3) {
    var t = n.nodeValue.split(NBSP).join(' ').split(ZWSP).join('');
    if (t) {
      var r = { texte: t };
      if (st.gras) { r.gras = true; }
      if (st.italique) { r.italique = true; }
      if (st.souligne) { r.souligne = true; }
      if (st.couleur) { r.couleur = st.couleur; }
      out.push(r);
    }
    return;
  }
  if (n.nodeType !== 1 || n.tagName === 'BR') { return; }
  var s = { gras: st.gras, italique: st.italique, souligne: st.souligne, couleur: st.couleur };
  var tag = n.tagName;
  if (tag === 'B' || tag === 'STRONG') { s.gras = true; }
  if (tag === 'I' || tag === 'EM') { s.italique = true; }
  if (tag === 'U') { s.souligne = true; }
  var sty = n.style || {};
  if (sty.fontWeight === 'bold' || Number(sty.fontWeight) >= 600) { s.gras = true; }
  if (sty.fontStyle === 'italic') { s.italique = true; }
  if ((sty.textDecorationLine || sty.textDecoration || '').indexOf('underline') >= 0) { s.souligne = true; }
  if (n.dataset && (n.dataset.fg || n.dataset.bg)) {
    s.couleur = {};
    if (n.dataset.fg) { s.couleur.foreground = n.dataset.fg; }
    if (n.dataset.bg) { s.couleur.background = n.dataset.bg; }
  } else if (sty.color) {
    var hx = versHex(sty.color);
    if (hx) { s.couleur = { foreground: hx }; }
  }
  Array.prototype.forEach.call(n.childNodes, function (c) { parcourir(c, s, out); });

function typeDe(tag, ctx) {
  if (tag === 'BLOCKQUOTE') { return { type: 'citation' }; }
  if (/^H[1-6]$/.test(tag)) { return { type: 'titre', niveau: Number(tag.charAt(1)) }; }
  return { type: ctx.type, niveau: ctx.niveau };
}

function lireConteneur(parent, ctx, blocs) {
  var courant = null;
  function vider() { if (courant) { blocs.push(courant); courant = null; } }
  Array.prototype.forEach.call(parent.childNodes, function (n) {
    if (n.nodeType === 1 && TAGS_BLOC[n.tagName]) {
      vider();
      var t = typeDe(n.tagName, ctx);
      var aEnfantsBloc = Array.prototype.some.call(n.children, function (c) { return TAGS_BLOC[c.tagName]; });
      if (aEnfantsBloc) {
        lireConteneur(n, t.type === 'paragraphe' ? ctx : t, blocs);
      } else {
        var runs = [];
        parcourir(n, {}, runs);
        var b = { type: t.type, runs: runs };
        if (t.type === 'titre') { b.niveau = t.niveau; }
        blocs.push(b);
      }
    } else {
      if (!courant) {
        courant = { type: ctx.type, runs: [] };
        if (ctx.type === 'titre') { courant.niveau = ctx.niveau; }
      }
      parcourir(n, {}, courant.runs);

}

function creerRuns(runs, opt, etat) {
  var frag = document.createDocumentFragment();

      var idx;

        if (opt.retraits && opt.retraits[idx]) {

          d.className = 'retrait';
          d.textContent = opt.retraits[idx].join(' ');
          cont.appendChild(d);
          cont.appendChild(document.createTextNode(' '));
          opt.retraits[idx] = null;
        }
      }

        s.textContent = p;
        cont.appendChild(s);
      } else {

    });
    var noeud = cont;

      if (attrs) { Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); }

    if (r.souligne) { envelopper('u'); }

      if (r.couleur.background) { at['data-bg'] = r.couleur.background; }

}

// opt : { flags, classeNon, retraits, couleurs }. Renvoie un DocumentFragment.
function blocsVersDom(blocs, opt) {
  opt = opt || {};

  blocs.forEach(function (b) {

    var e = document.createElement(tag);

    else { e.appendChild(creerRuns(b.runs, opt, etat)); }

}

// ---------- Alignement des mots (plus longue sous-suite commune) ----------
function listeMots(blocs) { return texteBrut(blocs).split(/\s+/).filter(Boolean); }

// Renvoie { avantCommun[], apresCommun[], retraits{ indexApres: [mots retires avant ce mot] } } ou null si trop gros.
function alignerMots(blocsAvant, blocsApres) {
  var a = listeMots(blocsAvant), b = listeMots(blocsApres);
  var n = a.length, m = b.length;
  if (n * m > 30000000) { return null; }
  var W = m + 1;
  var L = new Uint16Array((n + 1) * W);
  var i, j;
  for (i = 1; i <= n; i++) {
    for (j = 1; j <= m; j++) {
      L[i * W + j] = a[i - 1] === b[j - 1] ? L[(i - 1) * W + j - 1] + 1 : Math.max(L[(i - 1) * W + j], L[i * W + j - 1]);
    }
  }
  var avantCommun = new Array(n).fill(0), apresCommun = new Array(m).fill(0), retraits = {};
  i = n; j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) { avantCommun[i - 1] = 1; apresCommun[j - 1] = 1; i--; j--; }
    else if (i > 0 && (j === 0 || L[(i - 1) * W + j] >= L[i * W + j - 1])) { (retraits[j] = retraits[j] || []).unshift(a[i - 1]); i--; }
    else { j--; }
  }
  return { avantCommun: avantCommun, apresCommun: apresCommun, retraits: retraits };
}

function modale(o) {
  return new Promise(function (resolve) {
    var m = $('modal'), corps = $('m-corps'), btns = $('m-btns'), boite = m.querySelector('.boite');
    var retour = document.activeElement;
    $('m-titre').textContent = o.titre;

    else { corps.appendChild(o.corps); }

      if (occupe) { return; }

      if (retour && retour.focus) { try { retour.focus(); } catch (e) { /* ignore */ } }
      resolve(id);

    function touche(e) {
      if (e.key === 'Escape') { e.preventDefault(); fermer(null); }
      if (e.key === 'Tab') {
        var f = Array.prototype.filter.call(boite.querySelectorAll('button:not(:disabled)'), function (b) { return !b.hidden; });
        if (!f.length) { return; }
        var i = f.indexOf(document.activeElement);

        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }

// Ajustement automatique au gabarit : recadrage centré aux proportions de l'emplacement, puis mise à la taille
// du gabarit. Une image plus petite que le gabarit n'est pas refusée : on avertit seulement que le rendu
// pourrait être flou (on ne bloque pas l'auteur).
function preparerImage(fichier, conf) {
  return new Promise(function (resolve, reject) {
    if (['image/png', 'image/jpeg', 'image/webp'].indexOf(fichier.type) < 0) { reject(new Error('Format non accepté. Utilisez un fichier PNG, JPEG ou WebP.')); return; }
    if (fichier.size > 5 * 1024 * 1024) { reject(new Error('Le fichier est trop lourd (5 Mo au plus).')); return; }
    var u = URL.createObjectURL(fichier), im = new Image();
    im.onload = function () {
      URL.revokeObjectURL(u);
      var gw = conf.gabarit[0], gh = conf.gabarit[1], w = im.naturalWidth, h = im.naturalHeight;
      var ratio = gw / gh, sw = w, sh = h, sx = 0, sy = 0;
      if (w / h > ratio) { sw = Math.round(h * ratio); sx = Math.round((w - sw) / 2); }
      else { sh = Math.round(w / ratio); sy = Math.round((h - sh) / 2); }
      var c = document.createElement('canvas');
      c.width = gw; c.height = gh;
      var ctx = c.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(im, sx, sy, sw, sh, 0, 0, gw, gh);
      var out = c.toDataURL('image/webp', 0.85); // WebP garde la transparence (portrait détouré, livre 3D)
      if (out.indexOf('data:image/webp') !== 0) { out = c.toDataURL('image/png'); }
      resolve({ data: out, recadree: sx > 0 || sy > 0, flou: sw < gw || sh < gh });
    };
    im.onerror = function () { URL.revokeObjectURL(u); reject(new Error('Ce fichier n’est pas une image lisible.')); };
    im.src = u;
  });
}

  Object.keys(etat.barres || {}).forEach(function (cle) {
    var barre = etat.barres[cle], possible = editable(cle), actif = possible && etat.actif === cle;
    barre.hidden = !possible; // texte verrouillé, en lecture seule ou vue « Voir les changements »
    Array.prototype.forEach.call(barre.querySelectorAll('[data-cmd],[data-bloc]'), function (b) { b.disabled = !possible; });
    ['bold', 'italic', 'underline'].forEach(function (c) {
      var on = false;
      if (actif) { try { on = document.queryCommandState(c); } catch (e) { /* ignore */ } }
      barre.querySelector('[data-cmd="' + c + '"]').setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    Array.prototype.forEach.call(barre.querySelectorAll('[data-bloc]'), function (b) {

function blocCourant() {
  var sel = window.getSelection();
  if (!sel.anchorNode || !etat.actif) { return ''; }
  var rt = rtDe(etat.actif), n = sel.anchorNode, res = 'p', trouve = false;
  while (n && n !== rt) {
    if (n.nodeType === 1 && TAGS_BLOC[n.tagName]) {

      if (!trouve) { res = /^H[1-6]$/.test(n.tagName) ? n.tagName.toLowerCase() : 'p'; trouve = true; }
    }

}
function changerBloc(tag) {

    while (blocCourant() === 'blockquote' && garde++ < 4) { document.execCommand('outdent'); }

async function enregistrer() {
  if (etat.occupe || etat.verrou) { return false; }
  recalculer();

  if (p) { toast(p.msg, 'mal'); (p.cle === 'email' ? zoneLivre('email') : etat.champs[p.cle]).scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
  if (!etat.dirty) { return true; }
  etat.occupe = true; majUI();
  try {
    var champs = {};
    CHAMPS.forEach(function (c) { if (!estLecture(c.cle)) { champs[c.cle] = norm(etat.work[c.cle]); } });
    var W = etat.L.work, S = etat.L.saved, P = etat.L.pub;
    var livre = { afficheauteur: !!W.afficheauteur, email: courrielNorm(W.email), images: {} };
    // Seules les images changées depuis le dernier enregistrement partent au serveur ; revenir à l'image
    // publiée retire le tampon.
    CLES_IMAGES.forEach(function (k) { if (W[k] !== S[k]) { livre.images[k] = W[k] === P[k] ? { retablir: true } : { data: W[k] }; } });
    var r = await appeler('enregistrer', { livreId: LIVRE_ID, champs: champs, livre: livre });

function paiementRequis() { return !etat.d.gratuit && etat.d.etat !== 'corriger'; }

  $('b-valider').addEventListener('click', function () { if (APPROBATION_ACTIVE) { valider(); } else { bientot(etat.revue ? 'revue' : 'publier'); } });
  $('b-refuser').addEventListener('click', function () { if (APPROBATION_ACTIVE) { refuser(); } else { bientot('revue'); } });
  document.addEventListener('selectionchange', function () { if (etat.actif) { majOutils(); } });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S') && VUE === 'edition') { e.preventDefault(); enregistrer(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (VUE === 'edition' && etat.dirty && !etat.verrou) { e.preventDefault(); e.returnValue = ''; }
  });
}

// ===== Vue Aperçu (nouvel onglet) =====
function montrerApercu(d) {
  document.body.className = 'v-apercu';
  document.title = 'Aperçu : ' + d.livre.titre + ' | Éditions TBL';
  var src = d.copie || d.publie;
  $('ap-titre').textContent = 'Aperçu : ' + d.livre.titre;
  var av = $('avis-apercu');
  if (d.enPlace) {
    $('ap-sous').textContent = 'La page telle qu’elle paraîtra, avec vos modifications. Le menu et le pied de page du site ne sont pas montrés.';
    av.hidden = !d.nonEnregistre;
    av.textContent = 'Certaines modifications ne sont pas encore enregistrées : pensez à enregistrer en revenant à l’éditeur.';
  } else {
    $('ap-sous').textContent = d.copie ? 'Copie enregistrée le ' + fmtDate(d.dateCopie) + '. Le menu et le pied de page du site ne sont pas montrés.'
      : 'Aucune modification enregistrée. Le menu et le pied de page du site ne sont pas montrés.';
    av.hidden = !!d.copie;
    av.textContent = 'Vous n’avez encore rien enregistré : voici la page publiée telle quelle.';
  }
  var cadre = $('cadre-apercu');
  cadre.className = 'cadre ' + APPAREIL;
  var page = fabriquerPage(cadre, d);
  appliquerLivre(page, d.champsLivre.copie || d.champsLivre.publie);
  var boites = boitesChamps(page);
  CHAMPS.forEach(function (c) {
    var rt = boites[c.cle].querySelector('.rt');
    if (estBrut(c.cle)) { rt.classList.add('rt-hero'); }
    rt.appendChild(blocsVersDom(norm(src[c.cle])));
  });
  $('ap-ord').href = '#'; $('ap-mob').href = '#';
  $('ap-ord').onclick = function (e) { e.preventDefault(); APPAREIL = 'ordinateur'; montrerApercu(d); };
  $('ap-mob').onclick = function (e) { e.preventDefault(); APPAREIL = 'mobile'; montrerApercu(d); };
  $('ap-ord').setAttribute('aria-current', APPAREIL === 'ordinateur' ? 'page' : 'false');
  $('ap-mob').setAttribute('aria-current', APPAREIL === 'mobile' ? 'page' : 'false');
  $('ap-fermer').textContent = d.enPlace ? 'Retour à l’éditeur' : 'Fermer l’aperçu';
  $('ap-fermer').onclick = d.enPlace ? retourEdition : fermerPage;
  montrerVue('vue-apercu');
  ajusterCadre();
}

// ===== Vue Rapport Avant / Après (contenu du futur PDF) =====
function montrerRapport(d) {
  document.body.className = 'v-rapport';
  document.title = 'Rapport Avant / Après : ' + d.livre.titre;
  var apres = d.copie || d.publie;
  var paires = CHAMPS.map(function (c) { return { avant: norm(d.publie[c.cle]), apres: norm(apres[c.cle]) }; });
  var glob = tauxGlobal(paires);
  var racine = $('vue-rapport');
  racine.textContent = '';
  var rap = document.createElement('div');
  rap.className = 'rap';
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (txt !== undefined) { e.textContent = txt; } return e; }
  var bo = el('div', 'barre-outils');
  var bi = el('button', 'btn', 'Imprimer / Enregistrer en PDF'); bi.type = 'button'; bi.onclick = function () { window.print(); };
  var bf = el('button', 'btn sec', d.enPlace ? 'Retour à l’éditeur' : 'Fermer le rapport'); bf.type = 'button'; bf.onclick = d.enPlace ? retourEdition : fermerPage;
  bo.appendChild(bi); bo.appendChild(bf); rap.appendChild(bo);
  rap.appendChild(el('h1', '', 'Demande de modification de page'));
  rap.appendChild(el('p', 'sous', 'Les Éditions TBL · Rapport Avant / Après'));
  var meta = el('table', 'meta');
  var statut = { aucune: 'Aucune copie : page publiée', nouveau: 'Nouveau livre (pas encore publié)', modifier: 'Copie en cours (non envoyée)', attente: 'En attente de validation', corriger: 'À corriger après un refus' }[d.etat] || '';
  [['Livre', d.livre.titre], ['Auteur', d.livre.auteurNom], ['Statut', statut],
    [d.copie ? 'Dernière modification' : 'Date du rapport', fmtDate(d.copie ? d.dateCopie : new Date().toISOString())],
    ['Modification globale', pct(glob)], ['Prix du service', prixSelonTaux(glob)]].forEach(function (r) {
    var tr = el('tr'); tr.appendChild(el('td', '', r[0])); tr.appendChild(el('td', '', r[1])); meta.appendChild(tr);
  });
  rap.appendChild(meta);
  CHAMPS.forEach(function (c, i) {
    var p = paires[i], t = tauxModification(p.avant, p.apres), al = alignerMots(p.avant, p.apres);
    var chg = signature(p.avant) !== signature(p.apres);
    var sec = el('section');
    var h = el('h2'); h.appendChild(el('span', '', c.nom));
    h.appendChild(el('span', '', chg ? (t.taux === 0 ? 'Mise en forme seulement' : 'Modifié : ' + pct(t.taux)) : 'Aucune modification'));
    sec.appendChild(h);
    var deux = el('div', 'deux');
    [['Avant (version publiée)', p.avant, al && al.avantCommun, 'retrait'], ['Après (copie de l’auteur)', p.apres, al && al.apresCommun, 'ajout']].forEach(function (col) {
      var c1 = el('div', 'col'); c1.appendChild(el('h3', '', col[0]));
      var rt = el('div', 'rt');
      if (texteBrut(col[1]).trim() === '') { rt.appendChild(el('span', 'vide', '(vide)')); }
      else { rt.appendChild(blocsVersDom(col[1], al ? { flags: col[2], classeNon: col[3], couleurs: false } : { couleurs: false })); }
      c1.appendChild(rt); deux.appendChild(c1);
    });
    sec.appendChild(deux);
    rap.appendChild(sec);
  });
  var LP = d.champsLivre.publie, LC = d.champsLivre.copie || LP;
  var sec2 = el('section');
  var h2 = el('h2'); h2.appendChild(el('span', '', 'Autres éléments de la page'));
  h2.appendChild(el('span', '', 'Ne comptent pas dans le pourcentage'));
  sec2.appendChild(h2);
  var tb = el('table', 'autres');
  var th = el('tr'); ['Élément', 'Avant (version publiée)', 'Après (copie de l’auteur)'].forEach(function (t) { th.appendChild(el('th', '', t)); });
  tb.appendChild(th);
  function ligneAutre(nom, avant, apres, chg) {
    var tr = el('tr'); tr.appendChild(el('td', '', nom));
    var a = el('td'), b = el('td');
    if (typeof avant === 'string' || typeof apres === 'string') {
      a.appendChild(el('span', chg ? 'ancien' : '', avant)); b.appendChild(el('span', chg ? 'nouveau' : '', apres));
    } else { a.appendChild(avant); b.appendChild(apres); }
    tr.appendChild(a); tr.appendChild(b); tb.appendChild(tr);
  }
  function miniImg(u, alt) { var i = document.createElement('img'); if (imageSure(u)) { i.src = u; } i.alt = alt; return i; }
  [['image', 'Image du livre'], ['photoAuteur', 'Photo de l’auteur']].forEach(function (x) {
    var chgI = LP[x[0]] !== LC[x[0]];
    ligneAutre(x[1], miniImg(LP[x[0]], x[1]), chgI ? miniImg(LC[x[0]], x[1]) : el('span', '', 'Inchangée'), chgI);
  });
  ligneAutre('Section Auteur', LP.afficheauteur ? 'Affichée' : 'Masquée', LC.afficheauteur ? 'Affichée' : 'Masquée', !!LP.afficheauteur !== !!LC.afficheauteur);
  ligneAutre('Courriel de contact', LP.email || '(aucun)', LC.email || '(aucun)', courrielNorm(LP.email) !== courrielNorm(LC.email));
  sec2.appendChild(tb);
  rap.appendChild(sec2);
  racine.appendChild(rap);
  montrerVue('vue-rapport');
}

// ===== Démarrage =====
async function demarrer() {
  montrerVue('chargement');
  // Sans livre dans l'adresse : dans Wix, le code de la page recharge aussitôt la composante avec
  // ?livre=… ; on attend un peu avant d'afficher le message, pour ne pas le faire clignoter.
  if (!LIVRE_ID) {
    setTimeout(function () {
      montrerEtat(ICO_CADENAS, 'Aucun livre choisi', 'Ouvrez cet éditeur depuis l’onglet Livres de votre Espace Auteurs, avec le bouton « Modifier la page » de votre livre.', 'Retour à l’Espace Auteurs', fermerPage);
    }, 2500);
    return;
  }
  try {
    var d = await appeler('obtenir', { livreId: LIVRE_ID });
    if (traiterStatut(d)) { return; }
    // Lien périmé (après une validation, l'ancienne ligne est archivée) : on suit la ligne Publier actuelle
    if (d.livre && d.livre.id && d.livre.id !== LIVRE_ID) {
      LIVRE_ID = d.livre.id;
      try { history.replaceState(null, '', adresseVue(VUE, VUE === 'apercu' ? APPAREIL : undefined)); } catch (e) { /* ignore */ }
    }
    if (VUE === 'apercu') { montrerApercu(d); }
    else if (VUE === 'rapport') { montrerRapport(d); }
    else { montrerEdition(d); }
  } catch (e) {
    erreurChargement(e);
  }
}

brancherEdition();
demarrer();
</script>
