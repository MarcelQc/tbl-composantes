<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Modifier la page d'un livre | Éditions TBL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Jetons des gabarits (Templates\tokens.css, allure de calendrier-vedettes.html). Copiés ici : la composante est un fichier autonome. */
:root{--tbl-bg:#000;--tbl-paper:#16181c;--tbl-paper-2:#111317;--tbl-line:#34373e;--tbl-ink:#f5f5f5;--tbl-muted:#b7bac2;--tbl-accent:#e52530;--tbl-accent-soft:#5b2126;--tbl-ok:#4cc38a;--tbl-orange:#e8a33d;--tbl-orange-soft:#3d2c12;--tbl-blue:#5b9bf0;--tbl-blue-soft:#14233d;--tbl-font-heading:Arial,Helvetica,sans-serif;--tbl-font-body:Arial,Helvetica,sans-serif;--tbl-space-xs:8px;--tbl-space-sm:16px;--tbl-space-md:24px;--tbl-space-lg:40px;--tbl-radius:14px;--tbl-radius-btn:9px}
/* --accent : boutons et interface (rouge des gabarits). --red et --gold : couleurs de la comparaison (retrait barré #ED1C24, ajout #FFCB05), à ne pas changer.
   --edit : contour des zones de saisie de la page du livre (bleu « information » des gabarits). */
:root{--bg:var(--tbl-bg);--card:var(--tbl-paper);--card2:var(--tbl-paper-2);--line:var(--tbl-line);--txt:var(--tbl-ink);--muted:var(--tbl-muted);--accent:var(--tbl-accent);--rouge-texte:#ffb3b8;--red:#ED1C24;--redsoft:var(--tbl-accent-soft);--gold:#FFCB05;--ok:var(--tbl-ok);--edit:var(--tbl-blue)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
html{scrollbar-color:var(--line) var(--bg);scrollbar-width:thin}
body{margin:0;color:var(--txt);font-family:var(--tbl-font-body);line-height:1.5}
.wrap{width:min(1160px,calc(100% - 28px));margin:auto}
/* Largeur standard des pages (1000 px), comme l'Espace Auteurs et la Mise en vedette */
.bloc{max-width:1000px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);margin:0}

/* Version publiée (ligne grise en bas de la page, administrateurs seulement) : voir afficherVersion(). */
.version-tbl{margin:18px auto 12px;text-align:center;font:12px/1.4 Arial,Helvetica,sans-serif;color:#8a8e97}
/* Boutons de l'interface (pas ceux de la page du livre) */
.btn{border:0;border-radius:var(--tbl-radius-btn);padding:12px 18px;background:var(--accent);color:#fff;font-weight:bold;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:normal}
.btn.sec:hover:not(:disabled){border-color:var(--accent);filter:none}
.btn.petit{padding:8px 14px;font-size:.85rem}
/* Bouton enfoncé (« Voir les changements » actif) : fond rouge atténué, comme un choix en cours */
.btn.sec[aria-pressed="true"]{background:var(--redsoft);border-color:var(--accent);color:#fff}
/* Approuver : vert du bouton « Confirmer » des gabarits (Templates\action-buttons.html) ; Refuser : rouge TBL */
.btn.valider{background:var(--ok);color:#0b1a12}
.btn.refuser{background:var(--accent)}
.motif-saisie{width:100%;min-height:120px;box-sizing:border-box;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:var(--tbl-radius-btn);padding:10px;font:inherit;resize:vertical}
.motif-saisie:focus{outline:none;border-color:var(--accent)}
.motif-compteur{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px}

/* ---------- Etats plein ecran ---------- */
.etat{max-width:620px;margin:70px auto;text-align:center;padding:0 16px}
.etat svg{width:96px;height:96px;color:var(--accent);margin-bottom:8px}
.etat h1{font-size:1.6rem;margin:0 0 10px}
.etat p{color:var(--muted);margin:0 0 18px}
.spin{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:tour 1s linear infinite}
@keyframes tour{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* ---------- En-tête (édition) ----------
   Comme l'Espace Auteurs et la Mise en vedette : ligne 1 les boutons, ligne 2 le titre, ligne 3 une
   introduction. Ensuite le résumé des modifications, puis la barre d'actions, seule collante en haut. */
#haut{padding:18px 0 4px}
.entete{margin-bottom:12px}
.barre-haut{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:8px}
/* Version publiée en haut, à côté du bouton de retour, comme dans l'Espace Auteurs */
.barre-haut .version-tbl{margin:0 auto 0 0;align-self:center;text-align:left}
.actions-haut{display:flex;flex-wrap:wrap;gap:8px}
.barre-haut .btn,#outils .btn{padding:8px 14px;font-size:.9rem}
.sur-titre{margin:6px 0 0;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.titre-page{font-family:var(--tbl-font-heading);font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.1;margin:2px 0 8px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
/* Pastilles de statut (Templates\status-badge.html) : fond teinté et point de couleur. */
.pastille{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 12px;font-family:var(--tbl-font-body);font-size:.8rem;font-weight:600;line-height:1.4;background:#20232a;color:var(--muted);white-space:nowrap}
.pastille::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pastille.pub{background:rgba(76,195,138,.15);color:var(--ok)}
.pastille.mod{background:var(--tbl-orange-soft);color:var(--tbl-orange)}
.pastille.appr{background:var(--tbl-blue-soft);color:var(--tbl-blue)}
.pastille.corr{background:var(--redsoft);color:var(--rouge-texte)}
.pastille.admin{background:transparent;border:1px solid var(--line);color:var(--txt)}
.pastille.admin::before{display:none}
/* Résumé : taux par texte (ou services d'un livre Nouveau) et date de la dernière modification */
.resume{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:14px}
.resume .aide{width:auto;margin-left:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.aide{font-size:.8rem;color:var(--muted);min-height:1.2em;text-align:right;width:100%}
.taux-global{display:flex;align-items:center;gap:10px}
.taux-global .lib{font-size:.82rem;color:var(--muted)}
.taux-global strong{font-size:1.3rem;min-width:4.4ch;line-height:1}
/* Récapitulatif des montants : composantes payantes (cliquables), frais de service, taxes et total */
.recap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.recap .lig{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:3px 11px;font-size:.8rem;color:var(--muted)}
.recap button.lig{font-family:inherit;cursor:pointer;border-color:var(--gold)}
.recap button.lig:hover{border-color:var(--accent);color:var(--txt)}
.recap .lig b{color:var(--txt);font-weight:600;margin-left:4px}
.recap .lig.total{border-color:var(--gold);color:var(--txt)}
.recap .lig.total b{color:var(--gold)}
.recap .lig.controle{border-style:dashed;opacity:.8}
/* Barre d'actions collante : comparaison, état de l'enregistrement et boutons Enregistrer / Approuver */
#outils{position:sticky;top:0;z-index:30;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
.rang-outils{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.rang-outils .ecart{flex:1}
.rang-outils .aide{width:auto}
.rang-outils .actions{margin-left:auto}
#outils #aide-appr:empty{display:none}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
/* Boutons de la barre de mise en forme : même forme que le bouton secondaire des gabarits, en plus petit */
.tb{min-width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:var(--tbl-radius-btn);cursor:pointer;padding:0 8px;font-size:.88rem}
.tb:hover:not(:disabled){border-color:var(--accent)}
.tb:disabled{opacity:.38;cursor:not-allowed}
.tb[aria-pressed="true"]{background:var(--redsoft);border-color:var(--accent);color:#fff}
/* Barre de mise en forme propre à chaque texte enrichi, juste au-dessus de la zone de saisie */
.outils-champ{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 10px;padding:6px 8px;background:var(--card2);border:1px solid var(--line);border-radius:var(--tbl-radius-btn)}
.outils-champ .tb{min-width:30px;height:30px;font-size:.82rem}
.outils-champ .grp{padding-right:6px}
.legende{font-size:.8rem;color:var(--muted);display:flex;gap:12px;align-items:center}
.legende .aj{color:var(--gold);font-weight:bold}
.legende .re{color:var(--red);text-decoration:line-through;font-weight:bold}
@media (max-width:720px){
  .rang-outils{gap:6px 10px}
  .rang-outils .ecart{display:none}
  .rang-outils .actions{width:100%}
  .rang-outils .actions .btn{flex:1 1 auto}
  .legende{display:none}
}

/* Bandeaux d'information (couleurs d'état des gabarits) */
#bandeau-appr,#bandeau-refus,#msg-global{border-radius:var(--tbl-radius);padding:12px 16px;margin:14px auto;max-width:1000px}
#bandeau-appr{background:var(--tbl-blue-soft);border:1px solid var(--tbl-blue);color:var(--txt)}
#bandeau-refus{background:var(--redsoft);border:1px solid var(--accent);color:var(--txt);white-space:pre-wrap}
#msg-global{background:var(--redsoft);border:1px solid var(--accent);color:var(--txt)}

/* ---------- Page du livre (replique de /livres/xxx) ---------- */
#zone-page{padding:14px 0 60px}
#page{width:min(1160px,100%);margin:0 auto;container-type:inline-size;container-name:page;background:#000;color:#fff}
.pg{max-width:1000px;margin:0 auto;padding:0 14px}
.oswald{font-family:'Oswald','Arial Narrow',Arial,sans-serif}
.fond-hero{background:#000 center bottom/cover no-repeat}
.grille-hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:26px;align-items:start;padding:30px 0 34px}
.couv img{width:100%;max-width:330px;display:block;margin:0 auto}
/* Boîtes de la page : fond gris des cartes des gabarits, sans contour (demande de Marcel du 19 octobre 2026) */
.hero-carte{border:0;border-radius:var(--tbl-radius);padding:16px 26px 20px;min-height:400px;display:flex;flex-direction:column;background:var(--card)}
.hero-titre{font:500 30px/1.2 'Oswald','Arial Narrow',Arial,sans-serif;text-align:center;margin:0 0 14px;letter-spacing:.02em}
.prix{margin-top:auto;padding-top:18px;text-align:center;font:700 24px Georgia,'Times New Roman',serif;color:#F28901}
/* Boutons de la page (Commande numérique, Contacter l'auteur, Demande d'extrait) : bouton principal des gabarits (.btn) */
.btn-page{display:block;width:max-content;max-width:100%;margin:22px auto 0}
/* L'icône ePUB du site a un fond noir : « lighten » le fond dans le gris de la carte */
.carte-epub img.ico{mix-blend-mode:lighten}
.carte-epub{border:0;background:var(--card);border-radius:var(--tbl-radius);margin:26px auto 4px;padding:14px 20px 18px;display:flex;justify-content:center;gap:70px;text-align:center;font-size:12px;line-height:1.4;width:92%}
.col-epub{width:250px;display:flex;flex-direction:column;align-items:center}
.col-epub h3{font:700 15px Georgia,'Times New Roman',serif;margin:0 0 6px}
.col-epub img.ico{height:98px;width:auto;margin:2px 0 6px}
.col-epub .achat{width:212px;margin-top:auto;padding-top:8px}
.col-epub .bientot{margin-top:auto;padding-top:14px;font:700 14px Georgia,'Times New Roman',serif;color:#F00000}
.col-epub ul{margin:0;padding:0;list-style:none}
.carte-epub.cache{display:none}
/* Bannière « numérique seulement » : titre et icône à gauche, texte au centre, bouton d'achat à droite */
.carte-epub-seul{justify-content:space-between;align-items:center;gap:30px;padding:14px clamp(20px,5vw,60px)}
.carte-epub-seul .titre-epub{display:flex;flex-direction:column;align-items:center;width:200px}
.carte-epub-seul h3{font:700 15px Georgia,'Times New Roman',serif;margin:0 0 6px}
.carte-epub-seul img.ico{height:98px;width:auto}
.carte-epub-seul .texte-epub{max-width:260px;text-align:center}
.carte-epub-seul .texte-epub ul{margin:4px 0 0;padding-left:18px;text-align:left}
.carte-epub-seul .achat{width:212px}
.titre-img{display:block;margin:4px auto -8px;width:min(340px,72%);height:auto}
.carte{border:0;background:var(--card);border-radius:var(--tbl-radius);padding:18px 18px;margin:0 auto 4px}
.carte-auteur{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;padding:26px 30px}
.portrait{width:210px;border:6px solid #C7C7C7;display:block;height:auto}
.col-photo{width:210px}
.col-photo .controle-image{max-width:210px;padding:8px}
.col-photo .controle-image .mini.gros{padding:6px 10px;font-size:12px}
.col-note{display:flex;flex-direction:column;min-height:260px}
.controle-image{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px auto 0;max-width:330px;background:var(--card);border:0;border-radius:var(--tbl-radius);padding:10px 12px;text-align:center;font:12px var(--tbl-font-body);color:var(--muted)}
.controle-image .rang{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.controle-image .etat-img{color:var(--gold);font-weight:bold}
.controle-image .err-img{color:var(--rouge-texte);font-weight:bold}
/* Extrait en PDF, sous le texte de l'extrait (même boîte que les contrôles d'image) */
.controle-pdf{max-width:520px;margin:18px auto 0}
.controle-pdf .nom-pdf{color:var(--txt);word-break:break-all}
.controle-pdf a.mini{text-decoration:none;display:inline-block}
.controle-image .info-l{color:var(--muted)}
.controle-image input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.controle-image .mini.gros{padding:7px 14px;font-size:13px}
.couv{position:relative}
/* Boîte vide quand le livre n'a pas encore d'image (livre Nouveau) : mêmes proportions que les gabarits */
.image-vide{border:2px dashed rgba(255,255,255,.45);border-radius:10px;background:rgba(0,0,0,.45);color:#e6e6e6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px;font:13px/1.4 Arial,sans-serif;margin:0 auto}
.image-vide strong{font-size:14px}
.couv .image-vide{width:100%;max-width:330px;aspect-ratio:2/3}
.col-photo .image-vide{width:210px;max-width:100%;aspect-ratio:400/454}
.controle-auteur{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;margin:8px auto 10px;padding:8px 14px;border:0;border-radius:var(--tbl-radius);background:var(--card);font:13px var(--tbl-font-body);color:var(--txt);max-width:640px}
.controle-auteur .info-l{color:var(--muted);font-size:12px}
.interrupteur{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:bold}
.interrupteur input{position:absolute;opacity:0;width:1px;height:1px}
.interrupteur .piste{width:44px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.interrupteur .piste::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.interrupteur input:checked+.piste{background:var(--ok)}
.interrupteur input:checked+.piste::after{left:23px}
.interrupteur input:focus-visible+.piste{outline:2px solid var(--accent);outline-offset:2px}
.interrupteur input:disabled+.piste{opacity:.5}
.section-masquee{display:none;border:1px dashed var(--line);border-radius:22px;padding:18px;text-align:center;color:var(--muted);font:14px Arial,sans-serif;margin:8px auto}
.v-edition [data-section].masque .section-masquee{display:block}
.v-edition [data-section].masque .titre-img,.v-edition [data-section].masque .carte{display:none}
.v-apercu [data-section].masque{display:none}
.v-apercu .controle-auteur,.v-apercu .controle-image,.v-apercu .champ-email,.v-apercu .section-masquee{display:none}
/* Courriel de contact à côté du bouton Contacter l'auteur : même hauteur, bas alignés */
.ligne-contact{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:auto;padding-top:16px}
.ligne-contact .btn-page{margin:0;flex:0 0 auto}
.ligne-contact .btn-page,.champ-email input{height:46px}
.champ-email{display:flex;flex-direction:column;gap:4px;flex:1 1 220px;min-width:0;font:600 12px var(--tbl-font-body);color:var(--muted)}
.champ-email input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:0 14px;font:15px var(--tbl-font-body);border-radius:var(--tbl-radius-btn)}
.champ-email input::placeholder{color:var(--muted)}
.champ-email input:focus{outline:none;border-color:var(--accent)}
.champ-email.err input{border-color:var(--accent);outline:1px solid var(--accent)}
.champ-email input:disabled{opacity:.55;cursor:not-allowed}
.msg-email{color:var(--rouge-texte);font:600 13px Arial,sans-serif;margin-top:6px}
.note-email{color:var(--muted);font:12px Arial,sans-serif;margin-top:4px}
.v-edition .diff-l .ancien{color:var(--red);text-decoration:line-through}
.v-edition .diff-l .nouveau{color:var(--gold)}
.carte-duo img{width:100%;max-width:770px;display:block;margin:6px auto}
.duo-grille{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;align-items:start}
.duo-etiquette{font:700 12px var(--tbl-font-body);color:var(--muted);text-align:center;margin-bottom:6px;letter-spacing:.04em}
.duo-mob img{max-width:340px}
.duo-col .controle-image{max-width:none;margin-top:10px}
.v-apercu .duo-etiquette{display:none}
.v-apercu .duo-grille{display:block}
.v-apercu .duo-mob{display:none}
@container page (max-width:760px){
  .v-edition .duo-grille{grid-template-columns:1fr}
  .v-apercu .duo-ord{display:none}
  .v-apercu .duo-mob{display:block}
}
.vedettes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:6px 0 30px}
.vedettes img{width:100%;height:auto;display:block;border-radius:4px}
.vedettes figcaption{font-size:12px;text-align:center;padding-top:6px;color:#ddd}
.vedettes figure{margin:0}
@container page (max-width:760px){
  .grille-hero{grid-template-columns:1fr;gap:14px}
  .hero-carte{min-height:0;padding:14px 16px 18px}
  .hero-titre{font-size:24px}
  .couv img{max-width:240px}
  .carte-epub{flex-direction:column;align-items:center;gap:22px;width:100%}
  .carte-auteur{grid-template-columns:1fr;padding:20px 16px;gap:16px;justify-items:center}
  .portrait{width:180px}
  .col-photo{width:210px;max-width:100%}
  .col-note{min-height:0;width:100%}
  .vedettes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .carte{padding:14px 12px}
}

/* Texte riche : meme rendu que le site (Ricos) */
.rt{font:15px/1.6 Arial,Helvetica,sans-serif;color:#fff;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;min-height:1.7em}
.rt p,.rt blockquote,.rt h1,.rt h2,.rt h3,.rt h4,.rt h5,.rt h6{margin:0;min-height:1.6em}
.rt h1{font-size:32px;line-height:1.25}
.rt h2{font-size:28px;line-height:1.25}
.rt h3{font-size:24px;line-height:1.3}
.rt h4{font-size:20px;font-weight:400;line-height:1.35}
.rt h5{font-size:17px;line-height:1.4}
.rt h6{font-size:15px;line-height:1.5}
.rt blockquote{border-left:4px solid #0057E1;padding:6px 0 6px 16px;margin:0 0 6px 20px}
.rt-hero,.rt-hero p,.rt-hero h1,.rt-hero h2,.rt-hero h3,.rt-hero h4,.rt-hero h5,.rt-hero h6{font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:500;letter-spacing:.04em}
.rt-hero,.rt-hero p,.rt-hero h6{font-size:22px;line-height:1.5;letter-spacing:.05em}
/* DESC_PLAN : composante à hauteur FIXE, une barre de défilement apparaît si le texte déborde */
.champ[data-champ="desc_plan"] .rt{height:236px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#8a8d95 transparent;padding-right:6px}
.rt-hero [data-fg],.rt-hero [data-bg]{color:inherit!important;background:none!important}
.rt-hero h4{font-size:22px}.rt-hero h5{font-size:21px}
.rt-hero h1{font-size:30px}.rt-hero h2{font-size:28px}.rt-hero h3{font-size:25px}
@container page (max-width:760px){.rt-hero,.rt-hero p,.rt-hero h6{font-size:17px}.champ[data-champ="desc_plan"] .rt{height:196px}}
.ajout{color:var(--gold)}
.retrait{color:var(--red);text-decoration:line-through}
.rt b,.rt strong{font-weight:700}

/* ---------- Edition en place ---------- */
.champ-tete{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;font:600 12px var(--tbl-font-body);color:var(--muted);letter-spacing:normal}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip.crayon{color:var(--txt)}
.chip.tx{color:var(--muted)}
.chip.tx.chg{border-color:var(--gold);color:var(--gold)}
.chip.fmt{border-color:var(--edit);color:var(--edit)}
.champ-tete .ecart{flex:1}
/* Petits boutons secondaires (↻, Annuler les modifications, images) : forme du bouton secondaire des gabarits */
.mini{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:var(--tbl-radius-btn);padding:4px 11px;font:600 12px var(--tbl-font-body);cursor:pointer}
.mini:hover:not(:disabled){border-color:var(--accent)}
.mini:disabled{opacity:.4;cursor:not-allowed}
.v-edition .rt[contenteditable="true"]{outline:1px dashed rgba(255,255,255,.3);outline-offset:6px;border-radius:4px;cursor:text}
/* Zones de saisie des textes enrichis : au moins 6 lignes (15 px x 1,6 = 24 px par ligne), même vides.
   La description de l'en-tête (.rt-hero) garde sa hauteur fixe ; l'aperçu n'est pas touché. */
.v-edition .rt:not(.rt-hero){min-height:144px}
.v-edition .rt[contenteditable="true"]:hover{outline-color:var(--edit)}
.v-edition .rt[contenteditable="true"]:focus{outline:2px solid var(--edit)}
.v-edition .champ.err .rt{outline:2px solid var(--red)!important}
.v-edition .rt.lecture{outline:1px dashed rgba(255,255,255,.18);outline-offset:6px;cursor:default}
.v-edition .rt.diff{outline:1px solid rgba(255,203,5,.5);outline-offset:6px;border-radius:4px}
.msg-url{margin-top:12px;color:var(--rouge-texte);font:600 13px Arial,sans-serif}
.note-champ{margin-top:10px;color:var(--muted);font:12px var(--tbl-font-body)}
.v-edition .fige{opacity:.38;pointer-events:none;user-select:none}
/* Section « En vedette » : places choisies par l'auteur (bouton en édition) et places libres (vedette de la semaine,
   pâlie). Fenêtre de choix : couvertures des livres proposés, sur le modèle de la Mise en vedette (EDV). */
.vedettes button.place-ved{display:block;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:inherit;cursor:pointer}
.vedettes button.place-ved:hover img,.vedettes button.place-ved:focus-visible img{outline:2px solid var(--accent);outline-offset:3px}
.vedettes .libre img{opacity:.5}
.vedettes .vide-ved{aspect-ratio:2/3;border:2px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.vedettes figcaption small{display:block;color:var(--muted);font-size:11px}
.controle-ved{max-width:640px;margin:0 auto 26px}
.choix-ved{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:6px}
.choix-ved button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--tbl-radius-btn);background:var(--card2);color:var(--txt);font:inherit;font-size:.82rem;cursor:pointer;text-align:center}
.choix-ved button:hover:not(:disabled){border-color:var(--accent)}
.choix-ved button:disabled{opacity:.4;cursor:not-allowed}
.choix-ved button[aria-pressed="true"]{border-color:var(--accent);background:var(--redsoft)}
.choix-ved img,.choix-ved .vide-ved{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px}
/* Aperçu : les boutons de la page affichent un message qui explique leur action sur le site */
.v-apercu [data-action]{cursor:pointer}
.bulle-apercu{position:absolute;z-index:130;max-width:min(340px,calc(100% - 16px));background:var(--card);border:1px solid var(--tbl-blue);color:var(--txt);border-radius:var(--tbl-radius-btn);padding:10px 14px;font:14px/1.45 var(--tbl-font-body);box-shadow:0 8px 30px rgba(0,0,0,.6)}
.v-apercu .champ-tete,.v-apercu .msg-url,.v-apercu .note-champ{display:none}
.v-apercu .rt{outline:none}

/* ---------- Aperçu (dans l'éditeur) ----------
   Même en-tête que l'édition ; Ordinateur et Mobile sont des onglets « dossier » (Templates\tabs.html),
   comme ceux de l'Espace Auteurs : l'onglet actif se fond dans le panneau qui contient la page. */
#zone-apercu{padding:0 0 60px}
.onglets{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:2px 2px 0;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglet{flex:0 0 auto;border:1px solid var(--line);border-bottom:0;background:var(--card2);border-radius:var(--tbl-radius-btn) var(--tbl-radius-btn) 0 0;padding:10px 18px;font-family:var(--tbl-font-heading);font-size:.98rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.onglet:hover{color:var(--txt)}
.onglet[aria-selected="true"]{background:var(--card);color:var(--txt);font-weight:bold;box-shadow:inset 0 2px 0 var(--accent)}
.panneau-apercu{background:var(--card);border:1px solid var(--line);border-radius:0 var(--tbl-radius) var(--tbl-radius) var(--tbl-radius);padding:20px 14px;overflow-x:auto}
.cadre{margin:0 auto;border:1px solid var(--line);background:#000}
.cadre.ordinateur{width:1160px}
.cadre.mobile{width:min(406px,100%);border:8px solid var(--line);border-radius:34px;overflow:hidden}
@media (max-width:560px){.panneau-apercu{padding:12px 8px}}
#avis-apercu{margin:0 0 14px;background:var(--tbl-orange-soft);border:1px solid var(--tbl-orange);color:var(--txt);border-radius:var(--tbl-radius);padding:10px 14px;font-size:.9rem}

/* ---------- Fenêtre de confirmation (Templates\confirm-modal.html) ---------- */
#modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .voile{position:absolute;inset:0;background:rgba(0,0,0,.72)}
#modal .boite{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--tbl-radius);box-shadow:0 20px 50px rgba(0,0,0,.6);padding:var(--tbl-space-md);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto}
#modal h2{font-family:var(--tbl-font-heading);margin:0 0 10px;font-size:1.15rem}
#modal .corps{color:var(--muted);font-size:.95rem}
#modal .corps p{margin:0 0 10px}
#modal .corps table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:.95rem}
#modal .corps td{padding:6px 0;border-bottom:1px solid var(--line)}
#modal .corps td:last-child{text-align:right;font-weight:bold;color:var(--txt)}
#modal .corps tr.total td{border-bottom:0;padding-top:10px;color:var(--txt);font-weight:bold;font-size:1.05rem}
#modal .corps tr.total td:last-child{color:var(--gold)}
#modal .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
/* Comme confirm-modal.html : Annuler à gauche, l'action principale à droite */
#modal .btns .btn.sec{order:-1}

/* ---------- Avis (toast) ---------- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;background:var(--card);border:1px solid var(--line);border-radius:var(--tbl-radius-btn);padding:10px 18px;max-width:min(560px,calc(100% - 24px));box-shadow:0 8px 30px rgba(0,0,0,.6)}
#toast.ok{border-color:var(--ok)}
#toast.mal{border-color:var(--accent)}

/* ---------- Rapport Avant / Apres (papier) ---------- */
.v-rapport,.v-rapport html{background:#fff}
body.v-rapport{background:#fff;color:#111}
.rap{max-width:980px;margin:0 auto;padding:24px 20px 60px;font-family:Arial,Helvetica,sans-serif;color:#111}
.rap h1{font-size:1.6rem;margin:0 0 4px}
.rap .sous{color:#555;margin:0 0 16px}
.rap table.meta{border-collapse:collapse;margin-bottom:18px;font-size:.95rem}
.rap table.meta td{padding:3px 18px 3px 0;vertical-align:top}
.rap table.meta td:first-child{color:#555}
.rap section{margin:0 0 22px;break-inside:avoid-page}
.rap h2{font-size:1.15rem;margin:0 0 8px;border-bottom:2px solid #111;padding-bottom:4px;display:flex;justify-content:space-between;gap:12px}
.rap .deux{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rap .col{border:1px solid #bbb;border-radius:8px;padding:10px 12px}
.rap .col h3{margin:0 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:#555}
.rap .rt{color:#111;font-size:13px;line-height:1.5;min-height:0;white-space:pre-wrap}
.rap .rt blockquote{border-left-color:#0057E1}
.rap .rt [data-fg]{color:inherit!important}
.rap .rt .ajout{color:#9A5B00;font-weight:bold}
.rap .rt .retrait{color:#C4001A}
.rap .vide{color:#777;font-style:italic}
.rap table.autres{border-collapse:collapse;width:100%;font-size:.92rem}
.rap table.autres td,.rap table.autres th{border:1px solid #bbb;padding:6px 10px;vertical-align:top;text-align:left}
.rap table.autres th{background:#f2f2f2;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#555}
.rap table.autres img{max-width:150px;max-height:220px;display:block;border:1px solid #ccc;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px}
.rap .ancien{color:#C4001A;text-decoration:line-through}
.rap .nouveau{color:#9A5B00;font-weight:bold}
.rap .barre-outils{display:flex;gap:10px;margin-bottom:16px}
.rap .btn.sec{color:#111;border-color:#888}
@media print{
  @page{size:letter;margin:14mm}
  .rap .barre-outils{display:none}
  body.v-rapport{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:640px){.rap .deux{grid-template-columns:1fr}}

</style>

function borner(n, min, max) {

// Plus longue sous-suite commune entre deux listes de mots.
function communs(a, b) {
  if (a.length === 0 || b.length === 0) {
    return 0;
  }
  let precedente = new Uint32Array(b.length + 1);
  let courante = new Uint32Array(b.length + 1);
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      courante[j] = a[i - 1] === b[j - 1] ? precedente[j - 1] + 1 : Math.max(precedente[j], courante[j - 1]);
    }
    const t = precedente;
    precedente = courante;
    courante = t;
  }
  return precedente[b.length];

// Taux de modification d'UN champ, selon la grille de prix (service-correction-pages-livre.md, section 4) :
// mots ajoutés, retirés ou changés ÷ nombre de mots du texte d'origine, entre 0 et 100.
// Mots touchés = le plus grand de (mots retirés, mots ajoutés) : un mot remplacé compte une seule fois.
// Ex. sur 60 mots : 12 remplacés, 12 ajoutés ou 12 retirés donnent tous 20 %.
// (L'ancienne formule, 1 - 2 x communs / (avant + après), sous-estimait les ajouts et les retraits.)
function tauxModification(blocsAvant, blocsApres) {
  const a = mots(blocsAvant);
  const b = mots(blocsApres);
  const c = communs(a, b);
  const touches = Math.max(a.length - c, b.length - c);
  const taux = a.length === 0 ? (b.length === 0 ? 0 : 100) : Math.min(100, (touches * 100) / a.length);
  return { taux, communs: c, avant: a.length, apres: b.length };

// Taux global sur plusieurs champs : mêmes formules, sur la somme des mots.
function tauxGlobal(paires) {
  let c = 0;
  let somme = 0;
  for (const p of paires) {
    const t = tauxModification(p.avant, p.apres);
    c += t.communs;
    somme += t.avant + t.apres;
  }
  return somme === 0 ? 0 : (1 - (2 * c) / somme) * 100;
}

// ---------------------------------------------------------------------------
// Facture : frais de service et taxes (service-correction-pages-livre.md, section 4)
// ---------------------------------------------------------------------------

const TAUX_FRAIS_SERVICE = 0.05;
const TAUX_TPS = 0.05;
const TAUX_TVQ = 0.09975;

// lignes : [{ nom, montant }] en CENTS (entiers). Frais de service sur le sous-total, puis TPS et TVQ sur
// le sous-total plus les frais, chacune arrondie au cent. Ex. 100 $ + 100 $ : 210,00 + 10,50 + 20,95 = 241,45 $.
//
// options.gratuit (auteur gratuit ou admin, nouveau-livre-et-auteur.md) : une ligne « Gratuité » NÉGATIVE,
// placée après les services et les frais et AVANT les taxes, ramène la base taxable à 0 : TPS, TVQ et total
// valent 0,00 $. Les frais restent calculés sur les vrais services. Les taxes théoriques (comme sans
// gratuité) sont gardées pour le bloc « Contrôle ».
// Ex. 5 $ + 10 $ + 10 $, frais 1,25 $, gratuité −26,25 $, total 0,00 $ ; TPS théorique 1,31 $, TVQ 2,62 $.
function calculerFacture(lignes, options) {
  const sousTotal = lignes.reduce((s, l) => s + l.montant, 0);
  const frais = Math.round(sousTotal * TAUX_FRAIS_SERVICE);
  const baseReelle = sousTotal + frais;
  const tpsTheorique = Math.round(baseReelle * TAUX_TPS);
  const tvqTheorique = Math.round(baseReelle * TAUX_TVQ);
  const gratuit = !!(options && options.gratuit);
  const montantGratuite = gratuit ? -baseReelle : 0;
  const base = baseReelle + montantGratuite;
  const tps = gratuit ? 0 : tpsTheorique;
  const tvq = gratuit ? 0 : tvqTheorique;
  return { lignes, sousTotal, frais, montantGratuite, tps, tvq, total: base + tps + tvq, tpsTheorique, tvqTheorique, gratuit };
}

function typeDe(tag, ctx) {

    if (n.nodeType === 1 && TAGS_BLOC[n.tagName]) {

      if (aEnfantsBloc) {

function creerRuns(runs, opt, etat) {
  var frag = document.createDocumentFragment();
  runs.forEach(function (r) {
    var cont = document.createDocumentFragment();
    r.texte.split(/(\s+)/).forEach(function (p) {
      if (p === '') { return; }
      if (/^\s+$/.test(p)) { cont.appendChild(document.createTextNode(p)); etat.cont = false; return; }
      var idx;
      if (etat.cont) { idx = etat.w - 1; }
      else {
        idx = etat.w++;
        if (opt.retraits && opt.retraits[idx]) {
          var d = document.createElement('span');
          d.className = 'retrait';
          d.textContent = opt.retraits[idx].join(' ');
          cont.appendChild(d);
          cont.appendChild(document.createTextNode(' '));
          opt.retraits[idx] = null;
        }
      }
      etat.cont = true;
      if (opt.flags && !opt.flags[idx]) {
        var s = document.createElement('span');
        s.className = opt.classeNon;
        s.textContent = p;
        cont.appendChild(s);
      } else {
        cont.appendChild(document.createTextNode(p));
      }
    });
    var noeud = cont;
    function envelopper(tag, attrs) {
      var e = document.createElement(tag);
      if (attrs) { Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); }
      e.appendChild(noeud);
      noeud = e;
    }
    if (r.souligne) { envelopper('u'); }
    if (r.italique) { envelopper('i'); }
    if (r.gras) { envelopper('b'); }
    if (r.couleur && opt.couleurs !== false) {

      if (r.couleur.foreground) { at['data-fg'] = r.couleur.foreground; at.style = 'color:' + r.couleur.foreground; }
      if (r.couleur.background) { at['data-bg'] = r.couleur.background; }
      envelopper('span', at);
    }
    frag.appendChild(noeud);
  });

}

// opt : { flags, classeNon, retraits, couleurs }. Renvoie un DocumentFragment.
function blocsVersDom(blocs, opt) {

  var frag = document.createDocumentFragment();
  var dernier = null;
  blocs.forEach(function (b) {
    etat.cont = false;
    var tag = b.type === 'titre' ? 'h' + b.niveau : (b.type === 'citation' ? 'blockquote' : 'p');
    var e = document.createElement(tag);
    if (!b.runs.length) { e.appendChild(document.createElement('br')); }
    else { e.appendChild(creerRuns(b.runs, opt, etat)); }
    frag.appendChild(e);
    dernier = e;
  });
  if (!dernier) {
    dernier = document.createElement('p');
    dernier.appendChild(document.createElement('br'));
    frag.appendChild(dernier);
  }
  if (opt.retraits) {
    Object.keys(opt.retraits).forEach(function (k) {
      if (opt.retraits[k]) {
        if (dernier.lastChild && dernier.lastChild.tagName === 'BR') { dernier.removeChild(dernier.lastChild); }
        var d = document.createElement('span');
        d.className = 'retrait';
        d.textContent = ' ' + opt.retraits[k].join(' ');
        dernier.appendChild(d);

  }

}

// ---------- Alignement des mots (plus longue sous-suite commune) ----------
function listeMots(blocs) { return texteBrut(blocs).split(/\s+/).filter(Boolean); }

// Renvoie { avantCommun[], apresCommun[], retraits{ indexApres: [mots retires avant ce mot] } } ou null si trop gros.
function alignerMots(blocsAvant, blocsApres) {
  var a = listeMots(blocsAvant), b = listeMots(blocsApres);
  var n = a.length, m = b.length;
  if (n * m > 30000000) { return null; }
  var W = m + 1;
  var L = new Uint16Array((n + 1) * W);
  var i, j;
  for (i = 1; i <= n; i++) {
    for (j = 1; j <= m; j++) {
      L[i * W + j] = a[i - 1] === b[j - 1] ? L[(i - 1) * W + j - 1] + 1 : Math.max(L[(i - 1) * W + j], L[i * W + j - 1]);
    }
  }
  var avantCommun = new Array(n).fill(0), apresCommun = new Array(m).fill(0), retraits = {};
  i = n; j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) { avantCommun[i - 1] = 1; apresCommun[j - 1] = 1; i--; j--; }
    else if (i > 0 && (j === 0 || L[(i - 1) * W + j] >= L[i * W + j - 1])) { (retraits[j] = retraits[j] || []).unshift(a[i - 1]); i--; }
    else { j--; }
  }
  return { avantCommun: avantCommun, apresCommun: apresCommun, retraits: retraits };
}

  rt.addEventListener('drop', function (e) { e.preventDefault(); });

function rendreChamp(cle) {
  var rt = rtDe(cle);

function rendreTout() { CHAMPS.forEach(function (c) { rendreChamp(c.cle); }); rendreLivre(); majLivre(); majOutils(); }

// Texte d'une zone de texte brut : les retours à la ligne viennent du texte (touche Entrée), des <br> ou des blocs <p> et <div>
// (un collage peut en créer). Un bloc compte pour UNE seule fin de ligne, contrairement à innerText qui en compte deux.
function texteBrutDom(racine) {
  var out = '';
  function fin() { return out === '' || out.charAt(out.length - 1) === '\n'; }
  (function marche(n) {
    if (n.nodeType === 3) { out += n.nodeValue; return; }
    if (n.nodeType !== 1) { return; }
    if (n.tagName === 'BR') { out += '\n'; return; }
    var bloc = n.tagName === 'P' || n.tagName === 'DIV';
    if (bloc && !fin()) { out += '\n'; }
    Array.prototype.forEach.call(n.childNodes, marche);
    if (bloc && !fin()) { out += '\n'; }
  })(racine);
  return out;
}
function lireChamp(cle) {
  var rt = rtDe(cle);
  if (estBrut(cle)) {
    etat.work[cle] = blocsDepuisTexteBrut(texteBrutDom(rt).split(NBSP).join(' '));
    recalculer();
    return;
  }
  if (!rt.firstChild || (rt.childNodes.length === 1 && rt.firstChild.nodeName === 'BR')) {
    rt.textContent = '';
    var p = document.createElement('p'); p.appendChild(document.createElement('br')); rt.appendChild(p);
  }
  etat.work[cle] = lireBlocs(rt);
  recalculer();
}

function insererTexte(t) {
  t = t.split(NBSP).join(' ').replace(/\r/g, '');
  t.split('\n').forEach(function (ligne, i) {
    if (i > 0) { document.execCommand('insertParagraph'); }
    if (ligne) { document.execCommand('insertText', false, ligne); }
  });
}

function recalculer() {
  var paires = [];
  CHAMPS.forEach(function (c) {
    var k = c.cle, av = etat.pub[k], ap = etat.work[k];
    var t = tauxModification(av, ap);
    etat.t[k] = t.taux;
    etat.chg[k] = signature(av) !== signature(ap);
    etat.fmt[k] = etat.chg[k] && t.taux === 0;

    paires.push({ avant: av, apres: ap });

}

function courrielNorm(v) { return String(v || '').trim().toLowerCase(); }

// L.vedettes : 4 places (identifiant d'un livre ou null). L'auteur choisit parmi ses autres livres publiés et

// pour un livre publié, compris dans le prix fixe d'un livre Nouveau.
var NB_VEDETTES = 4, PRIX_PLACE_VEDETTE = 1000;

  }

  // - « revue » : il examine une demande En attente de validation envoyée par un auteur (peut approuver ou refuser).

      : 'Demande envoyée à TBL' + (dateEnvoi() ? ' le ' + fmtDate(dateEnvoi()) : '') + '. Votre page est en lecture seule pendant l’examen : vous pouvez la consulter et '

// ---------- Barres de mise en forme (une par texte enrichi) ----------
// Chaque barre agit sur SON texte : un clic place d'abord le curseur dans ce texte s'il était ailleurs.
function monterBarre(cle, boite, rt) {
  var barre = document.getElementById('tpl-outils').content.firstElementChild.cloneNode(true);
  barre.setAttribute('aria-label', 'Mise en forme : ' + nomChamp(cle));
  boite.insertBefore(barre, rt);
  etat.barres[cle] = barre;
  function activer() { if (etat.actif !== cle) { rt.focus(); etat.actif = cle; } }
  Array.prototype.forEach.call(barre.querySelectorAll('button'), function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); }); // garde la sélection dans le texte
  });
  Array.prototype.forEach.call(barre.querySelectorAll('[data-cmd]'), function (b) {
    b.addEventListener('click', function () { activer(); document.execCommand(b.getAttribute('data-cmd')); lireChamp(cle); majOutils(); });
  });
  Array.prototype.forEach.call(barre.querySelectorAll('[data-bloc]'), function (b) {
    b.addEventListener('click', function () { activer(); changerBloc(b.getAttribute('data-bloc')); });
  });
}
function majOutils() {
  Object.keys(etat.barres || {}).forEach(function (cle) {
    var barre = etat.barres[cle], possible = editable(cle), actif = possible && etat.actif === cle;
    barre.hidden = !possible; // texte verrouillé, en lecture seule ou vue « Voir les changements »
    Array.prototype.forEach.call(barre.querySelectorAll('[data-cmd],[data-bloc]'), function (b) { b.disabled = !possible; });
    ['bold', 'italic', 'underline'].forEach(function (c) {
      var on = false;
      if (actif) { try { on = document.queryCommandState(c); } catch (e) { /* ignore */ } }
      barre.querySelector('[data-cmd="' + c + '"]').setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var courant = actif ? blocCourant() : '';
    Array.prototype.forEach.call(barre.querySelectorAll('[data-bloc]'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-bloc') === courant ? 'true' : 'false');
    });
  });
}
function blocCourant() {
  var sel = window.getSelection();
  if (!sel.anchorNode || !etat.actif) { return ''; }
  var rt = rtDe(etat.actif), n = sel.anchorNode, res = 'p', trouve = false;
  while (n && n !== rt) {
    if (n.nodeType === 1 && TAGS_BLOC[n.tagName]) {
      if (n.tagName === 'BLOCKQUOTE') { return 'blockquote'; }
      if (!trouve) { res = /^H[1-6]$/.test(n.tagName) ? n.tagName.toLowerCase() : 'p'; trouve = true; }
    }
    n = n.parentNode;
  }
  return n === rt ? res : '';
}
function changerBloc(tag) {
  if (!etat.actif) { return; }
  var cle = etat.actif;
  document.execCommand('formatBlock', false, '<' + tag + '>');
  if (tag !== 'blockquote') {
    var garde = 0;
    while (blocCourant() === 'blockquote' && garde++ < 4) { document.execCommand('outdent'); }
  }
  lireChamp(cle);
  majOutils();
}

async function enregistrer() {
  if (etat.occupe || etat.verrou) { return false; }
  recalculer();
  var p = premierProbleme();
  if (p) { toast(p.msg, 'mal'); (p.cle === 'email' ? zoneLivre('email') : etat.champs[p.cle]).scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
  if (!etat.dirty) { return true; }
  etat.occupe = true; majUI();
  try {
    var champs = {};
    CHAMPS.forEach(function (c) { if (!estLecture(c.cle)) { champs[c.cle] = norm(etat.work[c.cle]); } });
    var W = etat.L.work, S = etat.L.saved, P = etat.L.pub;
    var livre = { afficheauteur: !!W.afficheauteur, email: courrielNorm(W.email), images: {} };
    // Seules les images changées depuis le dernier enregistrement partent au serveur ; revenir à l'image
    // publiée retire le tampon.
    CLES_IMAGES.forEach(function (k) { if (W[k] !== S[k]) { livre.images[k] = W[k] === P[k] ? { retablir: true } : { data: W[k] }; } });
    // Extrait PDF : un nouveau fichier part au serveur ; revenir à l'extrait publié (ou à aucun) vide le tampon.
    if (clePdf(W.extraitPdf) !== clePdf(S.extraitPdf)) {
      livre.extraitPdf = W.extraitPdf && W.extraitPdf.data ? { data: W.extraitPdf.data, nom: W.extraitPdf.nom } : { retablir: true };
    }
    // En vedette : les 4 places partent quand elles ont changé depuis le dernier enregistrement
    if (valL(W.vedettes, 'vedettes') !== valL(S.vedettes, 'vedettes')) { livre.vedettes = placesVed(W.vedettes); }
    var r = await appeler('enregistrer', { livreId: LIVRE_ID, champs: champs, livre: livre });
    if (!r.ok) { toast(r.message || 'L’enregistrement a été refusé.', 'mal'); return false; }
    CHAMPS.forEach(function (c) { etat.saved[c.cle] = clone(norm(etat.work[c.cle])); });
    // Le serveur renvoie l'adresse définitive des images téléversées (Gestionnaire de médias)
    Object.keys(r.images || {}).forEach(function (k) { if (Object.prototype.hasOwnProperty.call(livre.images, k)) { etat.L.work[k] = r.images[k]; } });
    if (livre.extraitPdf) { etat.L.work.extraitPdf = r.extraitPdf || null; }
    if (livre.vedettes) { etat.L.work.vedettes = placesVed(livre.vedettes); }
    etat.L.work.email = livre.email;
    etat.L.saved = clone(etat.L.work);
    etat.copie = true;
    if (etat.d.etat === 'aucune') { etat.d.etat = 'modifier'; } // le premier enregistrement crée la copie
    etat.d.dateCopie = r.dateCopie;
    if (r.derniereModification) { etat.d.derniereModification = r.derniereModification; }
    rendreLivre();
    toast('Modifications enregistrées.', 'ok');
    return true;
  } catch (e) {
    toast('L’enregistrement a échoué. Vos modifications sont toujours dans la page. Réessayez dans un instant.', 'mal');
    return false;
  } finally {
    etat.occupe = false; recalculer();
  }
}

// Approuver et envoyer (une demande En approbation) et Publier (édition directe par un administrateur, sans

async function valider() {
  var revue = etat.revue, adminEdition = etat.admin && !etat.appr;
  if (!revue && !adminEdition) { return; }
  if (etat.dirty) { toast('Enregistrez vos modifications avant de publier.', 'mal'); return; }
  var corps = document.createElement('div');
  var t = document.createElement('table');
  var facV = factureCourante();
  [['Livre', etat.d.livre.titre], ['Auteur', etat.d.livre.auteurNom], ['Total des services', facV ? argent(facV.total) : 'aucuns nouveaux frais'],
    ['Autres modifications', autresModifications().join(' · ') || 'aucune']].forEach(function (r) {
    var tr = document.createElement('tr'), a = document.createElement('td'), b = document.createElement('td');
    a.textContent = r[0]; b.textContent = r[1]; tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
  });

  corps.appendChild(p);
  var res = null;
  var r = await modale({
    titre: revue ? 'Approuver et publier les modifications ?' : 'Publier les modifications ?', corps: corps,
    boutons: [{ id: 'ok', libelle: revue ? 'Approuver et envoyer' : 'Publier', principal: true, action: async function () {
      res = await appeler('approuver', { livreId: LIVRE_ID });
      if (!res.ok) { throw new Error(res.message || 'La publication a échoué.'); }
    } }, { id: 'non', libelle: 'Annuler' }]
  });
  if (r !== 'ok') { return; }
  if (res.livreId) {
    LIVRE_ID = res.livreId;
    try { history.replaceState(null, '', adresseVue('edition')); } catch (e) { /* ignore */ }
  }
  // imageCatalogue : null (pas de nouvelle image), { ok: true } ou { ok: false } (image de la boutique à refaire)
  var boutique = !res.imageCatalogue ? '' : (res.imageCatalogue.ok ? ' Image du produit mise à jour dans la boutique.' : ' Attention : l’image du produit dans la boutique n’a pas été mise à jour.');
  // extrait : null (pas de nouveau PDF), sinon { copie, formulaire: { ok, ajoute } | { ok: false }, raison }
  var ex = res.extrait, extraitOk = !ex || (ex.copie && !ex.raison && ex.formulaire && ex.formulaire.ok);
  var texteExtrait = !ex ? '' : (extraitOk
    ? ' Extrait PDF copié dans le dossier Extrait' + (ex.formulaire.ajoute ? ' et livre ajouté au formulaire.' : ' (livre déjà dans le formulaire).')
    : ' Attention : ' + (ex.raison || '') + (ex.formulaire && !ex.formulaire.ok ? ' Le livre n’a pas pu être ajouté au formulaire Extrait.' : ''));
  toast('Page publiée. ' + (res.courrielEnvoye ? 'Courriel de confirmation envoyé à l’auteur.' : 'Le courriel de confirmation n’a pas pu être envoyé.') + boutique + texteExtrait,
    (res.imageCatalogue && !res.imageCatalogue.ok) || !extraitOk ? 'mal' : 'ok');
  await demarrer();
}

async function payer() {

  corps.appendChild(paragraphe('Pour que l’équipe TBL vérifie puis publie votre page, le paiement de vos services est requis. Vous serez dirigé vers la page de paiement sécurisée du site.'));

  resume.appendChild(paragraphe('Frais de service (5' + NBSP + '%) : ' + argent(f.frais)));

  }
  if (vedettesModifiables()) {
    ligneAutre('En vedette' + (nbVed ? ' (' + argent(nbVed * PRIX_PLACE_VEDETTE) + ')' : ''), titresVed(LP.vedettes), titresVed(LC.vedettes), placesChangees(LP.vedettes, LC.vedettes) > 0);
  }
  sec2.appendChild(tb);
  rap.appendChild(sec2);
  racine.appendChild(rap);
  montrerVue('vue-rapport');
}

// ===== Démarrage =====
async function demarrer() {
  montrerVue('chargement');
  // Sans livre dans l'adresse : dans Wix, le code de la page recharge aussitôt la composante avec
  // ?livre=… ; on attend un peu avant d'afficher le message, pour ne pas le faire clignoter.
  if (!LIVRE_ID) {
    setTimeout(function () {
      montrerEtat(ICO_CADENAS, 'Aucun livre choisi', 'Ouvrez cet éditeur depuis l’onglet Livres de votre Espace Auteurs, avec le bouton « Modifier la page » de votre livre.', 'Retour à l’Espace Auteurs', fermerPage);
    }, 2500);
    return;
  }
  try {
    var d = await appeler('obtenir', { livreId: LIVRE_ID });
    if (traiterStatut(d)) { return; }
    // Lien périmé (après une validation, l'ancienne ligne est archivée) : on suit la ligne Publier actuelle
    if (d.livre && d.livre.id && d.livre.id !== LIVRE_ID) {
      LIVRE_ID = d.livre.id;
      try { history.replaceState(null, '', adresseVue(VUE, VUE === 'apercu' ? APPAREIL : undefined)); } catch (e) { /* ignore */ }
    }
    if (VUE === 'apercu') { montrerApercu(d); }
    else if (VUE === 'rapport') { montrerRapport(d); }
    else { montrerEdition(d); }
  } catch (e) {
    erreurChargement(e);
  }
}

brancherEdition();
demarrer();
</script>
